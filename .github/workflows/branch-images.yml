# Development images for branch pushes: ghcr.io/ncecere/grounded and
# ghcr.io/ncecere/grounded-ocr, tagged dev-<first 12 characters of the commit>,
# so a cluster development environment can run exactly that commit
# (dev-env up grounded <name> --ref <branch> in the homelab repo).
#
# These are development builds, built straight away: they do not wait for the
# tests (ci.yml) and are not scanned or signed.
#   - linux/amd64 only (the homelab runs amd64), one build per image;
#   - no latest, no version tag, no provenance or SBOM;
#   - a tag names one commit.
# Releases and the sha-<short> images of main are published by image.yml.
name: branch-images

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (default is the selected ref)
        required: false
        type: string

permissions:
  contents: read

# A newer push to the same branch replaces an older build of it.
concurrency:
  group: branch-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: grounded
            dockerfile: Dockerfile
          - image: grounded-ocr
            dockerfile: Dockerfile.ocr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Name the image
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "tag=dev-${sha:0:12}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.name.outputs.tag }}
            COMMIT=${{ steps.name.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.name.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "\`$IMAGE:$TAG\`"
            echo ""
            echo "digest \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
