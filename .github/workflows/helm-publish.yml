# No dispatch/push entry point. Only the gated future release caller may publish.
name: helm-publish
on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      ocr-digest:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: helm-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  chart:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install pinned render tools
        run: |
          bash deploy/helm/scripts/install-tools.sh
          echo "$PWD/bin/helm-tools" >> "$GITHUB_PATH"
          python3 -m pip install PyYAML==6.0.1
      - name: Package, publish immutable version, sign and attest digest
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ inputs.digest }}
          OCR_DIGEST: ${{ inputs.ocr-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/helm/scripts/publish.sh
