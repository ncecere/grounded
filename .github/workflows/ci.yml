name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: API tests
        run: bun run --filter @grounded/api test

      - name: Web tests
        run: bun run --filter @grounded/web test

      - name: Web bundle budget
        run: bun run --filter @grounded/web build:budget

      - name: Widget tests
        run: bun run --filter @grounded/widget test

      - name: Security audit
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
