# Builds, scans, signs and publishes ghcr.io/ncecere/grounded and the OCR
# sidecar ghcr.io/ncecere/grounded-ocr (Dockerfile.ocr, docs/ocr.md §3),
# with the same tags, SBOM, provenance, scan and signature.
#
# Called by ci.yml after the tests and manifest checks pass, on pushes to
# main (tag sha-<short>) and on v* tags (vX.Y.Z, vX.Y and, for final
# releases, latest-release). Nothing is tagged latest: deploy by the digest
# printed in the job summary.
#
# Every action is pinned by commit SHA; the comment gives the version.
name: image
on:
  workflow_call:
    outputs:
      digest:
        description: The pushed multi-arch image's digest (sha256:...)
        value: ${{ jobs.image.outputs.digest }}
      ocr-digest:
        description: The pushed multi-arch grounded-ocr image's digest (sha256:...)
        value: ${{ jobs.ocr-image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      IMAGE: ghcr.io/ncecere/grounded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          # Tags keep the git tag's "v" (v0.1.0, v0.1, v0.1.0-rc.2), as the docs,
          # overlays and release notes use; metadata-action's semver patterns drop it.
          # The full tag has the top priority: it is also outputs.version, the
          # version built into the binary (VERSION below). v0.1.0 shipped as "v0.1".
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_name }},priority=1000,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=^(v\d+\.\d+)\.\d+$,group=1,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest-release,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=grounded
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A release image must call itself by its tag: v0.1.0 shipped reporting
      # "v0.1". Runs before the scan and signing, so a wrong label never ships.
      - name: Check the built version (tags)
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          got=$(docker run --rm "${IMAGE}@${DIGEST}" version)
          echo "grounded version: ${got}"
          case "${got}" in
            "grounded ${TAG} ("*) ;;
            *) echo "::error::the image reports '${got}', not ${TAG}"; exit 1 ;;
          esac

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing the digest covers every tag. Only images that passed the scan
      # are signed.
      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Job summary
        if: always() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Image"
            echo
            echo "Deploy by digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Kustomize:"
            echo
            echo '```yaml'
            echo "images:"
            echo "  - name: ${IMAGE}"
            echo "    digest: ${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo "${TAGS}" | sed 's/^/- /'
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The OCR sidecar: built, scanned, signed and tagged like the main image.
  ocr-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      IMAGE: ghcr.io/ncecere/grounded-ocr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          # The same tags as the main image (see the image job).
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_name }},priority=1000,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=^(v\d+\.\d+)\.\d+$,group=1,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest-release,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=grounded-ocr
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ocr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=grounded-ocr
          cache-to: type=gha,mode=max,scope=grounded-ocr

      # The image must run Tesseract and, for tags, call itself by its tag.
      - name: Check the built image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          got=$(docker run --rm "${IMAGE}@${DIGEST}" version)
          echo "${got}"
          case "${got}" in
            *"tesseract 5."*) ;;
            *) echo "::error::the image does not run Tesseract 5: '${got}'"; exit 1 ;;
          esac
          if [ "${REF_TYPE}" = tag ]; then
            case "${got}" in
              "grounded-ocr ${TAG} ("*) ;;
              *) echo "::error::the image reports '${got}', not ${TAG}"; exit 1 ;;
            esac
          fi

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Job summary
        if: always() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## OCR sidecar image"
            echo
            echo "Deploy by digest (components/ocr-tesseract):"
            echo
            echo '```yaml'
            echo "images:"
            echo "  - name: ${IMAGE}"
            echo "    digest: ${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo "${TAGS}" | sed 's/^/- /'
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
