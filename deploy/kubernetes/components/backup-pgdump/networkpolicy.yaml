# The backup job reaches Postgres and, for the optional off-site copy, S3
# over https or an in-cluster S3 on TCP 9000. (components/postgres-single
# already admits the job on the Postgres side.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grounded-backup-egress
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: grounded
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: backup
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grounded
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
