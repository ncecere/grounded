# api and worker may send traces to the collector. Patch the namespace to
# where yours runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grounded-app-egress-tracing
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/part-of: grounded
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [grounded]
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
