apiVersion: v1
kind: ServiceAccount
metadata:
  name: grounded-objects-backup
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: grounded
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grounded-objects-backup
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: grounded
data:
  # The off-site target: empty UPLOAD_S3_BUCKET turns the job off.
  UPLOAD_S3_ENDPOINT: ""
  UPLOAD_S3_REGION: us-east-1
  UPLOAD_S3_BUCKET: ""
  UPLOAD_S3_PREFIX: grounded/objects
  # Changed or deleted files are kept this many days under previous/.
  PREVIOUS_RETENTION_DAYS: "14"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grounded-objects-backup
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: grounded
spec:
  # After the pg_dump (03:17), so a restore of both is close in time: the
  # database may then name a few files uploaded between the two, never the
  # reverse (restore.md, "Consistency").
  schedule: "47 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grounded
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: grounded
        spec:
          serviceAccountName: grounded-objects-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -ec]
              args:
                - |
                  if [ -z "$UPLOAD_S3_BUCKET" ]; then
                    echo "off-site copy disabled (UPLOAD_S3_BUCKET is empty)"
                    exit 0
                  fi
                  export RCLONE_CONFIG_SRC_TYPE=s3 RCLONE_CONFIG_SRC_PROVIDER=Other
                  export RCLONE_CONFIG_SRC_ENDPOINT="$S3_ENDPOINT" RCLONE_CONFIG_SRC_REGION="$S3_REGION"
                  export RCLONE_CONFIG_SRC_ACCESS_KEY_ID="$SRC_ACCESS_KEY" RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY="$SRC_SECRET_KEY"
                  export RCLONE_CONFIG_SRC_FORCE_PATH_STYLE="${S3_FORCE_PATH_STYLE:-true}"
                  export RCLONE_CONFIG_DST_TYPE=s3 RCLONE_CONFIG_DST_PROVIDER=Other
                  export RCLONE_CONFIG_DST_ENDPOINT="$UPLOAD_S3_ENDPOINT" RCLONE_CONFIG_DST_REGION="$UPLOAD_S3_REGION"
                  export RCLONE_CONFIG_DST_ACCESS_KEY_ID="$UPLOAD_ACCESS_KEY" RCLONE_CONFIG_DST_SECRET_ACCESS_KEY="$UPLOAD_SECRET_KEY"
                  export RCLONE_CONFIG_DST_NO_CHECK_BUCKET=true
                  src="src:${S3_BUCKET}"
                  [ -z "$S3_PREFIX" ] || src="${src}/${S3_PREFIX%/}"
                  dst="dst:${UPLOAD_S3_BUCKET}/${UPLOAD_S3_PREFIX}"
                  today="$(date -u +%Y%m%dT%H%M%SZ)"
                  rclone --config "" sync "$src" "${dst}/current" --backup-dir "${dst}/previous/${today}" \
                    --checksum --transfers 8 --stats-one-line --stats 60s -v
                  rclone --config "" size "${dst}/current"
                  rclone --config "" delete --min-age "${PREVIOUS_RETENTION_DAYS}d" "${dst}/previous" --rmdirs
                  echo "objects backup ok: ${UPLOAD_S3_BUCKET}/${UPLOAD_S3_PREFIX}/current"
              envFrom:
                - configMapRef:
                    name: grounded-config
                - configMapRef:
                    name: grounded-objects-backup
              env:
                - name: HOME
                  value: /tmp
                - name: SRC_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grounded-s3
                      key: access_key
                - name: SRC_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grounded-s3
                      key: secret_key
                - name: UPLOAD_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grounded-backup-s3
                      key: access_key
                      optional: true
                - name: UPLOAD_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grounded-backup-s3
                      key: secret_key
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
