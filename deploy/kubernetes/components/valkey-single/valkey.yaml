apiVersion: v1
kind: ServiceAccount
metadata:
  name: grounded-valkey
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: grounded
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grounded-valkey
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: grounded
spec:
  serviceName: grounded-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grounded
        app.kubernetes.io/component: valkey
        app.kubernetes.io/part-of: grounded
    spec:
      serviceAccountName: grounded-valkey
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # UID 999 is the valkey user of the image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          # No RDB/AOF: nothing in Valkey needs to survive a restart.
          # allkeys-lru: when full, evict (limits reset) rather than fail writes.
          args:
            - >-
              exec valkey-server --save "" --appendonly no
              --maxmemory 400mb --maxmemory-policy allkeys-lru
              --requirepass "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grounded-runtime
                  key: VALKEY_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command: [/bin/sh, -ec, 'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG']
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, 'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG']
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grounded-valkey
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: grounded
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
