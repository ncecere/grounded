# DATABASE_URL from the operator-generated secret grounded-postgres-app
# (key uri, which targets grounded-postgres-rw), for the migrate init
# container and the main container of grounded-api and grounded-worker.
# An explicit env entry wins over envFrom, so this overrides any
# DATABASE_URL in grounded-runtime.
- op: add
  path: /spec/template/spec/initContainers/0/env
  value:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: grounded-postgres-app
          key: uri
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: grounded-postgres-app
        key: uri
