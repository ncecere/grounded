apiVersion: v1
kind: ServiceAccount
metadata:
  name: grounded-postgres
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: grounded
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grounded-postgres
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: grounded
spec:
  serviceName: grounded-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grounded
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: grounded
    spec:
      serviceAccountName: grounded-postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # UID 999 is the postgres user of the image. Storage that maps UIDs
      # (NFS with squashing) may need a different runAsUser/fsGroup patch.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: grounded
            - name: POSTGRES_DB
              value: grounded
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grounded-runtime
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [pg_isready, -U, grounded, -d, grounded]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, grounded, -d, grounded]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, grounded, -d, grounded]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Parallel HNSW index builds use shared memory; the container
        # runtime's default /dev/shm is 64 MB. Counts against the memory limit.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grounded
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: grounded
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grounded-postgres-headless
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: grounded
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grounded-postgres
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: grounded
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
