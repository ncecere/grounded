apiVersion: v1
kind: ServiceAccount
metadata:
  name: grounded-tika
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: tika
    app.kubernetes.io/part-of: grounded
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grounded-tika
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: tika
    app.kubernetes.io/part-of: grounded
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grounded
        app.kubernetes.io/component: tika
        app.kubernetes.io/part-of: grounded
    spec:
      serviceAccountName: grounded-tika
      automountServiceAccountToken: false
      enableServiceLinks: false
      # UID 35002 is the tika user of the image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 35002
        runAsGroup: 35002
        fsGroup: 35002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: docker.io/apache/tika:4.0.0-1@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75 -Djava.io.tmpdir=/tmp
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grounded-tika
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: tika
    app.kubernetes.io/part-of: grounded
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: tika
  ports:
    - name: http
      port: 9998
      targetPort: http
      protocol: TCP
