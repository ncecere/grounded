apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grounded
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: grounded
spec:
  rules:
    - host: grounded.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grounded-api
                port:
                  name: http
