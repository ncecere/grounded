# grounded api: HTTP API and embedded web UI on :8080 (/healthz, /readyz,
# /metrics on the same port).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grounded-api
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: grounded
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grounded
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: grounded
    spec:
      serviceAccountName: grounded
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Must exceed SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT (grounded-config) so
      # in-flight SSE chats can finish before the pod is killed.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # API replicas spread evenly over nodes (DESIGN.md §15), one per node
      # while there are enough nodes: with DoNotSchedule a replica stays
      # Pending rather than double up on a node while another has fewer.
      # Nodes whose taints the pod does not tolerate (control planes) are
      # left out of the count, so they cannot block scheduling. Zones are
      # best effort.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grounded
              app.kubernetes.io/component: api
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grounded
              app.kubernetes.io/component: api
          matchLabelKeys: [pod-template-hash]
      initContainers:
        # Applies pending migrations before the new version serves traffic.
        # A Postgres advisory lock serialises concurrent runs, so every
        # starting pod may run it; migrations are expand/contract (ADR-0013).
        - name: migrate
          image: ghcr.io/ncecere/grounded
          imagePullPolicy: IfNotPresent
          args: [migrate]
          envFrom:
            - configMapRef:
                name: grounded-config
            - secretRef:
                name: grounded-runtime
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: ghcr.io/ncecere/grounded
          imagePullPolicy: IfNotPresent
          args: [api]
          envFrom:
            - configMapRef:
                name: grounded-config
            - secretRef:
                name: grounded-runtime
            - secretRef:
                name: grounded-smtp
                optional: true
          env:
            - name: MIGRATE_ON_START
              value: "false"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-s3
                  key: access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-s3
                  key: secret_key
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grounded-api
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: grounded
spec:
  # One pod at a time, whatever the replica count; pods that are not ready
  # never block a node drain.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: api
