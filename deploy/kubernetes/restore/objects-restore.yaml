# Copies the backup-objects off-site copy back into Grounded's bucket
# (docs/operations/restore.md). Apply it in Grounded's namespace with the app
# stopped, after creating the ConfigMap grounded-restore with the bucket to
# restore into (the same values as grounded-config):
#
#   kubectl -n <ns> create configmap grounded-restore \
#     --from-literal=S3_ENDPOINT=https://s3.example.org --from-literal=S3_BUCKET=grounded
#   kubectl -n <ns> apply -f deploy/kubernetes/restore/objects-restore.yaml
#
# Optional keys: S3_REGION, S3_PREFIX (as in grounded-config) and SNAPSHOT
# (default current; previous/<time> holds files changed or deleted after
# that run). It copies and never deletes: files already in the bucket stay.
# Off-site settings come from the grounded-objects-backup ConfigMap and the
# grounded-backup-s3 secret, the bucket's credentials from grounded-s3.
apiVersion: batch/v1
kind: Job
metadata:
  name: grounded-objects-restore
  labels:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: grounded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grounded
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: grounded
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              : "${S3_ENDPOINT:?set S3_ENDPOINT in the grounded-restore ConfigMap}" "${S3_BUCKET:?set S3_BUCKET in the grounded-restore ConfigMap}"
              export RCLONE_CONFIG_SRC_TYPE=s3 RCLONE_CONFIG_SRC_PROVIDER=Other
              export RCLONE_CONFIG_SRC_ENDPOINT="$UPLOAD_S3_ENDPOINT" RCLONE_CONFIG_SRC_REGION="$UPLOAD_S3_REGION"
              export RCLONE_CONFIG_SRC_ACCESS_KEY_ID="$UPLOAD_ACCESS_KEY" RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY="$UPLOAD_SECRET_KEY"
              export RCLONE_CONFIG_DST_TYPE=s3 RCLONE_CONFIG_DST_PROVIDER=Other
              export RCLONE_CONFIG_DST_ENDPOINT="$S3_ENDPOINT" RCLONE_CONFIG_DST_REGION="${S3_REGION:-us-east-1}"
              export RCLONE_CONFIG_DST_ACCESS_KEY_ID="$DST_ACCESS_KEY" RCLONE_CONFIG_DST_SECRET_ACCESS_KEY="$DST_SECRET_KEY"
              export RCLONE_CONFIG_DST_NO_CHECK_BUCKET=true
              src="src:${UPLOAD_S3_BUCKET}/${UPLOAD_S3_PREFIX}/${SNAPSHOT:-current}"
              dst="dst:${S3_BUCKET}"
              [ -z "${S3_PREFIX:-}" ] || dst="${dst}/${S3_PREFIX%/}"
              rclone --config "" copy "$src" "$dst" --checksum --transfers 8 --stats-one-line --stats 60s -v
              rclone --config "" check "$src" "$dst" --one-way
              rclone --config "" size "$dst"
              echo "objects restore ok: ${S3_BUCKET}"
          envFrom:
            - configMapRef:
                name: grounded-objects-backup
            - configMapRef:
                name: grounded-restore
          env:
            - name: HOME
              value: /tmp
            - name: UPLOAD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-backup-s3
                  key: access_key
            - name: UPLOAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-backup-s3
                  key: secret_key
            - name: DST_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-s3
                  key: access_key
            - name: DST_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grounded-s3
                  key: secret_key
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
