# Test fixture for `make k8s-smoke` (scripts/kind-smoke.sh): the
# example-small shape on a throwaway kind cluster, with a locally built
# image, a disposable S3 server and DEV_AUTH (allowed only because APP_URL is
# loopback). Not an example install: see ../../overlays.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grounded-smoke

resources:
  - namespace.yaml
  - ../../base
  - s3.yaml

components:
  - ../../components/postgres-single
  - ../../components/valkey-single
  - ../../components/backup-pgdump
  - ../../components/ingress

images:
  - name: ghcr.io/ncecere/grounded
    newName: grounded
    newTag: smoke

patches:
  # CI runners have 2 vCPUs and kind's control plane requests about 0.9 of
  # them, so the smoke test asks for token CPU. Limits are unchanged.
  - target:
      kind: Deployment
      name: grounded-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: Deployment
      name: grounded-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: StatefulSet
      name: grounded-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: StatefulSet
      name: grounded-valkey
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grounded-config
      data:
        APP_URL: http://localhost:8080
        DEV_AUTH: "true"
        S3_ENDPOINT: http://grounded-smoke-s3:9000
        S3_BUCKET: grounded
        LOG_LEVEL: debug
  - target:
      kind: PersistentVolumeClaim
      name: grounded-postgres-backups
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: StatefulSet
      name: grounded-postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
