# Test-only access: the API on a node port for the load generator (the
# fake model gateway's NetworkPolicies are in ../fake-models). Never add
# these to a real install.
apiVersion: v1
kind: Service
metadata:
  name: grounded-api-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grounded
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
# Node-port traffic arrives from the node, not from the ingress controller's
# namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grounded-test-api-nodeport
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grounded
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
