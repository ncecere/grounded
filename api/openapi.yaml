openapi: 3.0.3
info:
  title: Grounded API
  version: 0.1.0
  description: |
    Browser sessions and API keys share the same `/v1` routes; the credential
    decides what is allowed. Success responses are `{"data": ...}` and errors are
    `{"error": {"code": "...", "message": "..."}}`.

    Browser writes require the session's `X-CSRF-Token` header (from `GET /v1/me`)
    and a same-origin `Origin`.

    Every route served by the application must be listed here; a test enforces it.
tags:
  - name: operations
  - name: auth
  - name: me
  - name: notifications
    description: In-app notifications and the caller's notification settings
  - name: teams
  - name: classifications
  - name: admin
  - name: sources
  - name: web
    description: Web sources, crawls, the crawl allowlist and domain requests
  - name: kbs
  - name: apikeys
  - name: limits
    description: Team limits (defaults, ceilings and overrides) and usage
  - name: agents
    description: Team agents, drafts, versions and analytics
  - name: chat
    description: The agent directory, chat, conversations and feedback
  - name: search
    description: Finding objects by name for the command palette (⌘K)
  - name: openai
    description: The OpenAI-compatible API for agents
  - name: breakglass
    description: >-
      Break-glass: a platform admin's time-boxed, audited read access to one
      team's conversations and documents (ADR-0011, ADR-0024)
  - name: public
    description: >-
      Public agents for anonymous visitors: profiles, anonymous sessions and
      chat, the widget loader and the embed page (docs/phase4-publishing.md
      §5-§7). No other API is available anonymously.
paths:
  /healthz:
    get:
      tags: [operations]
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200": { $ref: "#/components/responses/HealthReply" }
  /readyz:
    get:
      tags: [operations]
      operationId: getReadyz
      summary: Readiness probe (dependencies reachable and not draining)
      responses:
        "200": { $ref: "#/components/responses/HealthReply" }
        "503": { $ref: "#/components/responses/HealthReply" }
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
  /widget.js:
    get:
      tags: [public]
      operationId: getWidgetScript
      summary: The embeddable widget loader (cached for 5 minutes; the integrity hash is in GET .../sharing)
      description: >-
        Usage: <script src="https://rag.example.edu/widget.js" data-agent="{agentId}"
        data-key="pk_..." data-position="bottom-right" async></script>. It adds a
        launcher button that opens the embed page in an iframe panel.
      responses:
        "200":
          description: JavaScript
          content:
            application/javascript:
              schema: { type: string }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /embed/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [public]
      operationId: getEmbedPage
      summary: The widget's chat page (framed by allowed origins only)
      description: >-
        Checks the publishable key, the agent's status and audience, and the
        public switch. Content-Security-Policy frame-ancestors lists 'self'
        and the key's allowed origins; X-Frame-Options is not sent. A Referer
        from another origin must be allowed. With preview=1 (and no key) it is
        the editor's same-origin preview for team members.
      parameters:
        - name: key
          in: query
          required: false
          description: The publishable key (pk_...)
          schema: { type: string }
        - name: preview
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The chat page
          content:
            text/html:
              schema: { type: string }
        "403":
          description: Invalid key, origin not allowed, or the agent is disabled (the page explains)
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Not a public agent (the page explains)
          content:
            text/html:
              schema: { type: string }
        "503":
          description: Public agents are turned off (the page explains)
          content:
            text/html:
              schema: { type: string }
  /auth/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: Start single sign-on (redirects to the identity provider)
      parameters:
        - name: next
          in: query
          required: false
          description: Same-origin path to return to after sign-in.
          schema: { type: string }
      responses:
        "302": { description: Redirect to the identity provider }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "429": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /auth/callback:
    get:
      tags: [auth]
      operationId: completeLogin
      summary: OIDC redirect target
      responses:
        "303": { description: Signed in; redirect into the app }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /auth/dev:
    post:
      tags: [auth]
      operationId: devLogin
      summary: Development sign-in (only when DEV_AUTH=true on a loopback APP_URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevLoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current browser session
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Sign-in methods and instance identity for the web UI
      responses:
        "200":
          description: Sign-in configuration
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthConfig" }
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user, CSRF token and capabilities
      parameters:
        - name: optional
          in: query
          required: false
          description: >-
            With true, a request without a session cookie gets data null
            (200) instead of a 401, for pages that work signed out. An expired
            session is still a 401 (and clears the cookie).
          schema: { type: boolean }
      responses:
        "200":
          description: Current user (null only with optional=true and no session cookie)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Me" }]
        "401": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's in-app notifications, newest first, with the unread count
      parameters:
        - name: unread
          in: query
          required: false
          description: Only unread notifications
          schema: { type: boolean }
        - name: type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/NotificationType" }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [notifications]
      operationId: updateNotification
      summary: Mark one of the caller's notifications read or unread
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationUpdate" }
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Notification" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every unread notification read (optionally of one type)
      description: >-
        Without a body (or without type) every unread notification is marked
        read; with type, only that type's. The inbox sends the type it is
        filtered to and labels the button "Mark these as read".
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReadAll" }
      responses:
        "200":
          description: How many notifications changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/NotificationReadAllResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
  /v1/me/notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The caller's channels for every notification type
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Change the caller's channels for some notification types
      description: |
        Types not listed keep their current setting. Mandatory types can't be
        turned off (400 notification_mandatory).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
  /v1/classifications:
    get:
      tags: [classifications]
      operationId: listClassifications
      summary: Classification levels, least to most sensitive
      responses:
        "200":
          description: Levels ordered by rank
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Classification" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams:
    get:
      tags: [teams]
      operationId: listMyTeams
      summary: Teams the caller belongs to
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MyTeam" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [teams]
      operationId: getTeam
      summary: A team the caller belongs to (platform admins and auditors see any team)
      responses:
        "200":
          description: Team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamView" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/members:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [teams]
      operationId: listMembers
      summary: Team members
      responses:
        "200":
          description: Members, owners first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [teams]
      operationId: addMember
      summary: Add a member by email, or invite them if they have never signed in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberAdd" }
      responses:
        "201":
          description: Added or invited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MemberAddResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/UserIdParam"
    patch:
      tags: [teams]
      operationId: updateMember
      summary: Change a member's role
      description: >-
        409 sso_managed (details {ruleId, group}) when an SSO group mapping
        rule manages the membership: the role would be set back at the
        person's next sign-in. 409 last_owner for the team's only owner.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated member
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [teams]
      operationId: removeMember
      summary: Remove a member, or leave the team (your own user ID)
      description: >-
        409 sso_managed (details {ruleId, group}) when an SSO group mapping
        rule manages the membership: the person would be added again at their
        next sign-in. 409 last_owner for the team's only owner.
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/invites:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [teams]
      operationId: listInvites
      summary: Open email invites
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teams]
      operationId: revokeInvite
      summary: Revoke an open invite
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/audit:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [teams]
      operationId: listTeamAudit
      summary: The team's audit log (owners, admins and editors)
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/AuditActionParam"
        - $ref: "#/components/parameters/AuditExcludeActionParam"
        - $ref: "#/components/parameters/AuditActorParam"
        - $ref: "#/components/parameters/AuditTargetTypeParam"
        - $ref: "#/components/parameters/AuditFromParam"
        - $ref: "#/components/parameters/AuditToParam"
      responses:
        "200": { $ref: "#/components/responses/AuditPageReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/audit/{entryId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: entryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [teams]
      operationId: getTeamAuditEntry
      summary: One entry of the team's audit log, for a linked entry (owners, admins and editors)
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/limits:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [limits, teams]
      operationId: getTeamLimits
      summary: The team's effective limits and current usage (team members; platform admins and auditors)
      responses:
        "200":
          description: Limits and usage
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamLimits" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: All users (platform admins and auditors), with how many teams each belongs to
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PlatformRole" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of users ordered by email
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserIdParam"
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: A user and their team memberships
      responses:
        "200":
          description: User
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UserDetail" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      summary: Change a user's platform role or suspend/reactivate them
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/teams:
    get:
      tags: [admin]
      operationId: adminListTeams
      summary: All teams (platform admins and auditors)
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TeamStatus" }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of teams ordered by slug
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamPage" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin]
      operationId: adminCreateTeam
      summary: Create a team and assign its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamCreated" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/teams/{team}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [admin]
      operationId: adminGetTeam
      summary: A team with membership counts
      responses:
        "200":
          description: Team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamSummary" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [admin]
      operationId: adminUpdateTeam
      summary: Change team details, approved classification, or archive/unarchive it
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamUpdate" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamSummary" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/teams/{team}/owners:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    post:
      tags: [admin]
      operationId: adminAssignOwner
      summary: Make someone an owner of a team (promotes, adds or invites)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerAssign" }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
