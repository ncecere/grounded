    ModerationEvent:
      type: object
      required: [id, at, agentId, agentName, agentSlug, teamSlug, agentDeleted, channel, audience, stage, decision, topCategory, score, categories, downgraded, provider, calibrated, latencyMs]
      properties:
        id: { type: integer, format: int64, description: The answer's event ID (both stages of an answer share it) }
        at: { type: string, format: date-time }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        agentSlug: { type: string }
        teamSlug: { type: string }
        agentDeleted: { type: boolean }
        channel: { type: string, enum: [ui, api, openai, public, widget] }
        audience: { $ref: "#/components/schemas/Audience" }
        stage: { type: string, enum: [input, output] }
        decision: { type: string, enum: [block, flag, support, error] }
        topCategory: { type: string, description: "The category that decided; '' for provider errors" }
        score: { type: number, format: double }
        categories: { type: array, items: { type: string }, description: Every category that triggered }
        downgraded:
          type: array
          items: { type: string }
          description: >-
            Categories whose block rule only flagged because the provider is
            not calibrated and the score was below the policy's
            uncalibratedBlockThreshold
        provider: { type: string }
        calibrated: { type: boolean }
        latencyMs: { type: integer, format: int64 }
    ModerationEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModerationEvent" }
        nextCursor: { type: string, nullable: true }
    AccessLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccessLogEntry" }
        nextCursor: { type: string, nullable: true }
    OpenAIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string, example: invalid_request_error }
            code: { type: string, nullable: true }
            param: { type: string, nullable: true }
    OpenAIModel:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id: { type: string, example: "agent:office-of-the-registrar/student-help" }
        object: { type: string, enum: [model] }
        created: { type: integer, format: int64 }
        owned_by: { type: string }
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/OpenAIModel" }
    OpenAIChatMessage:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content: { description: A string or an array of content parts (text parts are used) }
    OpenAIChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, description: "agent:{team}/{slug}" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/OpenAIChatMessage" }
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean }
        n: { type: integer, description: Must be 1 }
        tools: { type: array, items: { type: object }, description: Not supported (400) }
    OpenAIUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        completion_tokens_details:
          type: object
          properties:
            reasoning_tokens: { type: integer }
    OpenAIChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage, citations]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message:
                type: object
                required: [role, content]
                properties:
                  role: { type: string, enum: [assistant] }
                  content: { type: string }
                  reasoning_content: { type: string }
              finish_reason: { type: string, enum: [stop, length] }
        usage: { $ref: "#/components/schemas/OpenAIUsage" }
        citations:
          type: array
          description: Extension field; the sources referenced by [n] in content
          items: { $ref: "#/components/schemas/Citation" }
