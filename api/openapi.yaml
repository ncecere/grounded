        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/legal-holds/{holdId}/release:
    parameters:
      - $ref: "#/components/parameters/HoldIdParam"
    post:
      tags: [admin]
      operationId: adminReleaseLegalHold
      summary: Release a legal hold (platform admins with a session; audited as legal_hold.release)
      description: >-
        Retention deletes what the hold kept, if its period has passed, at the
