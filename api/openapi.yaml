      operationId: adminPreviewGroupRule
      summary: Dry run of a rule change (platform admins and auditors; changes nothing)
      description: >-
        Who a new rule (group, team, role), an existing rule's new group and
        role (ruleId, group, role), or deleting a rule (ruleId, delete) would
        add, raise, lower or remove, from each person's groups at their last
        sign-in. Also lists matching people left alone: members added by hand
