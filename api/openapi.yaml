                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [sources]
      operationId: deleteDocument
      summary: Delete a document with its chunks
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/sources/{sourceId}/documents/{documentId}/passages:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sources]
      operationId: listDocumentPassages
      summary: A document's first passages (session, or an API key with the query scope)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The first passages, in document order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DocumentPassagePage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/sources/{sourceId}/tags:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sources]
      operationId: listSourceTags
      summary: The tags used by a source's documents, for filters (session, or an API key with the query scope)
      responses:
        "200":
          description: Tags, alphabetically (at most 200)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/sources/{sourceId}/documents/{documentId}/retry:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [sources]
      operationId: retryDocument
      summary: Queue a failed or skipped document again
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/teams/{team}/sources/{sourceId}/documents/{documentId}/refetch:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/SourceIdParam"
      - $ref: "#/components/parameters/DocumentIdParam"
    post:
      tags: [web]
      operationId: refetchDocument
      summary: Fetch one page of a web source again now (editors and above)
      description: >-
        Starts a crawl run (trigger "page") of just this page's URL: it is
        fetched, stored and indexed again if it changed. Links aren't followed
        and no other page is touched or removed, and the source's schedule
        doesn't change. The run counts toward the team's crawl limits like any
        other. Only pages of web sources can be re-fetched (400
        not_web_document); a source with an active run answers 409
        crawl_in_progress.
      responses:
        "202":
          description: The run was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Crawl" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/CrawlInProgressReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/teams/{team}/sources/{sourceId}/sync:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/SourceIdParam"
    post:
      tags: [web]
      operationId: syncSource
      summary: Start a crawl of a web source (editors and above, or an API key with the ingest scope)
      responses:
        "202":
          description: The crawl was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Crawl" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/CrawlInProgressReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/teams/{team}/sources/{sourceId}/boilerplate:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [sources]
      operationId: listBoilerplateBlocks
      summary: The source's most repeated blocks, left out of its chunks (session, or an API key with the query scope)
      description: >-
        Blocks (navigation, footers, cards) found in at least the source's threshold of documents,
        most documents first. Each keeps one copy, in the document with the shortest URL (ADR-0021).
      parameters:
        - $ref: "#/components/parameters/BoilerplateLimitParam"
      responses:
        "200": { $ref: "#/components/responses/BoilerplateBlockListReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/sources/{sourceId}/crawls:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [web]
      operationId: listCrawls
      summary: Crawl runs of a source, newest first (session, or an API key with the query scope)
      parameters:
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200": { $ref: "#/components/responses/CrawlListReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/sources/{sourceId}/crawls/{crawlId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/SourceIdParam"
      - $ref: "#/components/parameters/CrawlIdParam"
    post:
      tags: [web]
      operationId: cancelCrawl
      summary: Cancel an active crawl; the crawler stops before its next page (editors and above, or an API key with the ingest scope)
      responses:
        "200": { $ref: "#/components/responses/CrawlReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/web/map:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    post:
      tags: [web]
      operationId: mapSite
      summary: Preview the URLs a crawl would discover from one page (its links and, optionally, sitemaps). Synchronous, at most 30 s; nothing is stored. Editors and above, or an API key with the ingest scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRequest" }
      responses:
        "200":
          description: Discovered URLs, in scope and allowed for the team
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MapResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "422": { $ref: "#/components/responses/ErrorReply" }
        "502": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/teams/{team}/domain-requests:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [web]
      operationId: listTeamDomainRequests
      summary: The team's requests to crawl hosts outside the allowlist, newest first
      responses:
        "200": { $ref: "#/components/responses/DomainRequestListReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [web]
      operationId: createDomainRequest
      summary: Ask platform admins to allow a host pattern for this team (editors and above)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainRequestCreate" }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DomainRequest" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/shared-sources:
    get:
      tags: [sources]
      operationId: listSharedSources
      summary: Platform-shared sources a team can attach to its knowledge bases (metadata and document counts only)
      responses:
        "200":
          description: Shared sources
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SharedSource" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/kbs:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [kbs]
      operationId: listKnowledgeBases
      summary: Knowledge bases (session, or an API key with the query scope)
      responses:
        "200":
          description: Knowledge bases
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeBase" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [kbs]
      operationId: createKnowledgeBase
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KnowledgeBase" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/LimitReachedReply" }
  /v1/teams/{team}/kbs/{kbId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: kbId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [kbs]
      operationId: getKnowledgeBase
      summary: One knowledge base (session, or an API key with the query scope)
      responses:
        "200":
          description: Knowledge base
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KnowledgeBase" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [kbs]
      operationId: updateKnowledgeBase
      summary: Rename or change retrieval settings
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseUpdate" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KnowledgeBase" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [kbs]
      operationId: deleteKnowledgeBase
      summary: Delete a knowledge base (its sources are kept)
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/kbs/{kbId}/profile-migration:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: kbId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [kbs]
      operationId: getKnowledgeBaseProfileMigration
      summary: The knowledge base's running or switched profile migration, or null (team members with a session)
      description: >-
        Platform admins start and manage migrations (Admin, Profile
        migrations); team members see the progress on the knowledge base.
      responses:
        "200":
          description: The active migration, with per-source progress, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf: [{ $ref: "#/components/schemas/ProfileMigration" }]
                    nullable: true
        "401": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/kbs/{kbId}/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: kbId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [kbs]
      operationId: attachSource
      summary: Add a data source to the knowledge base
      description: "Refused with 409 classification_impact (details: ClassificationImpact with agents) when the source's classification would raise the knowledge base above what a published agent using it may serve (ADR-0006 rule 6)."
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KnowledgeBase" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [kbs]
      operationId: detachSource
      summary: Remove a data source from the knowledge base
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KnowledgeBase" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/kbs/{kbId}/retrieve:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: kbId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [kbs]
      operationId: retrieve
      summary: Hybrid search over the knowledge base, with citations (session, or an API key with the query scope)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetrieveRequest" }
      responses:
        "200":
          description: Ranked chunks
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetrieveResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "429": { $ref: "#/components/responses/RateLimitedReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/api-keys:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [apikeys]
      operationId: listAPIKeys
      summary: Active API keys (team admins see all; others see their own)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [apikeys]
      operationId: createAPIKey
      summary: Create an API key; the secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIKeyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/APIKeyCreated" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [apikeys]
      operationId: getAPIKey
      summary: One API key, including a revoked one (team admins see every key; others their own personal keys)
      description: >-
        Unlike the list, which shows active keys only, this returns a revoked
        key too (with revokedAt), so links to a key (for example from the
        audit log) keep working after it is revoked.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/APIKey" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [apikeys]
      operationId: updateAPIKeyContact
      summary: Reassign a service key's responsible contact (team admins and owners; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responsibleUserId]
              properties:
                responsibleUserId: { type: string, format: uuid, description: An active member of the team }
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/APIKey" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [apikeys]
      operationId: revokeAPIKey
      summary: Revoke an API key
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/crawl-allowlist:
    get:
      tags: [admin, web]
      operationId: adminListCrawlAllowlist
      summary: Host patterns every team may crawl
      responses:
        "200":
          description: Allowlist
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AllowlistEntry" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin, web]
      operationId: adminAddCrawlAllowlist
      summary: Allow a host pattern for every team ("*" allows every public host; SSRF protection still applies)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowlistCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AllowlistEntry" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/crawl-allowlist/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin, web]
      operationId: adminRemoveCrawlAllowlist
      summary: Remove a host pattern; running crawls stop fetching its hosts within 30 s
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/overview:
    get:
      tags: [admin]
      operationId: adminGetOverview
      summary: Platform counts and attention items for the admin Overview (platform admins and auditors)
      description: >-
        Teams, users and content counts, failed documents by team (top 10;
        a null team is the platform-shared sources), the resource caps of
        active teams used at 80% or more, fullest first, and the
        production-readiness warnings (also logged at startup and printed by
        `grounded doctor`). Pending domain requests are in GET
        /v1/admin/attention.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminOverview" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/attention:
    get:
      tags: [admin]
      operationId: adminGetAttention
      summary: Counts of things waiting for a platform admin, for sidebar badges (platform admins and auditors)
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAttention" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/domain-requests:
    get:
      tags: [admin, web]
      operationId: adminListDomainRequests
      summary: Domain requests across teams, pending first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DomainRequestStatus" }
      responses:
        "200": { $ref: "#/components/responses/DomainRequestListReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/domain-requests/{requestId}/review:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin, web]
      operationId: adminReviewDomainRequest
      summary: Approve or deny a pending request, or revoke an approved one (takes effect on the next fetch)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainReview" }
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DomainRequest" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/shared-source-usage:
    get:
      tags: [admin, sources]
