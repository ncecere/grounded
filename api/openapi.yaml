    post:
      tags: [admin, web]
      operationId: adminCancelSharedCrawl
      summary: Cancel an active crawl of a shared source
      responses:
        "200": { $ref: "#/components/responses/CrawlReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [agents]
      operationId: listAgents
      summary: The team's agents (members; or an API key of the team)
      responses:
        "200":
          description: Agents, by name. Warnings are only computed by GET of one agent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create an agent with a draft (editors). The audience is the team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreate" }
            example:
              name: Student help
              description: Answers questions about registration and records.
              config:
                chatModelId: 6f1c1a0e-3b2a-4d59-9a57-2f0f5b4d8c11
                kbs: [{ kbId: 0b5e2d3c-1a4f-4c6e-8f7a-9d0e1c2b3a4f, topK: 6 }]
                instructions: Answer briefly and point to the right office.
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/AgentConfigErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/LimitReachedReply" }
  /v1/teams/{team}/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [agents]
      operationId: getAgent
      summary: An agent with its draft, published version summary and warnings
      responses:
        "200":
          description: Agent
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Change profile fields and/or replace the draft config (editors). The draft is checked leniently.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpdate" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/AgentConfigErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Delete an agent (team admins). Soft delete; its conversations stay readable by their owners but can't continue.
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/publish:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [agents]
      operationId: publishAgent
      summary: Validate the draft strictly and publish it as a new immutable version (editors)
      description: >-
        The draft's audience becomes the agent's grant. 403 audience_forbidden
        when an editor publishes beyond the team; 422 agent_invalid when the
        classification's max audience is exceeded (field audience); 409
        public_disabled while public access is off and 409
        moderation_not_ready without a working public moderation policy.
        Publishing to a wider audience than before notifies the team's owners.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPublish" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentVersion" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "422": { $ref: "#/components/responses/AgentInvalidReply" }
  /v1/teams/{team}/agents/{agentId}/versions:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [agents]
      operationId: listAgentVersions
      summary: Published versions, newest first
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgentVersion" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
      - name: version
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    get:
      tags: [agents]
      operationId: getAgentVersion
      summary: One published version with its configuration
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentVersion" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/revert:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [agents]
      operationId: revertAgent
      summary: Copy a published version's configuration into the draft (editors)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRevert" }
      responses:
        "200":
          description: The agent with the reverted draft
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/status:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [agents]
      operationId: setAgentStatus
      summary: Disable or enable the agent for the team (team admins). A platform kill switch (403 agent_disabled_by_platform) can't be cleared here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentStatusChange" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/test:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [agents, chat]
      operationId: testAgent
      summary: Chat with the draft (editors). Nothing is saved to conversations; usage and analytics use channel test.
      description: >-
        The same pipeline and response as POST /v1/agents/{team}/{agent}/chat, on
        the draft configuration. The draft must pass publish validation (422
        agent_invalid). conversation.conversationId and agentVersion are null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestChatRequest" }
      responses:
        "200": { $ref: "#/components/responses/ChatReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "422": { $ref: "#/components/responses/AgentInvalidReply" }
        "429": { $ref: "#/components/responses/RateLimitedReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/analytics:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [agents]
      operationId: getAgentAnalytics
      summary: Aggregates without content or identities (editors, admins, owners). Test chats are excluded except from channels.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFromParam"
        - $ref: "#/components/parameters/AnalyticsToParam"
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentAnalytics" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/sharing:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [agents]
      operationId: getAgentSharing
      summary: Audiences the caller could publish the draft to (and why not), links and the widget (members)
      responses:
        "200":
          description: Sharing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentSharing" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/widget-origins/check:
    post:
      tags: [agents, public]
      operationId: checkWidgetOrigins
      summary: Normalise allowed origins for a widget key without saving (signed-in users)
      description: >-
        Each origin as it would be saved, or the problem with it. An origin
        without a scheme gets http:// for the local machine (localhost,
        127.0.0.1, [::1], *.localhost) and https:// otherwise; default ports
        are dropped and hosts lower-cased.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origins]
              properties:
                origins: { type: array, maxItems: 50, items: { type: string, maxLength: 300 } }
            example: { origins: ["localhost:8095", "www.example.edu", "https://example.edu/page"] }
      responses:
        "200":
          description: One result per non-empty input, in order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WidgetOriginCheck" }
        "400": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/publishable-keys:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [agents, public]
      operationId: listPublishableKeys
      summary: The agent's publishable keys for the widget (team admins and owners)
      responses:
        "200":
          description: Keys (not revoked)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PublishableKey" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [agents, public]
      operationId: createPublishableKey
      summary: Create a publishable key (team admins and owners; audited). The full key is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishableKeyInput" }
            example: { name: Main website, allowedOrigins: ["https://www.example.edu", "https://*.example.edu"] }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublishableKeyCreated" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/agents/{agentId}/publishable-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentIdParam"
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [agents, public]
      operationId: updatePublishableKey
      summary: Rename a key, change its allowed origins or limits, or enable/disable it (team admins and owners; audited)
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishableKeyInput" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublishableKey" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [agents, public]
      operationId: revokePublishableKey
      summary: Revoke a key for good; widgets using it stop at once (team admins and owners; audited)
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/agents/{agentRef}:
    parameters:
      - name: agentRef
        in: path
        required: true
        description: The agent's ID or short name
        schema: { type: string }
    get:
      tags: [public]
      operationId: getPublicAgent
      summary: A public agent's profile for anonymous visitors (no sign-in; Access-Control-Allow-Origin *, for the widget loader)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicAgent" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/teams/{team}/agents/{agent}:
    parameters:
      - name: team
        in: path
        required: true
        description: The team's slug
        schema: { type: string }
      - name: agent
        in: path
        required: true
        description: The agent's slug
        schema: { type: string }
    get:
      tags: [public]
      operationId: getPublicAgentByTeam
      summary: A public agent's profile by its team address (/a/{team}/{agent}), for anonymous visitors
      description: The same as GET /v1/public/agents/{agentRef}; 404 unless the agent is published to the public audience.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicAgent" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/agents/{agentId}/widget-check:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [public]
      operationId: widgetCheck
      summary: Whether widget.js may show its launcher on the calling page (no sign-in; Access-Control-Allow-Origin *)
      description: >-
        Checks the publishable key, the page's origin (the Origin header, or
        ?origin= when the browser sends none) against the key's allowed
        origins, the public switch and the agent's status. Always 200 for a
        valid agent ID: allowed false comes with the reason (code and
        message) for the site owner's console. The key's allowed origins are
        never returned.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: origin
          in: query
          required: false
          description: The page's origin, used only when the request has no Origin header
          schema: { type: string }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WidgetCheck" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/sessions:
    post:
      tags: [public]
      operationId: createPublicSession
      summary: Start an anonymous session with a public agent (sets the session cookie)
      description: >-
        The cookie (grounded_anon_{agentId without dashes}, HttpOnly, path
        /v1/public) holds a random secret stored only as a digest, with the
        agent, the caller's /24 (IPv4) or /48 (IPv6) prefix and a user-agent
        hash. It is SameSite=None; Secure; Partitioned for the widget (on
        HTTPS) and SameSite=Lax for the public page, and lasts ANON_SESSION_TTL
        after the last use. With a publishable key (the widget) the request's
        Origin (when cross-origin) and embedOrigin must be allowed by the key
        (403 origin_not_allowed), and at least one must be given. CAPTCHA runs
        when configured (403 captcha_failed). Errors: 503 public_disabled, 404
        for agents that are not public, 403 agent_disabled (kill switch), 403
        invalid_publishable_key, 429/503 from the guardrails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicSessionCreate" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicSession" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "429": { $ref: "#/components/responses/RateLimitedReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/sessions/current:
    get:
      tags: [public]
      operationId: getPublicSession
      summary: The anonymous session for an agent and its current conversation (401 without a live session)
      parameters:
        - name: agentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicSessionState" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/public/agents/{agentId}/chat:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [public]
      operationId: publicChat
      summary: Ask a public agent as an anonymous visitor (needs the session cookie)
      description: >-
        The same events as POST /v1/agents/{team}/{agent}/chat. Public answers
        are moderated in buffer mode by default, so text arrives after the
        output check. The conversation is the session's current one;
        newConversation starts another. Guardrails run first: 400
        message_too_long (public_message_max_chars), 429 rate_limited (per
        address or session, or too many concurrent chats) and quota_exceeded
        (daily caps) with Retry-After, 503 limits_unavailable when rate limits
        can't be checked (fail closed), 503 public_disabled, 403 agent_disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicChatRequest" }
      responses:
        "200": { $ref: "#/components/responses/ChatReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "429": { $ref: "#/components/responses/RateLimitedReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/agents:
    get:
      tags: [chat]
      operationId: listAgentDirectory
      summary: Agents the caller may chat with (published and active)
      description: >-
        The caller's team agents (group team), every all_authenticated agent of
        other teams (group organisation) and, while public access is on, every
        public agent of other teams (group public). At most 500, by name. API
        keys see their team's agents.
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: team
          in: query
          required: false
          description: Only this team's agents (slug or ID)
          schema: { type: string }
      responses:
        "200":
          description: Agent profiles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgentCard" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/agents/{team}/{agent}:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentSlugParam"
    get:
      tags: [chat]
      operationId: getAgentProfile
      summary: A published agent's public profile. Disabled agents are returned with their status (chat is refused).
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentCard" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/agents/short/{shortName}:
    parameters:
      - name: shortName
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [chat]
      operationId: getAgentProfileByShortName
      summary: A published agent's profile by its short name (/a/{short})
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentCard" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/agents/id/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    get:
      tags: [chat]
      operationId: getAgentProfileByID
      summary: A published agent's public profile by its stable ID
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AgentCard" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/agents/{team}/{agent}/chat:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
      - $ref: "#/components/parameters/AgentSlugParam"
    post:
      tags: [chat]
      operationId: chat
      summary: Ask an agent (session, or an API key with the query scope)
      description: >-
        Sessions and personal API keys store the conversation (send
        conversationId to continue one). Service keys are stateless: send prior
        turns in history; conversationId is rejected. With stream true (the
        default) the reply is Server-Sent Events: named events whose data is JSON
        (see ChatEvent* schemas), in this order: conversation, retrieval (always
        mode), message_start, then thinking_delta / text_delta / tool_call /
        retrieval / tool_result as they happen, moderation (only when
        moderation replaced the question's answer or the answer with a
        notice), message_end, citations_checked (only when SystemOne citation
        checks are on and the answer has citations: it follows message_end and
        replaces the answer's citations, and in enforce mode its text), error
        (only on failure), done. A blocked
        question gets conversation, message_start, moderation, message_end. A ": ping" comment is sent every 15 s. Errors before the
        answer starts (agent_disabled, agent_policy_violation, rate_limited,
        quota_exceeded, model_unavailable, model_busy) are plain HTTP errors. text_delta
        carries the raw model text; message_end.text is the final text (unknown
        [n] markers removed, [1, 2] written as [1][2], markers removed in
        citation mode none). Closing the connection stops the answer; the
        partial answer is saved with stopReason aborted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            example: { message: "How do I request a transcript?", stream: true }
      responses:
        "200": { $ref: "#/components/responses/ChatReply" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "429": { $ref: "#/components/responses/RateLimitedReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
  /v1/conversations:
    get:
      tags: [chat]
      operationId: listConversations
      summary: The caller's own conversations, most recent first
      description: >-
        A personal API key sees its user's conversations with its own team's
        agents (only those it is restricted to, if any), and only with the
        query scope; other keys see none. The same rule applies to reading,
        renaming, deleting and exporting one conversation, and to feedback.
      parameters:
        - name: agentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on the title or the agent's name
          schema: { type: string, maxLength: 200 }
        - name: from
          in: query
          required: false
          description: Last active at or after this time (RFC 3339 or a UTC date)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Last active before this time (RFC 3339, or a UTC date meaning the end of that day)
          schema: { type: string }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
  /v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationIdParam"
    get:
      tags: [chat]
      operationId: getConversation
      summary: One of the caller's conversations with its messages and citations (404 for anyone else, including admins, except under break-glass)
      description: >-
        Only the conversation's user can read it (ADR-0010). The one
        exception is a platform admin with an active break-glass session
        with the conversations scope on the agent's team (ADR-0024): the
        read is audited as breakglass.read with the session ID. Renaming,
        deleting, exporting and feedback stay the user's alone.
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ConversationDetail" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [chat]
      operationId: renameConversation
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [chat]
      operationId: deleteConversation
      summary: Delete a conversation. It is hidden at once and removed for good by retention.
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/conversations/{conversationId}/export:
    parameters:
      - $ref: "#/components/parameters/ConversationIdParam"
    get:
      tags: [chat]
      operationId: exportConversation
      summary: Download a conversation as Markdown or JSON (with citations)
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [markdown, json], default: markdown }
      responses:
        "200":
          description: The export, as an attachment (JSON is not wrapped in data)
          content:
            text/markdown:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/messages/{messageId}/feedback:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [chat]
      operationId: setMessageFeedback
      summary: Rate an answer in one of the caller's conversations (replaces earlier feedback)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FeedbackResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/models:
    get:
      tags: [openai]
      operationId: openaiListModels
      summary: OpenAI-compatible model list. Each agent the caller may chat with is a model named agent:{team}/{slug}.
      responses:
        "200":
          description: Models (OpenAI shape, not wrapped in data)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIModelList" }
        "401": { $ref: "#/components/responses/OpenAIErrorReply" }
  /v1/chat/completions:
    post:
      tags: [openai]
      operationId: openaiChatCompletions
      summary: OpenAI-compatible chat completions for agents (stateless; transcripts are never stored)
      description: >-
        model must be agent:{team}/{slug}. Client system messages are dropped
        (the agent's instructions win); the other messages are the history and
        the last user message is the question. tools and n > 1 are rejected
        (400). With stream true the reply is chat.completion.chunk SSE with
        delta.content and delta.reasoning_content, a final chunk with
        finish_reason and citations, a usage chunk when
        stream_options.include_usage is set, then data [DONE]. Errors use the
        OpenAI shape. When a fail-closed moderation check can't run, the
        reply is 503 moderation_unavailable ("The safety check is
        unavailable right now. Please try again."), or an error chunk with
        that code when streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenAIChatRequest" }
            example:
              model: agent:office-of-the-registrar/student-help
              messages: [{ role: user, content: "How do I request a transcript?" }]
      responses:
        "200":
          description: A completion, or chat.completion.chunk events when streaming
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIChatCompletion" }
            text/event-stream:
              schema:
                type: string
                description: "data: <OpenAIChatCompletionChunk JSON> lines, then data: [DONE]"
        "400": { $ref: "#/components/responses/OpenAIErrorReply" }
        "401": { $ref: "#/components/responses/OpenAIErrorReply" }
        "403": { $ref: "#/components/responses/OpenAIErrorReply" }
        "404": { $ref: "#/components/responses/OpenAIErrorReply" }
        "409": { $ref: "#/components/responses/OpenAIErrorReply" }
        "429": { $ref: "#/components/responses/OpenAIErrorReply" }
        "503": { $ref: "#/components/responses/OpenAIErrorReply" }
  /v1/admin/agents:
    get:
      tags: [admin, agents]
      operationId: adminListAgents
      summary: Every team's agents, metadata only (platform admins and auditors; at most 1000)
      parameters:
        - name: team
          in: query
          required: false
          description: Team slug or ID
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AgentStatus" }
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAgent" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/agents/{agentId}/status:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    post:
      tags: [admin, agents]
      operationId: adminSetAgentStatus
      summary: Platform kill switch (platform admins). disabled_by_platform needs a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAgentStatusChange" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAgent" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/agents/{agentId}/short-name:
    parameters:
      - $ref: "#/components/parameters/AgentIdParam"
    put:
      tags: [admin, agents]
      operationId: adminSetAgentShortName
      summary: Assign or remove an agent's short name, /a/{short} (platform admins; audited)
      description: >-
        2-40 lowercase letters, digits or hyphens, starting with a letter or
        digit; not reserved (admin, api, id, embed, widget, auth, v1, ...).
        400 invalid_short_name, 409 short_name_taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShortNameUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAgent" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/settings/public-access:
    get:
      tags: [admin, public]
      operationId: adminGetPublicAccess
      summary: The public switch, CAPTCHA status and anonymous session lifetime (platform admins and auditors)
      responses:
        "200":
          description: Settings
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
