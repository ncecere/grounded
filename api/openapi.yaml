                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/admin/shared-sources/{sourceId}/documents/{documentId}/refetch:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
      - $ref: "#/components/parameters/DocumentIdParam"
    post:
      tags: [admin, web]
      operationId: adminRefetchSharedDocument
      summary: Fetch one page of a shared web source again now (platform admins)
      description: As refetchDocument, for a shared source.
      responses:
        "202":
          description: The run was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Crawl" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/CrawlInProgressReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/admin/shared-sources/{sourceId}/sync:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
    post:
      tags: [admin, web]
      operationId: adminSyncSharedSource
      summary: Start a crawl of a shared web source
      responses:
        "202":
          description: The crawl was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Crawl" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/CrawlInProgressReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/admin/shared-sources/{sourceId}/boilerplate:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [admin, sources]
      operationId: adminListSharedBoilerplateBlocks
      summary: A shared source's most repeated blocks, left out of its chunks
