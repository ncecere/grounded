      tags: [admin]
      operationId: adminListGroupRules
      summary: SSO group mapping rules, by group (platform admins and auditors)
      parameters:
        - name: team
          in: query
          required: false
          description: Only this team's rules (slug or ID; 404 team_not_found when there is no such team)
          schema: { type: string }
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
