        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/key-rotation:
    get:
      tags: [admin]
      operationId: adminGetKeyRotation
      summary: API keys and widget keys not yet on the current API key pepper (platform admins and auditors)
      description: >-
        During an API_KEY_PEPPER rotation (docs/operations/rotate-keys.md),
        each key is re-hashed with the new pepper when it is next used. This
        lists the usable keys (not revoked or expired) that are not on the
        current pepper yet: "previous" keys stop working when
        API_KEY_PEPPER_PREVIOUS is removed; "retired" keys were hashed with a
        pepper that is no longer configured and cannot work. Never returns
        digests or keys.
      responses:
        "200":
          description: Keys not on the current pepper
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KeyRotationStatus" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/retention:
    get:
      tags: [admin]
      operationId: adminGetRetention
      summary: Retention periods per data kind and per classification level (platform admins and auditors)
      description: >-
        Each configurable kind's effective period and where it comes from: the
        platform setting when an admin set one, else the environment default
        (RETENTION_*_DAYS). A null period keeps the data; nothing is deleted
        until a period is set (DESIGN.md §8). Conversation retention is set per
        classification level (PATCH /v1/admin/classifications/{key}) and listed
        here. Anonymous sessions end at expiry.
      responses:
        "200":
          description: Settings
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetentionSettings" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin]
      operationId: adminPutRetention
      summary: Set retention periods (platform admins with a session; audited as retention.settings_update)
      description: >-
        Each listed kind is set to the environment default (mode default),
        kept (keep) or deleted after days (days). Kinds not listed keep their
        current setting. The next run applies the change; check the dry-run
        report first.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionUpdate" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetentionSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/retention/report:
    get:
      tags: [admin]
      operationId: adminGetRetentionReport
      summary: Dry run of every retention job (platform admins and auditors)
      description: >-
        What a run would delete now, per data kind, team, classification level,
        audience and reason, and what legal holds keep. Counts only; computed
        in a read-only transaction, so it writes nothing.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetentionReport" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/retention/runs:
    get:
      tags: [admin]
      operationId: adminListRetentionRuns
      summary: The latest retention runs, newest first (platform admins and auditors)
      parameters:
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RetentionRun" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin]
      operationId: adminStartRetentionRun
      summary: Run retention now (platform admins with a session; audited as retention.run_request)
      description: >-
        Queues a run of the given kinds (every kind when none are given). It
        starts after any run in progress; follow it in the runs list. It
        deletes what the dry-run report shows as due.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionRunRequest" }
      responses:
        "202":
          description: The run was queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetentionRun" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/legal-holds:
    get:
      tags: [admin]
      operationId: adminListLegalHolds
      summary: Legal holds, newest first (platform admins and auditors)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, released, all], default: active }
      responses:
        "200":
          description: Holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin]
      operationId: adminCreateLegalHold
      summary: Place a legal hold (platform admins with a session; audited as legal_hold.create)
      description: >-
        Stops every retention deletion of what the hold covers, from the next
        retention batch: conversations (a conversation its user deletes stays
        hidden from them but stored), analytics and usage events, the access
        log, audit entries, deleted documents' files and expired invites.
        Holds never expire. Only platform admins and auditors see them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalHoldCreate" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/legal-holds/{holdId}:
    parameters:
      - $ref: "#/components/parameters/HoldIdParam"
    get:
      tags: [admin]
      operationId: adminGetLegalHold
      summary: One legal hold (platform admins and auditors)
      responses:
        "200":
          description: Hold
          content:
            application/json:
              schema:
                type: object
                required: [data]
