                    items: { $ref: "#/components/schemas/GroupRule" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin]
      operationId: adminCreateGroupRule
      summary: Map an IdP group to a team role (platform admins with a session; audited)
      description: >-
        Applied at once to the people whose groups at their last sign-in
        include the group (see adminPreviewGroupRule), then at every sign-in.
        Memberships added by hand are never changed. Audited as
        platform.sso_rule_create; each membership change as team.member_add or
        team.member_role_change by the system, with the rule in its metadata.
        409 rule_exists when the team has a rule for the group; 409
        team_archived for an archived team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRuleCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GroupRule" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
