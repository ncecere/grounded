    AdminOverviewContent:
      type: object
      required: [documents, failedDocuments, passages, storageBytes, sharedSources]
      properties:
        documents: { type: integer, format: int64 }
        failedDocuments: { type: integer, format: int64 }
        passages: { type: integer, format: int64, description: Indexed passages (chunks) }
        storageBytes: { type: integer, format: int64 }
        sharedSources: { type: integer, format: int64 }
    AdminFailedIngest:
      type: object
      required: [teamSlug, teamName, failed]
