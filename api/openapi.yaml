                  data: { $ref: "#/components/schemas/GroupRule" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [admin]
      operationId: adminUpdateGroupRule
      summary: Change a rule's group or role (platform admins with a session; audited)
      description: >-
        Applied at once, like a new rule; the rule's team never changes (add
        a rule for another team instead). Audited as platform.sso_rule_update.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRuleUpdate" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GroupRule" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [admin]
      operationId: adminDeleteGroupRule
      summary: Delete a rule (platform admins with a session; audited)
      description: >-
        The memberships the rule created are recomputed at once: removed, or
        given another matching rule's role. A team's last owner is kept.
        Audited as platform.sso_rule_delete.
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
