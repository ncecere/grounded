    parameters:
      - $ref: "#/components/parameters/MigrationIdParam"
    get:
      tags: [admin]
      operationId: adminGetProfileMigration
      summary: One profile migration with per-source progress and failed documents (platform admins and auditors)
      responses:
        "200": { $ref: "#/components/responses/ProfileMigrationReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations/{migrationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/MigrationIdParam"
    post:
      tags: [admin]
      operationId: adminCancelProfileMigration
      summary: Cancel a running migration; its new vectors are deleted (platform admins with a session; audited)
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200": { $ref: "#/components/responses/ProfileMigrationReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations/{migrationId}/switch-back:
    parameters:
      - $ref: "#/components/parameters/MigrationIdParam"
    post:
      tags: [admin]
      operationId: adminSwitchBackProfileMigration
      summary: Switch a knowledge base back to its previous profile within the grace period (platform admins with a session; audited)
      description: >-
        Possible while the migration is switched and the old vectors are
        kept (oldVectorsUntil). The knowledge base searches its previous
        profile again at once; the new profile's vectors are deleted by the
        cleanup job. 409 switch_back_unavailable when the grace period is
        over or the old vectors are incomplete.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200": { $ref: "#/components/responses/ProfileMigrationReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations/{migrationId}/retry:
    parameters:
      - $ref: "#/components/parameters/MigrationIdParam"
    post:
      tags: [admin]
      operationId: adminRetryProfileMigration
      summary: Retry the documents a running migration couldn't embed (platform admins with a session; audited)
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200": { $ref: "#/components/responses/ProfileMigrationReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations/{migrationId}/finish:
    parameters:
      - $ref: "#/components/parameters/MigrationIdParam"
    post:
      tags: [admin]
      operationId: adminFinishProfileMigration
      summary: End a switched migration's grace period now; the old vectors are deleted and switching back is no longer possible (platform admins with a session; audited)
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200": { $ref: "#/components/responses/ProfileMigrationReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
