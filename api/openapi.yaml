                  data: { $ref: "#/components/schemas/PublicAccessSettings" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin, public]
      operationId: adminPutPublicAccess
      summary: Turn public agents on or off (platform admins; audited). Off hides public agents and refuses public pages, embeds and the public API.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicAccessUpdate" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicAccessSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/maintenance:
    get:
      tags: [operations]
      operationId: getMaintenance
      summary: Whether maintenance mode is on, its reason and planned end (session or API key)
      description: >-
        While maintenance mode is on, new ingestion is paused: uploads,
        creating a web source, syncs, page re-fetches, retries and site maps
        answer 503 maintenance_mode, scheduled crawls wait, queued documents
        and running crawls park after the current document or page, and
        settings changes that need re-processing wait. Sign-in, chat,
        retrieval, the OpenAI-compatible API, reads and platform
        administration keep working. Clients can check this before starting
        ingestion.
      responses:
        "200":
          description: The current state (the reason is empty while off)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceStatus" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/settings/maintenance:
    get:
      tags: [admin]
      operationId: adminGetMaintenance
      summary: Maintenance mode with who started and last changed it (platform admins and auditors)
      responses:
        "200":
          description: Settings
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceSettings" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin]
      operationId: adminPutMaintenance
      summary: Turn maintenance mode on or off, or change its reason and planned end (platform admins with a session; audited)
      description: >-
        On pauses new ingestion everywhere (see GET /v1/maintenance) and
        needs a reason, shown to users. The planned end is informational:
        maintenance mode ends only when an admin turns it off, and parked
        work then resumes by itself. Every process sees a change within a
        few seconds. Audited as platform.maintenance_start,
        platform.maintenance_update or platform.maintenance_end.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceUpdate" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/me/break-glass:
    get:
      tags: [breakglass]
      operationId: listMyBreakGlassSessions
      summary: The caller's open break-glass sessions, pending and active (platform admins; everyone else gets an empty list)
      description: >-
        The app's banner reads this to show the reading admin the time left
        and an End now button. A session past its end is never listed.
      responses:
        "200":
          description: Open sessions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BreakGlassSession" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/search:
    get:
      tags: [search]
      operationId: searchObjects
      summary: Objects the caller may see whose name matches, for the command palette
      description: >-
        Signed-in users only (API keys get 401). Everyone finds the agents they
        may open (every agent of their teams) or chat with (as the agent
        directory lists them), the knowledge bases and data sources of all
        their teams, and their own conversations by title (never anyone
        else's; deleted ones are gone). Platform admins and auditors also find
        teams, users, models, connections, embedding profiles and shared
        sources (metadata they may read; never another team's content).
        Matching is case-insensitive on the name (users: display name or
        email; models and profiles: name or key); results are ranked by how
        the name matches (prefix, then the start of a word, then anywhere),
        then by type, and cut to `limit`.
      parameters:
        - name: q
          in: query
          required: true
          description: The text to find, at least 2 characters (trimmed)
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: limit
          in: query
          required: false
          description: At most this many results (default 20, at most 50)
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches, best first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/break-glass:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [breakglass, teams]
      operationId: listTeamBreakGlassSessions
      summary: Active break-glass sessions on the team (team owners, platform admins and auditors)
      description: >-
        The notice on the team's pages: which platform admin is reading
        what, why and until when.
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BreakGlassSession" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/teams/{team}/conversations:
    parameters:
      - $ref: "#/components/parameters/TeamParam"
    get:
      tags: [breakglass, chat]
      operationId: listTeamConversations
      summary: The team's conversations, most recent first (only under a break-glass session with the conversations scope; audited)
      description: >-
        Conversations with the team's agents, by anyone, without who had
        them. Only a platform admin with an active break-glass session on
        the team with the conversations scope may list them; each request is
        recorded as a breakglass.read. Everyone else, including the team's
        own members and admins, gets 403: a transcript is its user's alone
        (ADR-0010, ADR-0024). Transcripts open with GET
        /v1/conversations/{conversationId}.
      parameters:
        - name: agentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamConversationPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/settings/break-glass:
    get:
      tags: [admin, breakglass]
      operationId: adminGetBreakGlassSettings
      summary: Break-glass approval, maximum duration and approval timeout (platform admins and auditors)
      responses:
        "200":
          description: Settings
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSettings" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin, breakglass]
      operationId: adminPutBreakGlassSettings
      summary: Change the break-glass settings (platform admins with a session; audited as platform.break_glass_settings_update)
      description: >-
        By default one platform admin starts a session alone with a written
        reason; with approvalRequired a second platform admin must approve
        it first. Changes apply to sessions started afterwards.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakGlassSettingsUpdate" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass:
    get:
      tags: [admin, breakglass]
      operationId: adminListBreakGlassSessions
      summary: Break-glass sessions, newest first (platform admins and auditors)
      parameters:
        - name: state
          in: query
          required: false
          description: "open: pending and active; closed: every other status"
          schema: { type: string, enum: [open, closed] }
        - name: team
          in: query
          required: false
          description: Team slug or ID
          schema: { type: string }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin, breakglass]
      operationId: adminStartBreakGlassSession
      summary: Start a break-glass session on a team (platform admins with a session; audited as breakglass.start)
      description: >-
        Grants the caller read access to the team's conversations,
        documents or both for the duration (default 1 hour, at most the
        maximum setting), through the normal API and UI. Nothing else
        changes: no role, no write access. Every read is audited as
        breakglass.read with the session ID. Without the approval setting
        the session is active at once and the team's owners are notified
        (mandatory); with it, the session is pending until another platform
        admin approves it, or lapses after the approval timeout. One open
        session per admin and team (409 break_glass_open).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakGlassStart" }
      responses:
        "201":
          description: Started (active) or requested (pending)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionDetail" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/BreakGlassSessionIdParam"
    get:
      tags: [admin, breakglass]
      operationId: adminGetBreakGlassSession
      summary: A break-glass session with its read counts by kind (platform admins and auditors)
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionDetail" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass/{sessionId}/reads:
    parameters:
      - $ref: "#/components/parameters/BreakGlassSessionIdParam"
    get:
      tags: [admin, breakglass]
      operationId: adminListBreakGlassReads
      summary: A session's read log, newest first (platform admins and auditors; never content)
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of reads
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassReadPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass/{sessionId}/approve:
    parameters:
      - $ref: "#/components/parameters/BreakGlassSessionIdParam"
    post:
      tags: [admin, breakglass]
      operationId: adminApproveBreakGlassSession
      summary: Approve a pending session (another platform admin, never the one who asked; audited as breakglass.approve)
      description: The session starts now and runs for its duration; the team's owners are notified.
      responses:
        "200":
          description: Approved (active)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionDetail" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass/{sessionId}/deny:
    parameters:
      - $ref: "#/components/parameters/BreakGlassSessionIdParam"
    post:
      tags: [admin, breakglass]
      operationId: adminDenyBreakGlassSession
      summary: Deny a pending session with a reason (another platform admin; audited as breakglass.deny)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakGlassDeny" }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionDetail" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/break-glass/{sessionId}/end:
    parameters:
      - $ref: "#/components/parameters/BreakGlassSessionIdParam"
    post:
      tags: [admin, breakglass]
      operationId: adminEndBreakGlassSession
      summary: End an active session now, or withdraw your own pending request (platform admins; audited as breakglass.end or breakglass.cancel)
      description: >-
        The admin who reads ends their session; another platform admin may
        revoke it. Access stops at once, and the team's owners get a summary
        of what was read.
      responses:
        "200":
          description: Ended or withdrawn
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassSessionDetail" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/access-log:
    get:
      tags: [admin]
      operationId: adminListAccessLog
      summary: Uses of Sensitive and Restricted agents, newest first (platform admins and auditors)
      parameters:
        - name: from
          in: query
          required: false
          description: Earliest time (RFC 3339 or a UTC date)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Latest time, exclusive (RFC 3339 or a UTC date, meaning the end of that day)
          schema: { type: string }
        - name: agentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: channel
          in: query
          required: false
          schema: { type: string, enum: [ui, api, openai, test, public, widget] }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AccessLogPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/analytics:
    get:
      tags: [admin]
      operationId: adminGetAnalytics
      summary: Platform analytics, aggregates only with no content or user identities (platform admins and auditors). Test chats are excluded except from token usage.
      description: >-
        With team, every count is of that team's agents (top teams lists just
        it). With audience, answers, conversations, moderation, SystemOne
        checks and the top lists count only answers to that audience; token
        use (models) isn't recorded per audience and counts every audience.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFromParam"
        - $ref: "#/components/parameters/AnalyticsToParam"
        - $ref: "#/components/parameters/AnalyticsTeamParam"
        - $ref: "#/components/parameters/AnalyticsAudienceParam"
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlatformAnalytics" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/analytics/daily.csv:
    get:
      tags: [admin]
      operationId: adminExportAnalyticsDaily
      summary: The platform analytics daily table as CSV (platform admins and auditors), with the same filters as the overview
      parameters:
        - $ref: "#/components/parameters/AnalyticsFromParam"
        - $ref: "#/components/parameters/AnalyticsToParam"
        - $ref: "#/components/parameters/AnalyticsTeamParam"
        - $ref: "#/components/parameters/AnalyticsAudienceParam"
      responses:
        "200":
          description: >-
            An attachment with a header row
            (date,answers,conversations,no_context,refused,moderation_blocked,moderation_flagged)
            and one row per UTC day of the range, including days without answers
          content:
            text/csv:
              schema: { type: string }
              example: |
                date,answers,conversations,no_context,refused,moderation_blocked,moderation_flagged
                2026-09-01,120,41,9,3,1,2
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/analytics/moderation-events:
    get:
      tags: [admin]
      operationId: adminListModerationEvents
      summary: Individual moderation decisions behind the counts by category (platform admins and auditors)
      description: >-
        The drill-down of analytics moderation: one entry per moderated stage
        of an answer whose decision was not pass, newest first, with the
        category that triggered, the score and whether an uncalibrated
        provider's block only flagged (downgraded). Content-free: no message
        text and no user identity (ADR-0010). Test chats are excluded.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFromParam"
        - $ref: "#/components/parameters/AnalyticsToParam"
        - name: decision
          in: query
          required: false
          schema: { type: string, enum: [block, flag, support, error] }
        - name: category
          in: query
          required: false
          description: A category that triggered (the top category or any triggered one)
          schema: { $ref: "#/components/schemas/ModerationCategory" }
        - name: agentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of decisions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModerationEventPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/systemone:
    get:
      tags: [admin]
      operationId: adminGetSystemOne
      summary: The platform SystemOne settings (platform admins and auditors)
      description: >-
        The SystemOne model the features use and each feature's platform
        settings (ADR-0020). Every feature is off until an admin turns it on;
        with no SystemOne model, Grounded behaves as if SystemOne did not exist.
      responses:
        "200":
          description: The settings (the defaults with revision 1 until saved)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SystemOneSettings" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin]
      operationId: adminPutSystemOne
      summary: Replace the platform SystemOne settings (platform admins; audited)
      description: >-
        400 invalid_settings (details.problems lists {field, problem}) for bad
        values or a feature turned on without a model; 400 invalid_model when
        modelId is not a SystemOne model. citations and scope may be omitted:
        their saved settings are kept.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemOneSettingsInput" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SystemOneSettings" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/systemone/status:
    get:
      tags: [agents]
      operationId: getSystemOneStatus
      summary: Whether a SystemOne model is configured, and the platform's feature defaults (any signed-in user)
      description: >-
        Editors use it to decide whether to show the "SystemOne checks"
        override and the playground's judge switch. available is false when no
        SystemOne model is set or it (or its connection) is disabled.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SystemOneStatus" }
        "401": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/moderation/policies/{audience}:
    parameters:
      - name: audience
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Audience" }
    get:
      tags: [admin]
      operationId: adminGetModerationPolicy
      summary: An audience's moderation policy (platform admins and auditors)
      responses:
        "200":
          description: The policy (the defaults with revision 1 until saved)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModerationPolicy" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    put:
      tags: [admin]
      operationId: adminPutModerationPolicy
      summary: Replace an audience's moderation policy (platform admins; audited)
      description: >-
        400 invalid_policy (details.problems lists {field, problem}) for bad
        values, a public policy that does not fail closed, or rules without a
        provider; 400 invalid_model when modelId is not a moderation or
        SystemOne model.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationPolicyInput" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModerationPolicy" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/moderation/test:
    post:
      tags: [admin]
      operationId: adminTestModeration
      summary: Run a moderation model on a text and return the normalised scores (platform admins). Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationTestRequest" }
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModerationResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/ErrorReply" }
components:
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema: { type: string }
  parameters:
    AnalyticsFromParam:
      name: from
      in: query
      required: false
      description: First UTC day (default 29 days before to)
      schema: { type: string, format: date }
    AnalyticsToParam:
      name: to
      in: query
      required: false
      description: Last UTC day, inclusive (default today); at most 366 days after from
      schema: { type: string, format: date }
    AnalyticsTeamParam:
      name: team
      in: query
      required: false
      description: Only this team's agents (a team slug; 404 team_not_found when there is no such team)
      schema: { type: string, example: office-of-the-registrar }
    AnalyticsAudienceParam:
      name: audience
      in: query
      required: false
      description: Only answers to this audience
      schema: { $ref: "#/components/schemas/Audience" }
    SourceIdParam:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentIdParam:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CrawlIdParam:
      name: crawlId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MigrationIdParam:
      name: migrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema: { type: string }
    UserIdParam:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldIdParam:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns 412.
      schema: { type: string }
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema: { type: string }
    BoilerplateLimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    DocumentKindParam:
      name: kind
      in: query
      required: false
      description: "Only documents of this kind: pdf, docx, pptx, html, markdown or text"
      schema: { type: string, enum: [pdf, docx, pptx, html, markdown, text] }
    DocumentTagParam:
      name: tag
      in: query
      required: false
      description: Only documents with this tag (case-insensitive)
      schema: { type: string, maxLength: 64 }
    DocumentSearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match on the title, URL or file name
      schema: { type: string, maxLength: 200 }
    AuditActionParam:
      name: action
      in: query
      required: false
      description: >-
        An exact action (agent.publish), or a prefix ending in a dot (agent.)
        for every action in that group.
      schema: { type: string, maxLength: 100, pattern: '^[a-z][a-z_]*\.[a-z_]*$', example: agent. }
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: An action group (a prefix ending in a dot) to leave out, e.g. auth. to hide sign-ins and sign-outs.
      schema: { type: string, maxLength: 100, pattern: '^[a-z][a-z_]*\.$', example: auth. }
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema: { type: string, format: uuid }
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema: { type: string, maxLength: 64, pattern: '^[a-z_]+$', example: knowledge_base }
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema: { type: string, format: date-time }
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema: { type: string, format: date-time }
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match
      schema: { type: string, maxLength: 200 }
    AgentIdParam:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentSlugParam:
      name: agent
      in: path
      required: true
      description: Agent slug
      schema: { type: string }
    BreakGlassSessionIdParam:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationIdParam:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    CrawlReply:
      description: A crawl run
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Crawl" }
    BoilerplateBlockListReply:
      description: Repeated blocks, most documents first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/BoilerplateBlock" }
    CrawlListReply:
      description: Crawl runs, newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/Crawl" }
    CrawlInProgressReply:
      description: crawl_in_progress (details.crawl is the active run), or another conflict such as source_paused
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CrawlConflictResponse" }
    ClassificationImpactReply:
      description: classification_impact (details lists the knowledge bases that must detach the source first), or another conflict such as name_taken
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ClassificationConflictResponse" }
    DomainRequestListReply:
      description: Domain requests
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/DomainRequest" }
    ProfileMigrationReply:
      description: The migration, with per-source progress
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/ProfileMigration" }
    ErrorReply:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AgentConfigErrorReply:
      description: invalid_config (details.problems lists {field, problem}), or another validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentConfigErrorResponse" }
    AgentInvalidReply:
      description: agent_invalid; details.problems lists {field, problem}
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentInvalidResponse" }
    ChatReply:
      description: >-
        stream true (default): text/event-stream of named events (see the
        ChatEvent* schemas); stream false: the answer as JSON
      content:
        text/event-stream:
          schema:
            type: string
            description: "event: <name> / data: <JSON> blocks, : ping comments, ending with event: done"
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/ChatAnswer" }
    OpenAIErrorReply:
      description: Error in the OpenAI shape
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OpenAIError" }
    LimitReachedReply:
      description: limit_reached (a team limit; details are {limit, max, current}), or another conflict such as name_taken or source_paused
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LimitErrorResponse" }
    RateLimitedReply:
      description: rate_limited (details are {limit, max, current} for team query limits)
      headers:
        Retry-After:
          description: Seconds until the request may succeed
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LimitErrorResponse" }
    MaintenanceReply:
      description: >-
        maintenance_mode: new ingestion is paused for maintenance. The message
        includes the admin's reason; details are {reason, plannedEndAt}.
        Retry-After is the time to the planned end, or 300 seconds without one.
      headers:
        Retry-After:
          description: Seconds until trying again is worthwhile
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Ok" }
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Health" }
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AuditPage" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              description: >-
                Structured context for some errors (see crawl_in_progress,
                classification_impact and limit_reached). host_not_allowed has
                {host, pendingRequest?: {id, pattern, createdAt,
                requesterName}}: pendingRequest is the team's pending domain
                request covering the host, so a UI shows it instead of
                offering another request.
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    AdminOverview:
      type: object
      required: [teams, users, content, failedIngest, teamsNearLimits]
      properties:
        teams: { $ref: "#/components/schemas/AdminOverviewTeams" }
        users: { $ref: "#/components/schemas/AdminOverviewUsers" }
        content: { $ref: "#/components/schemas/AdminOverviewContent" }
        failedIngest:
          type: array
          items: { $ref: "#/components/schemas/AdminFailedIngest" }
        teamsNearLimits:
          type: array
          items: { $ref: "#/components/schemas/AdminNearLimit" }
        warnings:
          type: array
          description: Production-readiness warnings, warnings before information (always sent)
          items: { $ref: "#/components/schemas/AdminWarning" }
    SharedSourceAttachment:
      type: object
      required: [sourceId, kbId, kbName, teamSlug, teamName, teamMaxClassification]
      properties:
        sourceId: { type: string, format: uuid }
        kbId: { type: string, format: uuid }
        kbName: { type: string }
        teamSlug: { type: string }
        teamName: { type: string }
        teamMaxClassification: { type: string, description: The team's approved classification }
    CatalogUsage:
      type: object
      required: [models, profiles]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelUsage" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/ProfileUsage" }
    ModelUsage:
      type: object
      required: [modelId, publishedAgents, draftAgents, profiles, moderationAudiences, systemOne]
      properties:
        modelId: { type: string, format: uuid }
        publishedAgents: { type: integer, format: int64, description: Agents whose published version answers with this model }
        draftAgents: { type: integer, format: int64, description: Agents whose draft chooses this model }
        profiles: { type: integer, format: int64, description: Embedding profiles on this model }
        moderationAudiences:
          type: array
          description: Audiences whose moderation policy uses this model
          items: { $ref: "#/components/schemas/Audience" }
        systemOne: { type: boolean, description: SystemOne's settings use this model }
    ProfileUsage:
      type: object
      required: [profileId, sources, knowledgeBases]
      properties:
        profileId: { type: string, format: uuid }
        sources: { type: integer, format: int64, description: Data sources (team and shared) on this profile }
        knowledgeBases: { type: integer, format: int64 }
    KeyRotationStatus:
      type: object
      required: [previousPepperConfigured, keys]
      properties:
        previousPepperConfigured: { type: boolean, description: API_KEY_PEPPER_PREVIOUS is set }
        keys:
          type: array
          items: { $ref: "#/components/schemas/PepperKey" }
    PepperKey:
      type: object
      required: [kind, id, name, teamSlug, teamName, agentName, lastUsedAt, createdAt, state]
      properties:
        kind: { type: string, enum: [api_key, publishable_key], description: A team API key or an agent's widget (publishable) key }
        id: { type: string, format: uuid }
        name: { type: string }
        teamSlug: { type: string }
        teamName: { type: string }
        agentName: { type: string, nullable: true, description: The agent of a widget key }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        state:
          type: string
          enum: [previous, retired]
          description: >-
            previous: on API_KEY_PEPPER_PREVIOUS, re-hashed when next used.
            retired: hashed with a pepper that is no longer configured.
    RetentionKind:
      type: string
      description: A kind of data with its own retention (docs/operations/retention.md)
      enum: [conversations, deleted_conversations, access_log, analytics_events, usage_events, audit_log, deleted_files, expired_invites, anonymous_sessions]
    RetentionPeriod:
      type: object
      required: [kind, days, source, platformSet, platformDays, environmentDays, minDays, maxDays]
      properties:
        kind: { $ref: "#/components/schemas/RetentionKind" }
        days: { type: integer, nullable: true, description: The effective period in days; null keeps the data }
        source: { type: string, enum: [platform, environment], description: Where days comes from }
        platformSet: { type: boolean, description: An admin set this kind; false means the environment default applies }
        platformDays: { type: integer, nullable: true, description: The platform setting (null with platformSet keeps the data) }
        environmentDays: { type: integer, nullable: true, description: The environment default (null keeps the data) }
        minDays: { type: integer }
        maxDays: { type: integer }
    RetentionLevel:
      type: object
      required: [key, name, rank, conversationRetentionDays, anonymousRetentionHours]
      properties:
        key: { type: string }
        name: { type: string }
        rank: { type: integer }
        conversationRetentionDays: { type: integer, nullable: true, description: Signed-in conversations; null keeps them }
        anonymousRetentionHours: { type: integer }
    RetentionSettings:
      type: object
      required: [periods, levels, updatedAt, updatedBy, revision]
      properties:
        periods:
          type: array
          items: { $ref: "#/components/schemas/RetentionPeriod" }
        levels:
          type: array
          items: { $ref: "#/components/schemas/RetentionLevel" }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        revision: { $ref: "#/components/schemas/Revision" }
    RetentionUpdate:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          items:
            type: object
            required: [kind, mode]
            properties:
              kind: { $ref: "#/components/schemas/RetentionKind" }
              mode: { type: string, enum: [default, keep, days] }
              days: { type: integer, description: "Required with mode days, within the kind's minDays and maxDays" }
    RetentionReport:
      type: object
      required: [generatedAt, kinds]
      properties:
        generatedAt: { type: string, format: date-time }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/RetentionKindReport" }
    RetentionKindReport:
      type: object
      required: [kind, kept, due, held, groups]
      properties:
        kind: { $ref: "#/components/schemas/RetentionKind" }
        kept: { type: boolean, description: "No period is set, so nothing is due" }
        due: { type: integer, format: int64, description: Would be deleted now }
        held: { type: integer, format: int64, description: Past the period but kept by legal holds }
        groups:
          type: array
          items: { $ref: "#/components/schemas/RetentionGroup" }
    RetentionGroup:
      type: object
      required: [teamId, teamName, level, audience, reason, due, held]
      properties:
        teamId: { type: string, format: uuid, nullable: true, description: Null for platform-level rows }
        teamName: { type: string }
        level:
          nullable: true
          description: The classification level (conversations and the access log)
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        audience: { type: string, description: signed_in or anonymous for conversations; the channel or audience for events; empty otherwise }
        reason: { type: string, enum: [retention, deleted, expired] }
        due: { type: integer, format: int64 }
        held: { type: integer, format: int64 }
    RetentionRunResult:
      type: object
      required: [kind, deleted, held, kept, error]
      properties:
        kind: { $ref: "#/components/schemas/RetentionKind" }
        deleted: { type: integer, format: int64 }
        held: { type: integer, format: int64 }
        kept: { type: boolean }
        error: { type: string }
    RetentionRun:
      type: object
      required: [id, trigger, requestedBy, kinds, status, results, error, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer, format: int64 }
        trigger: { type: string, enum: [schedule, manual] }
        requestedBy:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        kinds:
          type: array
          description: The kinds run; empty means all
          items: { $ref: "#/components/schemas/RetentionKind" }
        status: { type: string, enum: [queued, running, ok, error] }
        results:
          type: array
          items: { $ref: "#/components/schemas/RetentionRunResult" }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RetentionRunRequest:
      type: object
      properties:
        kinds:
          type: array
          items: { $ref: "#/components/schemas/RetentionKind" }
    LegalHoldScopeType:
      type: string
      enum: [user, team, agent, conversation]
    LegalHold:
      type: object
      required: [id, scopeType, scopeId, scopeLabel, scopeExists, scopeContext, reason, coversFrom, coversTo, status, createdAt, createdBy, releasedAt, releasedBy, releaseReason, conversations, deletedConversations]
      properties:
        id: { type: string, format: uuid }
        scopeType: { $ref: "#/components/schemas/LegalHoldScopeType" }
        scopeId: { type: string, format: uuid }
        scopeLabel: { type: string, description: "The covered object's name (as recorded when placed, if it no longer exists)" }
        scopeExists: { type: boolean }
        scopeContext: { type: string, description: "An agent's team, or a conversation's agent" }
        reason: { type: string }
        coversFrom: { type: string, format: date, nullable: true, description: First day of data covered (UTC); null covers everything before coversTo }
        coversTo: { type: string, format: date, nullable: true, description: "Last day of data covered (UTC, inclusive); null covers everything after coversFrom" }
        status: { type: string, enum: [active, released] }
        createdAt: { type: string, format: date-time }
        createdBy:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        releasedAt: { type: string, format: date-time, nullable: true }
        releasedBy:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        releaseReason: { type: string }
        conversations: { type: integer, format: int64, description: Conversations the hold covers }
        deletedConversations: { type: integer, format: int64, description: "Of those, deleted by their users; hidden from them, kept by the hold" }
    LegalHoldCreate:
      type: object
      required: [scopeType, scope, reason]
      properties:
        scopeType: { $ref: "#/components/schemas/LegalHoldScopeType" }
        scope:
          type: string
          description: An ID, or a user's email, a team's slug, or an agent as team-slug/agent-slug
        reason: { type: string, minLength: 1, maxLength: 2000 }
        coversFrom: { type: string, format: date, nullable: true }
        coversTo: { type: string, format: date, nullable: true }
    LegalHoldRelease:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    AdminOverviewTeams:
      type: object
      required: [active, archived]
      properties:
        active: { type: integer, format: int64 }
        archived: { type: integer, format: int64 }
    AdminOverviewUsers:
      type: object
      required: [total, suspended, signedInLast7Days, platformAdmins]
      properties:
        total: { type: integer, format: int64 }
        suspended: { type: integer, format: int64 }
        signedInLast7Days: { type: integer, format: int64 }
