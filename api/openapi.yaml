          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [admin, sources]
      operationId: adminDeleteSharedDocument
      summary: Delete a document of a shared source with its chunks
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/shared-sources/{sourceId}/documents/{documentId}/passages:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
      - $ref: "#/components/parameters/DocumentIdParam"
    get:
      tags: [admin, sources]
      operationId: adminListSharedDocumentPassages
      summary: A shared source document's first passages
      parameters:
        - name: limit
          in: query
