      responses:
        "200":
          description: Knowledge bases, by team and name (at most 1000)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminKnowledgeBase" }
        "403": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations:
    get:
      tags: [admin]
      operationId: adminListProfileMigrations
      summary: Profile migrations, newest first (platform admins and auditors)
      parameters:
        - name: kbId
          in: query
          required: false
          description: Only this knowledge base's migrations
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Migrations (at most 200), without per-source detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileMigration" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin]
      operationId: adminStartProfileMigration
      summary: Start moving a knowledge base to another embedding profile (platform admins with a session; audited)
      description: >-
        Re-embeds every source of the knowledge base into the target profile in
        the background, reusing the stored parsed text (the chunks are copied
        when the chunk settings match, else cut again; nothing is fetched).
        The knowledge base keeps searching its current profile until every
        source is complete, then switches in one step. Refused with 409
        migration_blocked (details.blockers) when the preflight has blockers.
        Audited as kb.profile_migration_start (counts only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileMigrationStart" }
      responses:
        "201":
          description: Started
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ProfileMigration" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/profile-migrations/preflight:
    post:
      tags: [admin]
      operationId: adminPreflightProfileMigration
      summary: What moving a knowledge base to a profile involves, and what blocks it (platform admins and auditors; changes nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileMigrationTarget" }
      responses:
        "200":
          description: Preflight
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ProfileMigrationPreflight" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
