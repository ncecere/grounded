          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The first passages, in document order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DocumentPassagePage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/shared-sources/{sourceId}/tags:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [admin, sources]
      operationId: adminListSharedSourceTags
      summary: The tags used by a shared source's documents
      responses:
        "200":
          description: Tags, alphabetically (at most 200)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/shared-sources/{sourceId}/documents/{documentId}/retry:
    parameters:
