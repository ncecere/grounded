                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DataSource" }
        "403": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin, sources]
      operationId: adminCreateSharedSource
      summary: Create a platform-shared upload or web source (a web source's first crawl starts immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSourceCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/admin/shared-sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [admin, sources]
      operationId: adminGetSharedSource
      summary: One platform-shared source
      responses:
        "200":
          description: Source
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [admin, sources]
      operationId: adminUpdateSharedSource
      summary: >-
        Rename, pause, reconfigure or reclassify a shared source. Raising the
        classification is refused (409 classification_impact, listing them) while
        knowledge bases of teams approved below the new level attach it; with
        ?preview=true nothing changes and the impact is returned instead.
        Lowering needs a reason.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
        - name: preview
          in: query
          required: false
          description: Return the ClassificationImpact of the requested classification without changing anything
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSourceUpdate" }
      responses:
        "200":
          description: The updated source, or (with preview=true) the impact of the requested classification
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/DataSource"
                      - $ref: "#/components/schemas/ClassificationImpact"
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ClassificationImpactReply" }
        "412": { $ref: "#/components/responses/ErrorReply" }
        "428": { $ref: "#/components/responses/ErrorReply" }
    delete:
      tags: [admin, sources]
      operationId: adminDeleteSharedSource
      summary: Delete a shared source with all its documents (knowledge bases must detach it first)
      responses:
        "200": { $ref: "#/components/responses/OkReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/ErrorReply" }
  /v1/admin/shared-sources/{sourceId}/documents:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
    get:
      tags: [admin, sources]
      operationId: adminListSharedDocuments
      summary: Documents of a shared source, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - $ref: "#/components/parameters/DocumentSearchParam"
        - $ref: "#/components/parameters/DocumentKindParam"
        - $ref: "#/components/parameters/DocumentTagParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A page of documents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DocumentPage" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    post:
      tags: [admin, sources]
      operationId: adminUploadSharedDocuments
      summary: Upload files to a shared upload source (multipart field "files")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                tags:
                  type: array
                  description: "Tags for every file in the request (repeat the field or separate with commas). Send it before the files: invalid tags are then refused before anything is stored. Without it, replaced documents keep their tags."
                  items: { type: string }
      responses:
        "200":
          description: One result per file; rejected files carry an error
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/ErrorReply" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
        "409": { $ref: "#/components/responses/LimitReachedReply" }
        "413": { $ref: "#/components/responses/ErrorReply" }
        "503": { $ref: "#/components/responses/MaintenanceReply" }
  /v1/admin/shared-sources/{sourceId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/SourceIdParam"
      - $ref: "#/components/parameters/DocumentIdParam"
    get:
      tags: [admin, sources]
      operationId: adminGetSharedDocument
      summary: One document of a shared source
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "403": { $ref: "#/components/responses/ErrorReply" }
        "404": { $ref: "#/components/responses/ErrorReply" }
    patch:
      tags: [admin, sources]
      operationId: adminUpdateSharedDocument
