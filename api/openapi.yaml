        teamSlug: { type: string, nullable: true, description: Null for platform-shared sources }
        teamName: { type: string, nullable: true }
        failed: { type: integer, format: int64 }
    AdminNearLimit:
      type: object
      required: [teamSlug, teamName, key, label, unit, used, max]
      properties:
        teamSlug: { type: string }
        teamName: { type: string }
        key: { $ref: "#/components/schemas/LimitKey" }
        label: { type: string }
        unit: { $ref: "#/components/schemas/LimitUnit" }
        used: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
    AdminWarning:
      type: object
      description: >-
        A setting that is allowed but deserves attention (DESIGN.md §16).
        Settings that are unsafe in production stop Grounded from starting
        instead.
      required: [code, severity, message, fix]
      properties:
        code:
          type: string
          description: Stable identifier; new codes may be added
          example: crawl_allowlist_empty
        severity: { type: string, enum: [warning, info], description: "info: worth knowing, and may be intended" }
        message: { type: string, example: "The crawl allowlist is empty, so no web source can be crawled." }
        fix: { type: string, description: What to do about it }
    AdminAttention:
      type: object
      required: [pendingDomainRequests]
      properties:
        pendingDomainRequests: { type: integer, format: int64, description: Domain requests waiting for review }
    NotificationType:
      type: string
      enum:
        - team.invited
        - team.invite_expiring
        - team.membership
        - web.domain_request
        - web.domain_request_new
        - web.sync_failed
        - source.classification_lowered
        - agent.disabled_by_platform
        - agent.published
        - team.daily_limit
        - breakglass.started
        - breakglass.ended
        - breakglass.requested
        - breakglass.decided
        - platform.profile_migration
        - kb.profile_changed
    Notification:
      type: object
      required: [id, type, title, body, link, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        body: { type: string, description: "Plain text, with paragraphs separated by a blank line" }
        link: { type: string, description: 'App path to open, e.g. /teams/registrar ("" = none)', example: /teams/registrar/domains }
        teamId: { type: string, format: uuid, nullable: true }
        read: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string, nullable: true }
        unreadCount: { type: integer, format: int64, description: "All of the caller's unread notifications, whatever the filters" }
    NotificationUpdate:
      type: object
      required: [read]
      additionalProperties: false
      properties:
        read: { type: boolean }
    NotificationReadAll:
      type: object
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
    NotificationReadAllResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, format: int64 }
    NotificationSetting:
      type: object
      required: [type, label, description, mandatory, inApp, email]
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
        label: { type: string, example: Domain request decided }
        description: { type: string }
        mandatory: { type: boolean, description: "Always delivered on every channel; can't be turned off" }
        inApp: { type: boolean }
        email: { type: boolean }
    NotificationSettings:
      type: object
      required: [emailEnabled, items]
      properties:
        emailEnabled: { type: boolean, description: "False when the deployment has no SMTP relay: nothing is emailed" }
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationSetting" }
    NotificationSettingInput:
      type: object
      required: [type, inApp, email]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
        inApp: { type: boolean }
        email: { type: boolean }
    NotificationSettingsUpdate:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/NotificationSettingInput" }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, draining, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
    DevLoginRequest:
      type: object
      required: [account]
      properties:
        account: { type: string, example: admin }
    DevAccount:
      type: object
      required: [id, name, email, platformRole]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        platformRole: { $ref: "#/components/schemas/PlatformRole" }
    AuthConfig:
      type: object
      required: [oidcEnabled, devAuthEnabled, loginUrl, devAccounts, instance]
      properties:
        instance: { $ref: "#/components/schemas/InstanceInfo" }
        oidcEnabled: { type: boolean }
        devAuthEnabled: { type: boolean }
        loginUrl: { type: string }
        devAccounts:
          type: array
          items: { $ref: "#/components/schemas/DevAccount" }
        teamRequestUrl:
          type: string
          nullable: true
          description: Where people request a new team (only platform admins create teams)
    InstanceInfo:
      type: object
      description: How this deployment presents itself (INSTANCE_NAME, ORG_NAME, UI_THEME, UI_LOGO_URL, SUPPORT_URL).
      required: [name, orgName, theme, logoUrl, supportUrl]
      properties:
        name: { type: string, example: Grounded, description: "Product name shown in the UI and page titles" }
        orgName: { type: string, example: Example University, description: "Organisation name (empty when not configured)" }
        theme: { type: string, enum: [neutral], description: "UI theme, applied as data-brand on the html element" }
        logoUrl: { type: string, nullable: true, example: "https://www.example.edu/logo.svg", description: "https URL or same-origin path of the logo" }
        supportUrl: { type: string, nullable: true, example: "https://help.example.edu/ai", description: "Where the Help link points: an http(s) URL or a mailto: address" }
    PlatformRole:
      type: string
      enum: [none, platform_admin, platform_auditor]
    UserStatus:
      type: string
      enum: [active, suspended]
    User:
      type: object
      required: [id, email, displayName, platformRole, status, revision, createdAt]
      properties:
        revision: { $ref: "#/components/schemas/Revision" }
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        platformRole: { $ref: "#/components/schemas/PlatformRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        teamCount: { type: integer, format: int64, description: "Teams the user belongs to (admin user list only)" }
    Capabilities:
      type: object
      required: [platformAdmin, platformAuditor]
      properties:
        platformAdmin: { type: boolean }
        platformAuditor: { type: boolean }
    Me:
      type: object
      required: [user, csrfToken, capabilities, teams]
      properties:
        teams:
          type: array
          items: { $ref: "#/components/schemas/MyTeam" }
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    Revision:
      type: integer
      format: int64
      description: Increases on every change. Send it back in If-Match.
    TeamRole:
      type: string
      enum: [owner, admin, editor, member]
    TeamStatus:
      type: string
      enum: [active, archived]
    Audience:
      type: string
      enum: [team, all_authenticated, public]
    MyTeam:
      type: object
      required: [id, slug, name, status, maxClassification, role]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/TeamStatus" }
        maxClassification: { type: string }
        role: { $ref: "#/components/schemas/TeamRole" }
    Team:
      type: object
      required: [id, slug, name, description, maxClassification, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        maxClassification: { type: string }
        status: { $ref: "#/components/schemas/TeamStatus" }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
    TeamView:
      type: object
      required: [team]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        role:
          description: The caller's role; absent when viewing as a platform admin or auditor
          allOf: [{ $ref: "#/components/schemas/TeamRole" }]
    TeamSummary:
      type: object
      required: [team, memberCount, ownerCount, agentCount, sourceCount, kbCount, documentCount, storageBytes]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        memberCount: { type: integer, format: int64 }
        ownerCount: { type: integer, format: int64 }
        agentCount: { type: integer, format: int64 }
        sourceCount: { type: integer, format: int64, description: The team's own data sources (shared sources aren't counted) }
        kbCount: { type: integer, format: int64 }
        documentCount: { type: integer, format: int64 }
        storageBytes: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TeamSummary" }
        nextCursor: { type: string, nullable: true }
    TeamCreate:
      type: object
      required: [slug, name, maxClassification, ownerEmail]
      properties:
        slug: { type: string, example: registrar }
        name: { type: string, example: Office of the Registrar }
        description: { type: string }
        maxClassification: { type: string, example: sensitive }
        ownerEmail: { type: string, format: email }
    TeamCreated:
      type: object
      required: [team, owner]
      properties:
        team: { $ref: "#/components/schemas/TeamSummary" }
        owner: { $ref: "#/components/schemas/MemberAddResult" }
    TeamUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        maxClassification: { type: string }
        status: { $ref: "#/components/schemas/TeamStatus" }
    GroupMappingStatus:
      type: object
      required: [groupsClaim, oidcEnabled, ruleCount, peopleSeen, peopleWithClaim, recentSignIns, recentWithClaim, groups]
      properties:
        groupsClaim: { type: string, description: The OIDC claim read at sign-in (OIDC_GROUPS_CLAIM), example: groups }
        oidcEnabled: { type: boolean, description: Whether single sign-on is configured }
        ruleCount: { type: integer, format: int64 }
        peopleSeen: { type: integer, format: int64, description: People who have signed in since group mapping was installed }
        peopleWithClaim: { type: integer, format: int64, description: "Of those, people whose last sign-in carried the claim" }
        lastClaimAt: { type: string, format: date-time, nullable: true, description: The last sign-in that carried the claim }
        recentSignIns: { type: integer, format: int64, description: People who signed in during the last 30 days }
        recentWithClaim: { type: integer, format: int64, description: "Of those, people whose sign-in carried the claim" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SeenGroup" }
    SeenGroup:
      type: object
      required: [name, people]
      properties:
        name: { type: string, description: "The group, lower-cased" }
        people: { type: integer, format: int64, description: People whose last sign-in carried it }
    GroupRule:
      type: object
      required: [id, group, team, teamStatus, role, memberCount, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        group: { type: string, description: The IdP group; matching ignores case, example: registrar-staff }
        team: { $ref: "#/components/schemas/TeamRef" }
        teamStatus: { $ref: "#/components/schemas/TeamStatus" }
        role: { $ref: "#/components/schemas/TeamRole" }
        memberCount: { type: integer, format: int64, description: Memberships this rule grants now }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GroupRuleCreate:
      type: object
      required: [group, team, role]
      properties:
        group: { type: string, minLength: 1, maxLength: 256, example: registrar-staff }
        team: { type: string, description: Team slug or ID, example: registrar }
        role: { $ref: "#/components/schemas/TeamRole" }
    GroupRuleUpdate:
      type: object
      properties:
        group: { type: string, minLength: 1, maxLength: 256 }
        role: { $ref: "#/components/schemas/TeamRole" }
    GroupRulePreviewRequest:
      type: object
      properties:
        ruleId: { type: string, format: uuid, description: An existing rule (to change or delete) }
        group: { type: string, maxLength: 256, description: The proposed group (not with delete) }
        team: { type: string, description: The team (slug or ID) of a new rule }
        role: { $ref: "#/components/schemas/TeamRole" }
        delete: { type: boolean, default: false, description: Preview deleting ruleId }
    GroupRulePreview:
      type: object
      required: [team, changes]
      properties:
        team: { $ref: "#/components/schemas/TeamRef" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/GroupRuleChange" }
    GroupRuleChange:
      type: object
      required: [user, kind]
      properties:
        user: { $ref: "#/components/schemas/MemberUser" }
        kind:
          type: string
          enum: [add, raise, lower, remove, manual, last_owner]
          description: >-
            add, raise, lower and remove change the membership; manual (added
            by hand, left alone) and last_owner (the team's last owner, kept)
            don't
        from:
          description: The current role (absent when not a member)
          allOf: [{ $ref: "#/components/schemas/TeamRole" }]
        to:
          description: The new role (absent when removed; for manual, the role the rule would give)
          allOf: [{ $ref: "#/components/schemas/TeamRole" }]
        groupsSeenAt: { type: string, format: date-time, nullable: true, description: The sign-in the person's groups are from }
    MemberManagedBy:
      type: object
      description: >-
        The membership was created by the SSO group mapping. With a ruleId,
        the rule manages it: owners can't change or remove it by hand (it
        would be undone at the person's next sign-in). Without one, the rule
        was deleted while the person was the team's last owner; it can be
        changed by hand, and is removed at a later sign-in once the team has
        another owner.
      properties:
        ruleId: { type: string, format: uuid, nullable: true }
        group: { type: string, nullable: true, description: The rule's IdP group }
    OwnerAssign:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Member:
      type: object
      required: [user, role, revision, createdAt]
      properties:
        user: { $ref: "#/components/schemas/MemberUser" }
        role: { $ref: "#/components/schemas/TeamRole" }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        managedBy: { $ref: "#/components/schemas/MemberManagedBy" }
    MemberUser:
      type: object
      required: [id, email, displayName, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
    MemberAdd:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/TeamRole" }
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/TeamRole" }
    MemberAddResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [added, invited]
        member: { $ref: "#/components/schemas/Member" }
        invite: { $ref: "#/components/schemas/Invite" }
    Invite:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/TeamRole" }
        invitedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Classification:
      type: object
      required: [key, name, description, rank, maxAudience, anonymousRetentionHours, conversationRetentionDays, allowedSourceTypes, directRetrieve, revision, createdAt, updatedAt]
      properties:
        key: { type: string, example: sensitive }
        name: { type: string }
        description: { type: string }
        rank: { type: integer, format: int32, description: Higher is more sensitive }
        maxAudience: { $ref: "#/components/schemas/Audience" }
        anonymousRetentionHours: { type: integer, format: int32, description: How long anonymous conversations of agents at this level are kept }
        conversationRetentionDays: { type: integer, format: int32, nullable: true, description: "Days signed-in conversations of agents at this level are kept after their last activity; null keeps them until deleted" }
        allowedSourceTypes:
          type: array
          description: The data source types that may hold data at this level
          items: { type: string, enum: [upload, web] }
        directRetrieve: { type: boolean, description: "Team API keys may call /retrieve on knowledge bases at this level" }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClassificationCreate:
      type: object
      required: [key, name, rank, maxAudience]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        rank: { type: integer, format: int32 }
        maxAudience: { $ref: "#/components/schemas/Audience" }
    ClassificationUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        maxAudience:
          description: Narrowing is refused (409 classification_impact) while published agents at this level use a wider audience
          allOf: [{ $ref: "#/components/schemas/Audience" }]
        anonymousRetentionHours: { type: integer, format: int32, minimum: 1, maximum: 876000 }
        conversationRetentionDays: { type: integer, format: int32, minimum: 0, maximum: 36500, description: "Days to keep signed-in conversations; 0 keeps them until deleted" }
        allowedSourceTypes:
          type: array
          minItems: 1
          items: { type: string, enum: [upload, web] }
        directRetrieve: { type: boolean }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        nextCursor: { type: string, nullable: true }
    UserDetail:
      type: object
      required: [user, teams]
      properties:
        user: { $ref: "#/components/schemas/User" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/MyTeam" }
    UserUpdate:
      type: object
      properties:
        platformRole: { $ref: "#/components/schemas/PlatformRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
    AuditEntry:
      type: object
      required: [id, occurredAt, actorKind, actor, action, targetType, targetId, targetLabel, targetExists, metadata, requestId]
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actorKind: { type: string, enum: [user, api_key, system] }
        actorUserId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        action: { type: string, example: team.member_add }
        actor: { $ref: "#/components/schemas/AuditActor" }
        targetType: { type: string }
        targetId: { type: string }
        targetLabel:
          type: string
          nullable: true
          description: >-
            The target's current name, resolved when the log is read. For a
            deleted target, the last name recorded in the audit log; null when
            none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        parent:
          allOf: [{ $ref: "#/components/schemas/AuditParent" }]
          nullable: true
          description: >-
            The object the target belongs to, for linking: a publishable
            (widget) key's agent, a document's data source. Null for other
            target types.
        before: { description: Configuration before the change, nullable: true }
        after: { description: Configuration after the change, nullable: true }
        metadata: { type: object, additionalProperties: true }
        requestId: { type: string }
    AuditParent:
      type: object
      required: [type, id, label, exists]
      properties:
        type: { type: string, enum: [agent, data_source] }
        id: { type: string, format: uuid }
        label: { type: string, nullable: true, description: "The parent's current name; null when it no longer exists" }
        exists: { type: boolean }
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required: [kind]
      properties:
        kind: { type: string, enum: [user, api_key, system] }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        apiKeyName: { type: string, description: The API key used (api_key actors) }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor: { type: string, nullable: true }
    RequestTimings:
      type: object
      description: >-
        Phases of the test's first request, which opens a new connection.
        A slow dns points at name resolution (for example search domains or
        ndots in a cluster), connect at the network path, tls at the
        handshake, and firstByte at the proxy and model themselves.
      required: [dnsMs, connectMs, tlsMs, firstByteMs, reused]
      properties:
        dnsMs: { type: number, format: double, description: "Name resolution; 0 for an IP address" }
        connectMs: { type: number, format: double, description: TCP connect (to the HTTP proxy when one is used) }
        tlsMs: { type: number, format: double, description: "TLS handshake; 0 for http" }
        firstByteMs: { type: number, format: double, description: From sending the request to the first byte of the response }
        reused: { type: boolean, description: "An idle connection was reused, so there were no DNS, connect or TLS phases" }
    ProxyError:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [unavailable, auth, not_found, rate_limited, bad_request, bad_response] }
        status: { type: integer, description: "HTTP status from the proxy, when it answered" }
        message: { type: string }
    Connection:
      type: object
      required: [id, name, description, baseUrl, hasApiKey, apiKeyHint, timeoutSeconds, requestsPerMinute, maxConcurrentRequests, enabled, modelCount, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Campus AI gateway }
        description: { type: string }
        baseUrl: { type: string, example: "https://ai-gateway.example.edu/v1" }
        hasApiKey: { type: boolean, description: The key itself is never returned }
        apiKeyHint: { type: string, description: "Last 4 characters of the key, or empty" }
        timeoutSeconds: { type: integer, format: int32 }
        requestsPerMinute:
          type: integer
          format: int32
          nullable: true
          description: >-
            Most requests Grounded sends through this connection per minute, across
            all Grounded processes (null = unlimited). Set it just below the proxy
            key's limit (for example 110 for a gateway that allows 120): ingestion then
            paces itself and yields to interactive queries instead of collecting
            429 responses.
        maxConcurrentRequests:
          type: integer
          format: int32
          minimum: 1
          maximum: 256
          description: >-
            Most requests each Grounded process sends through this connection at
            once. Applies to SystemOne models, whose GPU serves requests
            largely one after another (default 8).
        enabled: { type: boolean }
        modelCount: { type: integer, format: int64 }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectionCreate:
      type: object
      required: [name, baseUrl]
      properties:
        name: { type: string }
        description: { type: string }
        baseUrl: { type: string, description: "OpenAI-compatible base URL including the version prefix, for example https://proxy.example.edu/v1" }
        apiKey: { type: string, description: Stored encrypted; never returned }
        timeoutSeconds: { type: integer, format: int32, minimum: 1, maximum: 600, default: 60 }
        requestsPerMinute: { type: integer, format: int32, minimum: 0, maximum: 1000000, description: "Request limit per minute; omit or 0 for unlimited" }
        maxConcurrentRequests: { type: integer, format: int32, minimum: 1, maximum: 256, default: 8, description: "Requests in flight at once per Grounded process (SystemOne models)" }
        enabled: { type: boolean, default: true }
    ConnectionUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        baseUrl: { type: string }
        apiKey: { type: string, description: "Omit to keep the stored key; send an empty string to remove it" }
        timeoutSeconds: { type: integer, format: int32, minimum: 1, maximum: 600 }
        requestsPerMinute: { type: integer, format: int32, minimum: 0, maximum: 1000000, description: "Omit to keep; 0 removes the limit" }
        maxConcurrentRequests: { type: integer, format: int32, minimum: 1, maximum: 256 }
        enabled: { type: boolean }
    ConnectionTestResult:
      type: object
      required: [ok, latencyMs, models]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        models:
          type: array
          description: Model IDs the proxy advertises. Nothing is added automatically.
          items: { type: string }
        error: { $ref: "#/components/schemas/ProxyError" }
        timings: { $ref: "#/components/schemas/RequestTimings" }
    ModelKind:
      type: string
      description: "systemone is a SystemOne judgment model (ADR-0020): typed questions over POST {base}/v1/systemone"
      enum: [chat, embedding, rerank, moderation, systemone]
    ModelCompat:
      type: object
      description: >-
        OpenAI-compatibility flags for proxy quirks (DESIGN.md §10). Omitted
        flags use defaults. A PATCH that sends compat replaces all flags, so
        send the flags to keep too.
      properties:
        supportsDeveloperRole: { type: boolean, description: "Chat: send the system prompt with role developer. Default false." }
        supportsReasoningEffort: { type: boolean, description: "Chat: send reasoning_effort. Default false." }
        supportsStreamUsage: { type: boolean, description: "Chat: send stream_options.include_usage. Default true." }
        maxTokensField: { type: string, enum: [max_tokens, max_completion_tokens] }
        supportsToolChoice: { type: boolean, description: "Chat: the server honours tool_choice (e.g. required). Default false." }
        thinkingField: { type: string, enum: [reasoning_content, reasoning], description: "Chat: the streamed reasoning field. Default: whichever is present." }
        supportsDimensionsParam:
          type: boolean
          description: >-
            Embedding: send the dimensions parameter when a profile stores fewer
            dimensions than the model's. Default false: Grounded truncates the vectors
            and L2-renormalises them itself (Matryoshka models only).
        extraBody:
          type: object
          additionalProperties: true
          description: >-
            Chat and moderation: a JSON object merged into every chat completion
            request, for server extensions. At most 4096 bytes; it cannot set
            fields Grounded controls (model, messages, stream, stream_options, tools,
            tool_choice, parallel_tool_calls, functions, function_call, n, user,
            max_tokens, max_completion_tokens, temperature, reasoning_effort).
          example: { chat_template_kwargs: { enable_thinking: false } }
    Model:
      type: object
      required: [id, connectionId, key, upstreamModel, displayName, description, kind, maxClassification, enabled, supportsTools, supportsVision, compat, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        key: { type: string, example: nomic-embed }
        upstreamModel: { type: string, example: nomic-embed-text-v1.5 }
        displayName: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        maxClassification: { type: string }
        enabled: { type: boolean }
        contextWindow: { type: integer, format: int32, nullable: true }
        maxOutputTokens: { type: integer, format: int32, nullable: true }
        supportsTools: { type: boolean }
        supportsVision: { type: boolean }
        dimensions: { type: integer, format: int32, nullable: true }
        maxInputTokens: { type: integer, format: int32, nullable: true }
        compat: { $ref: "#/components/schemas/ModelCompat" }
        moderationProvider:
          nullable: true
          description: Moderation models only
          allOf: [{ $ref: "#/components/schemas/ModerationProvider" }]
        moderationFamily:
          nullable: true
          description: guardrail_chat models only
          allOf: [{ $ref: "#/components/schemas/GuardrailFamily" }]
        moderationTimeoutSeconds:
          type: integer
          format: int32
          nullable: true
          description: >-
            Moderation models only: the timeout of one attempt of a check
            (a timed-out check is retried once). Null uses the platform
            default, MODERATION_TIMEOUT, or 30 seconds for chat_classifier
            models if that is longer.
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModerationProvider:
      type: string
      description: >-
        How a moderation model is called (ADR-0019): an OpenAI-compatible
        /moderations endpoint, a guardrail model over /chat/completions, or
        any chat model as a JSON classifier. system_one is reported for
        SystemOne models (kind systemone), which moderation policies use
        directly; new moderation models cannot choose it (ADR-0020).
      enum: [moderations_endpoint, guardrail_chat, chat_classifier, system_one]
    GuardrailFamily:
      type: string
      enum: [llama_guard, granite_guardian, shieldgemma]
    ModelCreate:
      type: object
      required: [connectionId, key, upstreamModel, displayName, kind, maxClassification]
      properties:
        connectionId: { type: string, format: uuid }
        key: { type: string }
        upstreamModel: { type: string }
        displayName: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        maxClassification: { type: string }
        enabled: { type: boolean, default: true }
        contextWindow: { type: integer, format: int32 }
        maxOutputTokens: { type: integer, format: int32 }
        supportsTools: { type: boolean }
        supportsVision: { type: boolean }
        dimensions: { type: integer, format: int32, description: Required for embedding models }
        maxInputTokens: { type: integer, format: int32 }
        compat: { $ref: "#/components/schemas/ModelCompat" }
        moderationProvider: { $ref: "#/components/schemas/ModerationProvider" }
        moderationFamily: { $ref: "#/components/schemas/GuardrailFamily" }
        moderationTimeoutSeconds: { type: integer, format: int32, minimum: 0, maximum: 120, description: "Moderation models only: seconds per check attempt, 1-120; 0 or absent uses the platform default" }
    ModelUpdate:
      type: object
      properties:
        upstreamModel: { type: string }
        displayName: { type: string }
        description: { type: string }
        maxClassification: { type: string }
        enabled: { type: boolean }
        contextWindow: { type: integer, format: int32 }
        maxOutputTokens: { type: integer, format: int32 }
        supportsTools: { type: boolean }
        supportsVision: { type: boolean }
        dimensions: { type: integer, format: int32 }
        maxInputTokens: { type: integer, format: int32 }
        compat: { $ref: "#/components/schemas/ModelCompat" }
        moderationProvider: { $ref: "#/components/schemas/ModerationProvider" }
        moderationFamily: { $ref: "#/components/schemas/GuardrailFamily" }
        moderationTimeoutSeconds: { type: integer, format: int32, minimum: 0, maximum: 120, description: "Moderation models only: seconds per check attempt, 1-120; 0 or absent uses the platform default" }
    TokenUsage:
      type: object
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
    ModelTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        dimensions: { type: integer, format: int32, description: Embedding dimensions the proxy returned }
        dimensionsMatch: { type: boolean, description: Whether they match the configured dimensions }
        reply: { type: string, description: Start of the chat reply }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        moderation: { $ref: "#/components/schemas/ModerationModelTest" }
        systemOne: { $ref: "#/components/schemas/SystemOneModelTest" }
        error: { $ref: "#/components/schemas/ProxyError" }
        timings: { $ref: "#/components/schemas/RequestTimings" }
    SystemOneModelTest:
      type: object
      description: SystemOne models - one fixed noul (yes/no) and one fixed score question
      required: [noulState, noulQuestion, noul, scoreState, scoreQuestion, scoreLevels, score]
      properties:
        noulState: { type: string }
        noulQuestion: { type: string }
        noul: { type: number, format: double, description: Probability of yes (expected high) }
        scoreState: { type: string }
        scoreQuestion: { type: string }
        scoreLevels:
          type: array
          items: { type: string }
        score: { type: number, format: double, description: "Position on the levels, 0 to len-1 (expected near the top)" }
    ModerationModelTest:
      type: object
      description: Moderation models - the scores of one benign and one harmful fixed sample
      required: [benignText, harmfulText, benign, harmful]
      properties:
        benignText: { type: string }
        harmfulText: { type: string }
        benign: { $ref: "#/components/schemas/ModerationResult" }
        harmful: { $ref: "#/components/schemas/ModerationResult" }
    ModerationCategory:
      type: string
      enum: [violence, self_harm, sexual, sexual_minors, harassment_hate, illicit, personal_data, prompt_injection]
    ModerationScore:
      type: object
      required: [category, probability, supported]
      properties:
        category: { $ref: "#/components/schemas/ModerationCategory" }
        probability: { type: number, format: double, minimum: 0, maximum: 1 }
        supported: { type: boolean, description: False when the provider cannot judge this category }
    ModerationResult:
      type: object
      description: A provider's normalised answer, one score per category (no text is stored)
      required: [provider, calibrated, latencyMs, scores]
      properties:
        provider: { type: string, example: guardrail_chat/llama_guard }
        calibrated: { type: boolean, description: "The scores are probabilities (System One, guardrails with logprobs, /moderations), so thresholds can be tuned" }
        latencyMs: { type: integer, format: int64 }
        scores:
          type: array
          items: { $ref: "#/components/schemas/ModerationScore" }
        severity:
          type: number
          format: double
          nullable: true
          description: "How much harm complying would do, 0 (none) to 3 (severe); only SystemOne providers rate it"
    ModerationTestRequest:
      type: object
      required: [modelId, text]
      properties:
        modelId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 8000 }
        stage: { type: string, enum: [input, output], default: input, description: "output judges the text as an assistant's answer" }
    ModerationAction:
      type: string
      description: "support (self_harm only) replaces the message or answer with the policy's support message, for example crisis resources"
      enum: ["off", flag, block, support]
    ModerationRule:
      type: object
      required: [action, threshold]
      properties:
        action: { $ref: "#/components/schemas/ModerationAction" }
        threshold: { type: number, format: double, minimum: 0, maximum: 1, description: The action applies when the category's probability reaches this }
    ModerationCategoryRules:
      type: object
      required: [input, output]
      properties:
        input: { $ref: "#/components/schemas/ModerationRule" }
        output: { $ref: "#/components/schemas/ModerationRule" }
    ModerationOutputMode:
      type: string
      description: "stream_retract: answers stream and a failing answer is replaced; buffer: answers are sent only after they pass"
      enum: [stream_retract, buffer]
    ModerationPolicy:
      type: object
      description: An audience's platform moderation policy (defaults until saved, with revision 1)
      required: [audience, modelId, categories, outputMode, failClosed, notice, severityBlock, supportMessage, uncalibratedBlockThreshold, revision, updatedAt]
      properties:
        audience: { $ref: "#/components/schemas/Audience" }
        modelId: { type: string, format: uuid, nullable: true, description: The provider (a moderation or SystemOne model) }
        categories:
          type: object
          description: Rules by category (every category is present)
          additionalProperties: { $ref: "#/components/schemas/ModerationCategoryRules" }
        outputMode: { $ref: "#/components/schemas/ModerationOutputMode" }
        failClosed: { type: boolean, description: A provider error or timeout refuses the answer (always true for public) }
        notice: { type: string, description: Replaces a blocked question's answer or a blocked answer }
        severityBlock:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 3
          description: "Block when the provider's severity score (0 none, 1 mild, 2 serious, 3 severe) reaches this; null = off. Only SystemOne providers rate severity."
        supportMessage: { type: string, description: Replaces a question or answer that triggers a support action }
        uncalibratedBlockThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            The effective floor of block thresholds when the provider is not
            calibrated (chat classifiers, guardrails without
            log-probabilities): a block rule scoring at or above its own
            threshold but below this one flags instead (default 0.95; 0 treats
            uncalibrated scores like calibrated ones). Support actions are not
            affected.
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { type: string, format: date-time, nullable: true }
    ModerationPolicyInput:
      type: object
      required: [modelId, categories, outputMode, failClosed]
      properties:
        modelId: { type: string, format: uuid, nullable: true }
        categories:
          type: object
          description: Rules by category; categories left out are off
          additionalProperties: { $ref: "#/components/schemas/ModerationCategoryRules" }
        outputMode: { $ref: "#/components/schemas/ModerationOutputMode" }
        failClosed: { type: boolean }
        notice: { type: string, maxLength: 500 }
        severityBlock: { type: number, format: double, nullable: true, minimum: 0, maximum: 3 }
        supportMessage: { type: string, maxLength: 1000 }
        uncalibratedBlockThreshold: { type: number, format: double, minimum: 0, maximum: 1, description: "Default 0.95 when absent" }
    AgentModeration:
      type: object
      description: >-
        An agent's moderation override. It can only make the audience's
        platform policy stricter: a rule's action and threshold combine with
        the platform's (the stronger action, the lower threshold), off keeps
        the platform's rule, and outputMode buffer buffers where the platform
        streams. The Phase 3 value "off" is still accepted as no override.
      properties:
        categories:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModerationCategoryRules" }
        outputMode: { type: string, enum: ["", buffer] }
        severityBlock: { type: number, format: double, minimum: 0, maximum: 3, description: "Block at this severity or the platform's, whichever is lower" }
    ModelRef:
      type: object
      required: [id, key, displayName, maxClassification, enabled]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        displayName: { type: string }
        maxClassification: { type: string }
        enabled: { type: boolean }
    EmbeddingProfile:
      type: object
      required: [id, key, name, description, model, dimensions, storageType, documentPrefix, queryPrefix, chunkSize, chunkOverlap, chunkerVersion, status, isDefault, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: nomic-768 }
        name: { type: string }
        description: { type: string }
        model: { $ref: "#/components/schemas/ModelRef" }
        dimensions: { type: integer, format: int32, description: "Dimensions of the stored vectors: outputDimensions when set, else the model's" }
        outputDimensions:
          type: integer
          format: int32
          nullable: true
          description: Fewer dimensions than the model's, stored after Matryoshka truncation; null when the profile stores the model's own dimensions
        defaultFusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          nullable: true
          description: Fusion weights of knowledge bases on this profile that don't set their own; null means the platform default
        storageType: { type: string, enum: [halfvec, vector] }
        documentPrefix: { type: string }
        queryPrefix: { type: string }
        chunkSize: { type: integer, format: int32 }
        chunkOverlap: { type: integer, format: int32 }
        chunkerVersion: { type: integer, format: int32 }
        status: { type: string, enum: [active, retired] }
        isDefault: { type: boolean }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmbeddingProfileCreate:
      type: object
      required: [key, name, modelId]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        modelId: { type: string, format: uuid, description: An enabled embedding model; the profile uses its dimensions unless outputDimensions is set }
        outputDimensions:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Store fewer dimensions than the model's (at most the model's, and at
            most 4000 for halfvec or 2000 for vector). Only for Matryoshka models
            such as Qwen3-Embedding; the model's supportsDimensionsParam flag
            decides whether the server or Grounded shortens the vectors. Omit to
            store the model's dimensions.
          example: 768
        defaultFusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          description: Omit to use the platform default
        storageType: { type: string, enum: [halfvec, vector], default: halfvec }
        documentPrefix: { type: string, example: "search_document: " }
        queryPrefix: { type: string, example: "search_query: " }
        chunkSize: { type: integer, format: int32, default: 512 }
        chunkOverlap: { type: integer, format: int32, default: 0 }
        isDefault: { type: boolean }
    EmbeddingProfileUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, retired] }
        isDefault: { type: boolean }
        defaultFusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          description: Set the profile's default fusion weights (knowledge bases without their own follow them)
        usePlatformFusionWeights:
          type: boolean
          description: true removes the profile's default fusion weights so its knowledge bases follow the platform default. Cannot be combined with defaultFusionWeights.
    ProfileRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AdminKnowledgeBase:
      type: object
      required: [id, name, teamSlug, teamName, profile, sources, passages, migration]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        teamSlug: { type: string }
        teamName: { type: string }
        profile: { $ref: "#/components/schemas/ProfileRef" }
        sources: { type: integer, format: int64 }
        passages: { type: integer, format: int64, description: Passages of ready documents in the profile in use }
        migration:
          type: object
          nullable: true
          description: The running or switched migration
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ProfileMigrationStatus" }
    ProfileMigrationTarget:
      type: object
      required: [kbId, targetProfileId]
      properties:
        kbId: { type: string, format: uuid }
        targetProfileId: { type: string, format: uuid }
    ProfileMigrationStart:
      type: object
      required: [kbId, targetProfileId]
      properties:
        kbId: { type: string, format: uuid }
        targetProfileId: { type: string, format: uuid }
        graceDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 90
          description: Days the old vectors are kept after the switch, so the knowledge base can switch back (default PROFILE_MIGRATION_GRACE_DAYS, 7). 0 deletes them at the switch.
    ProfileMigrationStatus:
      type: string
      description: >-
        running: re-embedding (the knowledge base still searches its old
        profile); switched: it searches the new profile and the old vectors
        are kept until oldVectorsUntil; completed: old vectors deleted;
        cancelled; switched_back.
      enum: [running, switched, completed, cancelled, switched_back]
    ProfileMigrationIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Blockers: same_profile, profile_retired, profile_unusable,
            model_classification, dimensions, migration_active. Warnings:
            rechunk, shared_sources, documents_in_progress, failed_documents,
            no_rate_limit, maintenance_suggested, no_sources.
        message: { type: string }
    ProfileMigrationEstimate:
      type: object
      required: [documents, passages, tokens, embeddingCalls, requestsPerMinute, minutes, rechunk]
      properties:
        documents: { type: integer, format: int64, description: Ready documents to embed }
        passages: { type: integer, format: int64, description: "Passages to embed (about, when re-chunked)" }
        tokens: { type: integer, format: int64, description: "Tokens to embed, counted by Grounded (about)" }
        embeddingCalls: { type: integer, format: int64, description: Embedding requests at EMBED_BATCH_SIZE inputs (and EMBED_BATCH_TOKENS) per request }
        requestsPerMinute: { type: integer, format: int32, nullable: true, description: "The target connection's request limit; null: not limited by Grounded" }
        minutes: { type: number, format: double, nullable: true, description: Time at the connection's request limit; null without one }
        rechunk: { type: boolean, description: "The target's chunk settings differ, so passages are cut again from the stored parsed text" }
    ProfileMigrationPreflightSource:
      type: object
      required: [id, name, shared, otherKnowledgeBases, documents, passages, tokens, inProgress, failed, alreadyEmbedded]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shared: { type: boolean, description: A platform-shared source }
        otherKnowledgeBases: { type: integer, format: int64, description: Other knowledge bases using the source; it keeps both sets of vectors until all have moved }
        documents: { type: integer, format: int64 }
        passages: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64, description: Documents still being processed; embedded for both profiles when they finish }
        failed: { type: integer, format: int64, description: "Failed documents (not indexed, nothing to move)" }
        alreadyEmbedded: { type: boolean, description: The source already has vectors for the target profile (another knowledge base moved it) }
    ProfileMigrationPreflight:
      type: object
      required: [kb, target, sources, estimate, blockers, warnings, maintenance, defaultGraceDays]
      properties:
        kb:
          type: object
          required: [id, name, teamSlug, teamName, profile]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            teamSlug: { type: string }
            teamName: { type: string }
            profile: { $ref: "#/components/schemas/ProfileRef" }
        target:
          type: object
          required: [id, name, model, dimensions, storageType, chunkSize, chunkOverlap, maxClassification]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            model: { type: string, description: The model's display name }
            dimensions: { type: integer, format: int32 }
            storageType: { type: string }
            chunkSize: { type: integer, format: int32 }
            chunkOverlap: { type: integer, format: int32 }
            maxClassification: { type: string, description: The model's classification ceiling }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ProfileMigrationPreflightSource" }
        estimate: { $ref: "#/components/schemas/ProfileMigrationEstimate" }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ProfileMigrationIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ProfileMigrationIssue" }
        maintenance: { type: boolean, description: "Maintenance mode is on (optional; it pauses new ingestion, not the migration)" }
        defaultGraceDays: { type: integer, format: int32 }
    ProfileMigrationSource:
      type: object
      required: [id, name, shared, state, documents, done, failed, waiting, error]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shared: { type: boolean }
        state:
          type: string
          description: "in_progress: being embedded; complete: every ready document has vectors for the target; attention: documents failed"
          enum: [in_progress, complete, attention]
        documents: { type: integer, format: int64, description: Ready documents }
        done: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        waiting: { type: integer, format: int64, description: Documents waiting to be retried after a temporary error }
        error: { type: string, description: Why the source can't progress right now (empty when fine) }
    ProfileMigrationFailure:
      type: object
      required: [documentId, sourceId, sourceName, title, code, message, attempts, failedAt]
      properties:
        documentId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceName: { type: string }
        title: { type: string }
        code: { type: string }
        message: { type: string }
        attempts: { type: integer, format: int32 }
        failedAt: { type: string, format: date-time }
    ProfileMigration:
      type: object
      required: [id, status, kb, teamSlug, teamName, fromProfile, toProfile, graceDays, estimate, startedAt, startedBy, switchedAt, oldVectorsUntil, finishedAt, canSwitchBack, progress, revision]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ProfileMigrationStatus" }
        kb: { $ref: "#/components/schemas/ProfileRef" }
        teamSlug: { type: string }
        teamName: { type: string }
        fromProfile: { $ref: "#/components/schemas/ProfileRef" }
        toProfile: { $ref: "#/components/schemas/ProfileRef" }
        graceDays: { type: integer, format: int32 }
        estimate: { $ref: "#/components/schemas/ProfileMigrationEstimate" }
        startedAt: { type: string, format: date-time }
        startedBy:
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
          nullable: true
        switchedAt: { type: string, format: date-time, nullable: true }
        oldVectorsUntil: { type: string, format: date-time, nullable: true, description: Until when the old vectors are kept (switch back possible) }
        finishedAt: { type: string, format: date-time, nullable: true }
        canSwitchBack: { type: boolean }
        progress:
          type: object
          description: Totals over the knowledge base's sources (running migrations; zero afterwards)
          required: [sources, sourcesComplete, documents, done, failed, waiting]
          properties:
            sources: { type: integer, format: int64 }
            sourcesComplete: { type: integer, format: int64 }
            documents: { type: integer, format: int64 }
            done: { type: integer, format: int64 }
            failed: { type: integer, format: int64 }
            waiting: { type: integer, format: int64 }
        sources:
          type: array
          description: Per-source progress (one migration, running only)
          items: { $ref: "#/components/schemas/ProfileMigrationSource" }
        failures:
          type: array
          description: Documents that failed, newest first (at most 50; one migration, running only)
          items: { $ref: "#/components/schemas/ProfileMigrationFailure" }
        revision: { $ref: "#/components/schemas/Revision" }
    ChatModelOption:
      type: object
      required: [id, key, displayName, description, maxClassification, supportsTools, supportsReasoningEffort]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        displayName: { type: string }
        description: { type: string }
        maxClassification: { type: string, description: "Most sensitive data the model may process; an agent's knowledge bases must not exceed it" }
        contextWindow: { type: integer, format: int32, nullable: true }
        maxOutputTokens: { type: integer, format: int32, nullable: true }
        supportsTools: { type: boolean, description: "Required for retrieval mode tool" }
        supportsReasoningEffort: { type: boolean }
    EmbeddingProfileOption:
      type: object
      required: [id, key, name, description, dimensions, chunkSize, maxClassification, isDefault]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        dimensions: { type: integer, format: int32 }
        chunkSize: { type: integer, format: int32 }
        maxClassification: { type: string, description: "Most sensitive data the profile's model may process" }
        isDefault: { type: boolean }
    DocumentStatus:
      type: string
      enum: [pending, queued, processing, ready, failed, skipped]
    DocumentCounts:
      type: object
      required: [total, pending, processing, ready, failed, skipped, bytes, chunks]
      properties:
        total: { type: integer, format: int64 }
        pending: { type: integer, format: int64, description: Pending or queued }
        processing: { type: integer, format: int64 }
        ready: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        skipped: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        chunks: { type: integer, format: int64 }
    DataSource:
      type: object
      required: [id, name, description, type, classification, embeddingProfileId, status, documents, revision, createdAt, updatedAt, web, lastSyncAt, nextSyncAt, activeCrawl, boilerplate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [upload, web] }
        classification: { type: string }
        embeddingProfileId: { type: string, format: uuid }
        status: { type: string, enum: [active, paused] }
        documents: { $ref: "#/components/schemas/DocumentCounts" }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        web:
          description: The web configuration (web sources only)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebConfig" }]
        lastSyncAt: { type: string, format: date-time, nullable: true, description: When the last crawl completed }
        nextSyncAt: { type: string, format: date-time, nullable: true, description: When the next scheduled crawl starts }
        activeCrawl:
          description: The queued or running crawl, if any
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Crawl" }]
        boilerplate: { $ref: "#/components/schemas/SourceBoilerplate" }
    BoilerplateSettings:
      type: object
      description: >-
        A source's repeated-boilerplate overrides (ADR-0021). An omitted field inherits the platform
        default for the source's type (on for web sources, off for uploads; minDocs 5, ratio 0.2 unless the
        install changes them). Sending the object replaces all overrides; send {} to use the defaults.
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: Leave repeated blocks out of chunks }
        minDocs: { type: integer, minimum: 2, maximum: 100000, description: A block must be in at least this many documents }
        ratio: { type: number, format: double, minimum: 0.05, maximum: 1, description: "... and in at least this share of the source's documents" }
      example: { enabled: true, minDocs: 5, ratio: 0.2 }
    SourceBoilerplate:
      type: object
      description: >-
        Repeated-boilerplate suppression for a source: the settings in force and what they remove. A block
        is repeated when at least max(minDocs, ceil(ratio x documents)) documents contain it; one copy stays
        in the document with the shortest URL.
      required: [enabled, minDocs, ratio, overrides, repeatedBlocks, pagesAffected, documentsCounted, threshold, refreshedAt, pending]
      properties:
        enabled: { type: boolean }
        minDocs: { type: integer }
        ratio: { type: number, format: double }
        overrides: { $ref: "#/components/schemas/BoilerplateSettings" }
        repeatedBlocks: { type: integer, format: int64, description: Distinct blocks classified as repeated }
        pagesAffected: { type: integer, format: int64, description: Documents they were removed from }
        documentsCounted: { type: integer, format: int32, description: Documents counted at the last refresh }
        threshold: { type: integer, format: int32, description: Documents a block needed at the last refresh }
        refreshedAt: { type: string, format: date-time, nullable: true, description: When the last refresh was requested (null before the first) }
        pending: { type: boolean, description: A refresh is scheduled or running; the counts may change }
    BoilerplateBlock:
      type: object
      required: [text, documents]
      properties:
        text: { type: string, description: "The first 80 characters of the block, without Markdown" }
        documents: { type: integer, format: int32, description: Documents that contain it }
      example: { text: "QUICKLINKS", documents: 29 }
    DataSourceCreate:
      type: object
      required: [name, classification]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [upload, web], default: upload, description: Fixed at creation }
        classification: { type: string }
        embeddingProfileId: { type: string, format: uuid, description: Defaults to the platform default profile }
        web: { $ref: "#/components/schemas/WebConfigInput" }
        boilerplate: { $ref: "#/components/schemas/BoilerplateSettings" }
    DataSourceUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        classification: { type: string }
        status: { type: string, enum: [active, paused], description: Paused sources accept no uploads and start no crawls }
        reason: { type: string, description: Required when lowering the classification }
        web: { $ref: "#/components/schemas/WebConfigInput" }
        boilerplate:
          description: Replaces the boilerplate overrides; changing them re-checks the source's documents
          allOf: [{ $ref: "#/components/schemas/BoilerplateSettings" }]
    Document:
      type: object
      required: [id, sourceId, title, filename, url, kind, sizeBytes, version, status, errorCode, errorMessage, errorDetail, pages, chunkCount, tokenCount, warnings, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        title: { type: string }
        filename: { type: string }
        url: { type: string }
        kind: { type: string, description: "Detected format: pdf, docx, pptx, html, markdown or text" }
        sizeBytes: { type: integer, format: int64 }
        version: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        errorCode: { type: string }
        errorMessage: { type: string, description: "Why the document wasn't indexed, for people (e.g. \"This PDF appears to be damaged or password-protected…\")" }
        errorDetail: { type: string, description: "The technical detail behind errorMessage (the parser's own text), shown on demand; '' when there is none" }
        pages: { type: integer, format: int32 }
        chunkCount: { type: integer, format: int32 }
        tokenCount: { type: integer, format: int32 }
        warnings:
          type: array
          items: { type: string }
        tags:
          type: array
          description: Used by metadata filters. Set on upload (tags field), by PATCH, or by a web source's tags setting.
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }
    DocumentPassage:
      type: object
      description: A searchable piece of a document (a chunk)
      required: [ordinal, content, headingPath, pageStart, pageEnd, tokenCount]
      properties:
        ordinal: { type: integer, format: int32, description: "Position in the document, from 0" }
        content: { type: string }
        headingPath:
          type: array
          items: { type: string }
        pageStart: { type: integer, format: int32, description: "First page (0 when the format has no pages)" }
        pageEnd: { type: integer, format: int32 }
        tokenCount: { type: integer, format: int32 }
    DocumentPassagePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentPassage" }
        total: { type: integer, format: int32, description: All passages of the document }
    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        nextCursor: { type: string, nullable: true }
    UploadResult:
      type: object
      required: [filename, status]
      properties:
        filename: { type: string }
        status: { type: string, enum: [created, replaced, unchanged, rejected] }
        document: { $ref: "#/components/schemas/Document" }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { $ref: "#/components/schemas/LimitErrorDetails" }
    KBSource:
      type: object
      required: [id, name, classification, shared]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        classification: { type: string }
        shared: { type: boolean, description: A platform-shared source }
    KnowledgeBase:
      type: object
      required: [id, name, description, embeddingProfileId, topK, sources, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        embeddingProfileId: { type: string, format: uuid }
        topK: { type: integer, format: int32 }
        sources:
          type: array
          items: { $ref: "#/components/schemas/KBSource" }
        effectiveClassification: { type: string, nullable: true, description: The most sensitive attached source }
        fusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          nullable: true
          description: This knowledge base's hybrid fusion weights; absent or null when it uses the default (its embedding profile's, else the platform's)
        effectiveFusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          description: The weights retrieval uses (this knowledge base's, else its embedding profile's default, else the platform default). Agents searching the knowledge base use them too. Always sent.
        fusionWeightsSource:
          type: string
          enum: [knowledge_base, profile, platform]
          description: Where effectiveFusionWeights come from. Always sent.
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FusionWeights:
      type: object
      description: >-
        Weighted reciprocal rank fusion of vector and keyword (full-text) search:
        score = vector / (60 + vector rank) + keyword / (60 + keyword rank).
        Each weight is 0-1 and at least one is above 0. A keyword weight of 0
        makes retrieval vector-only.
      required: [vector, keyword]
      properties:
        vector: { type: number, format: double, minimum: 0, maximum: 1 }
        keyword: { type: number, format: double, minimum: 0, maximum: 1 }
    KnowledgeBaseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        embeddingProfileId: { type: string, format: uuid, description: "Defaults to the platform default; cannot change later" }
        topK: { type: integer, format: int32, minimum: 1, maximum: 50, default: 8 }
        fusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          description: Omit to use the default (the embedding profile's, else the platform's)
    KnowledgeBaseUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        topK: { type: integer, format: int32, minimum: 1, maximum: 50 }
        fusionWeights:
          allOf: [{ $ref: "#/components/schemas/FusionWeights" }]
          description: Override the default fusion weights for this knowledge base
        useDefaultFusionWeights:
          type: boolean
          description: true removes this knowledge base's override so it follows the default (its embedding profile's, else the platform's). Cannot be combined with fusionWeights.
    RetrieveRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 4000 }
        topK: { type: integer, minimum: 1, maximum: 50, description: "Defaults to the knowledge base's setting" }
        filters: { $ref: "#/components/schemas/MetadataFilter" }
        judge:
          type: boolean
          description: >-
            Judge the platform's candidate count of fused hits with the
            SystemOne model and return every candidate with its scores and
            route: evidence, then conflicting, then dropped (team editors
            signed in; 409 systemone_unavailable without a SystemOne model).
            topK is ignored.
    RetrieveHit:
      type: object
      required: [chunkId, documentId, sourceId, content, headingPath, title, filename, url, score]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        content: { type: string }
        headingPath:
          type: array
          items: { type: string }
        pageStart: { type: integer, format: int32, nullable: true }
        pageEnd: { type: integer, format: int32, nullable: true }
        title: { type: string }
        filename: { type: string }
        url: { type: string }
        score: { type: number, format: double, description: "Weighted reciprocal rank fusion score (see FusionWeights); higher is better" }
        vectorRank: { type: integer, nullable: true }
        lexicalRank: { type: integer, nullable: true }
        judgment: { $ref: "#/components/schemas/PassageJudgment" }
    PassageJudgment:
      type: object
      description: >-
        A SystemOne model's answers about the passage and the query, and the
        route the thresholds give it (docs/systemone.md §2). skipped: the
        request failed or timed out, so the passage kept its rank as evidence.
      required: [relevant, evidence, contradicts, injection, route, skipped]
      properties:
        relevant: { type: number, format: double }
        evidence: { type: number, format: double }
        contradicts: { type: number, format: double }
        injection: { type: number, format: double }
        route: { type: string, enum: [evidence, conflicting, dropped] }
        reason: { type: string, enum: [injection, irrelevant, not_usable], description: Why a dropped passage was dropped }
        skipped: { type: boolean }
    RetrieveResult:
      type: object
      required: [hits, latencyMs]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/RetrieveHit" }
        latencyMs: { type: integer, format: int64 }
        judging: { $ref: "#/components/schemas/RetrieveJudging" }
    RetrieveJudging:
      type: object
      required: [mode, judged, kept, dropped, skipped, requests, latencyMs]
      properties:
        mode: { type: string, enum: [per_passage, batched] }
        judged: { type: integer }
        kept: { type: integer, description: Evidence and conflicting passages }
        dropped: { type: integer }
        skipped: { type: integer }
        requests: { type: integer }
        latencyMs: { type: integer, format: int64 }
    APIKeyScope:
      type: string
      enum: [query, ingest, manage]
    APIKey:
      type: object
      required: [id, name, kind, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [personal, service] }
        prefix: { type: string, description: "Identifies the key; the secret is never shown again" }
        userId: { type: string, format: uuid, nullable: true, description: "Owner (personal) or responsible contact (service)" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/APIKeyScope" }
        knowledgeBaseIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        agentIds:
          type: array
          nullable: true
          description: The agents the key may use (the OpenAI-compatible endpoint and agent APIs); null = every agent of the team
          items: { type: string, format: uuid }
        contact:
          allOf: [{ $ref: "#/components/schemas/APIKeyContact" }]
          nullable: true
          description: The owner (personal) or responsible contact (service), named in lists; null when that user no longer exists
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true, description: "When the key was revoked; null while it is active (lists show active keys only)" }
        createdAt: { type: string, format: date-time }
    APIKeyContact:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, description: "The display name ('' when unset)" }
        email: { type: string }
    APIKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        kind: { type: string, enum: [personal, service], default: personal }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/APIKeyScope" }
        knowledgeBaseIds:
          type: array
          items: { type: string, format: uuid }
        agentIds:
          type: array
          description: Restrict the key to these agents of the team (DESIGN.md §3.3); absent or empty = every agent
          items: { type: string, format: uuid }
        responsibleUserId:
          type: string
          format: uuid
          description: Service keys only - the responsible contact, an active member of the team (default the creator); 400 invalid_contact otherwise
        expiresAt: { type: string, format: date-time }
    APIKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        secret: { type: string, description: "Shown once. Send as: Authorization: Bearer <secret>" }
    WebConfig:
      type: object
      description: A web source's normalised configuration (crawl-only settings are zero for scrape and batch)
      required: [mode, urls, maxDepth, maxPages, includePrefixes, exclude, allowSubdomains, useSitemaps, schedule, tags]
      properties:
        mode: { $ref: "#/components/schemas/WebMode" }
        urls:
          type: array
          items: { type: string }
        maxDepth: { type: integer }
        maxPages: { type: integer }
        includePrefixes:
          type: array
          items: { type: string }
        exclude:
          type: array
          items: { type: string }
        allowSubdomains: { type: boolean }
        useSitemaps: { type: boolean }
        schedule: { $ref: "#/components/schemas/WebSchedule" }
        tags:
          type: array
          description: Tags applied to every page of the source
          items: { type: string }
    WebConfigInput:
      type: object
      description: >-
        A web source's configuration. URLs are normalised; every host must be on
        the crawl allowlist or approved for the team by a domain request
        (400 host_not_allowed). Unknown fields are rejected.
      required: [mode, urls]
      properties:
        mode: { $ref: "#/components/schemas/WebMode" }
        urls:
          type: array
          description: "scrape: exactly 1; batch: 1-1000; crawl: 1-20 seeds"
          items: { type: string }
        maxDepth: { type: integer, minimum: 0, maximum: 10, description: "crawl only: link hops from a seed (default 3)" }
        maxPages: { type: integer, minimum: 1, description: "1 to the platform's CRAWL_MAX_PAGES (default: 500 for crawl, the URL count for batch; always 1 for scrape)" }
        includePrefixes:
          type: array
          description: "crawl only: path prefixes to follow, e.g. /admissions/ (empty = the whole host)"
          items: { type: string }
        exclude:
          type: array
          description: "crawl only: path patterns to skip, e.g. /calendar/** (* within a segment, ** across segments)"
          items: { type: string }
        allowSubdomains: { type: boolean, description: "crawl only: also follow subdomains of the seed hosts (default false)" }
        useSitemaps: { type: boolean, description: "crawl only: also seed from robots.txt/sitemap.xml (default true)" }
        schedule: { $ref: "#/components/schemas/WebSchedule" }
        tags:
          type: array
          maxItems: 20
          description: Tags applied to every page (lower-cased, 1-64 characters, no commas); changing them retags existing pages
          items: { type: string, maxLength: 64 }
    WebMode:
      type: string
      enum: [scrape, batch, crawl]
    WebSchedule:
      type: string
      enum: [manual, daily, weekly]
      default: manual
    CrawlStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    Crawl:
      type: object
      required: [id, sourceId, status, trigger, pagesDiscovered, pagesFetched, pagesChanged, pagesUnchanged, pagesSkipped, pagesFailed, documentsDeleted, truncated, truncatedReason, waitingReason, waitingUntil, error, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CrawlStatus" }
        trigger: { type: string, enum: [create, manual, schedule, page], description: "page: a re-fetch of one page (refetchDocument)" }
        pagesDiscovered: { type: integer, format: int32, description: URLs added to the frontier }
        pagesFetched: { type: integer, format: int32 }
        pagesChanged: { type: integer, format: int32, description: New or changed pages queued for processing }
        pagesUnchanged: { type: integer, format: int32 }
        pagesSkipped: { type: integer, format: int32, description: "robots.txt, host not allowed, blocked address, unsupported content, out of scope" }
        pagesFailed: { type: integer, format: int32 }
        documentsDeleted: { type: integer, format: int32, description: Pages that disappeared from the site }
        truncated: { type: boolean, description: "A limit stopped the crawl early (see truncatedReason); stale pages were not deleted" }
        truncatedReason:
          type: string
          nullable: true
          enum: [max_pages, documents_limit, storage_limit]
          description: "Why the crawl stopped early: the source's maxPages, or the team's documents or storage limit"
        waitingReason:
          type: string
          nullable: true
          enum: [concurrent_crawls, daily_page_limit, maintenance]
          description: "Why an active crawl is waiting: queued until the team has a free crawl slot, paused until the next UTC day because the team crawled its pages for today, or parked until maintenance mode ends"
        waitingUntil: { type: string, format: date-time, nullable: true, description: "When a daily_page_limit wait ends" }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    CrawlConflictResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              required: [crawl]
              properties:
                crawl: { $ref: "#/components/schemas/Crawl" }
    ClassificationConflictResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { $ref: "#/components/schemas/ClassificationImpact" }
    ClassificationImpact:
      type: object
      description: "What raising a classification would break (ADR-0006 rule 6): knowledge bases whose team is approved below the level (rule 2, shared sources) and published agents whose chat model or audience isn't allowed for it (rules 4-5)"
      required: [classification, affected, agents]
      properties:
        classification: { type: string }
        affected:
          type: array
          items: { $ref: "#/components/schemas/ImpactedKnowledgeBase" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/ImpactedAgent" }
    ImpactedAgent:
      type: object
      required: [agentId, agentName, teamId, teamSlug, teamName, modelName, modelMaxClassification, audience, reasons, reasonText]
      properties:
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        teamId: { type: string, format: uuid }
        teamSlug: { type: string }
        teamName: { type: string }
        modelName: { type: string }
        modelMaxClassification: { type: string }
        audience: { type: string, description: "team, all_authenticated or public" }
        reasons:
          type: array
          description: "model: the chat model isn't approved for the level; audience: the audience isn't allowed for it"
          items: { type: string, enum: [model, audience] }
        reasonText:
          type: array
          description: One sentence per reason, in the same order, for display
          items: { type: string }
    ImpactedKnowledgeBase:
      type: object
      required: [teamId, teamSlug, teamName, teamMaxClassification, knowledgeBaseId, knowledgeBaseName]
      properties:
        teamId: { type: string, format: uuid }
        teamSlug: { type: string }
        teamName: { type: string }
        teamMaxClassification: { type: string }
        knowledgeBaseId: { type: string, format: uuid }
        knowledgeBaseName: { type: string }
    SharedSource:
      type: object
      description: A platform-shared source as teams see it (no documents)
      required: [id, name, description, type, classification, embeddingProfileId, status, documents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [upload, web] }
        classification: { type: string }
        embeddingProfileId: { type: string, format: uuid }
        status: { type: string, enum: [active, paused] }
        documents: { $ref: "#/components/schemas/DocumentCounts" }
    MapRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        useSitemaps: { type: boolean, default: false }
        limit: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        includePrefixes:
          type: array
          items: { type: string }
        exclude:
          type: array
          items: { type: string }
        allowSubdomains: { type: boolean, default: false }
    MapResult:
      type: object
      required: [urls, truncated, sitemapUrls]
      properties:
        urls:
          type: array
          description: The page itself, then in-scope links and sitemap URLs, deduplicated
          items: { type: string }
        truncated: { type: boolean, description: The limit or the 30 s bound cut discovery short }
        sitemapUrls: { type: integer, description: How many of the URLs came from sitemaps }
    PersonRef:
      type: object
      required: [id, displayName, email]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
    LimitKey:
      type: string
      description: A team limit. See GET /v1/admin/limits for labels and descriptions.
      enum: [storage_bytes, documents, data_sources, knowledge_bases, agents, crawl_pages_per_day, concurrent_crawls, concurrent_ingest_jobs, ocr_pages_per_day, queries_per_minute, queries_per_day, api_key_queries_per_minute, user_queries_per_minute, chat_tokens_per_day, concurrent_chats_per_user, public_queries_per_ip_per_minute, public_queries_per_session_per_minute, public_queries_per_agent_per_day, public_tokens_per_agent_per_day, public_concurrent_chats_per_agent, public_message_max_chars]
    LimitGroup:
      type: string
      description: public limits apply per agent to anonymous public-page and widget traffic
      enum: [resources, ingestion, queries, public]
    LimitUnit:
      type: string
      enum: [count, bytes]
    LimitPeriod:
      type: string
      description: "none: a total or a concurrency level; minute; day: a UTC day"
      enum: [none, minute, day]
    LimitValue:
      type: integer
      format: int64
      minimum: 0
      nullable: true
    LimitErrorDetails:
      type: object
      required: [limit, max, current]
      properties:
        limit: { $ref: "#/components/schemas/LimitKey" }
        max: { type: integer, format: int64, description: "The team's limit (0 = blocked)" }
        current: { type: integer, format: int64, description: Current usage when the request was refused }
    LimitErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { $ref: "#/components/schemas/LimitErrorDetails" }
    PlatformLimit:
      type: object
      required: [key, group, unit, period, label, description, default, ceiling, builtInDefault, custom]
      properties:
        key: { $ref: "#/components/schemas/LimitKey" }
        group: { $ref: "#/components/schemas/LimitGroup" }
        unit: { $ref: "#/components/schemas/LimitUnit" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        label: { type: string }
        description: { type: string }
        default:
          description: Applies to teams without an override; null = unlimited
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        ceiling:
          description: The most a team override (and the default) may be; null = no ceiling
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        builtInDefault:
          description: The default before any platform admin changed it
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        custom: { type: boolean, description: A platform admin has set this limit }
    PlatformLimits:
      type: object
      required: [revision, updatedAt, items]
      properties:
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformLimit" }
    PlatformLimitSetting:
      type: object
      required: [key, default, ceiling]
      properties:
        key: { $ref: "#/components/schemas/LimitKey" }
        default:
          description: null = unlimited; must be at most the ceiling
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        ceiling:
          description: null = no ceiling
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
    PlatformLimitsUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformLimitSetting" }
    TeamLimitOverride:
      type: object
      required: [key, group, unit, period, label, description, override, default, ceiling, effective]
      properties:
        key: { $ref: "#/components/schemas/LimitKey" }
        group: { $ref: "#/components/schemas/LimitGroup" }
        unit: { $ref: "#/components/schemas/LimitUnit" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        label: { type: string }
        description: { type: string }
        override:
          description: The team's own value (0 = blocked); null = inherits the default
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        default: { $ref: "#/components/schemas/LimitValue" }
        ceiling: { $ref: "#/components/schemas/LimitValue" }
        effective:
          description: override ?? default, capped by the ceiling; null = unlimited
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
    TeamLimitOverrides:
      type: object
      required: [teamId, revision, items]
      properties:
        teamId: { type: string, format: uuid }
        revision: { $ref: "#/components/schemas/Revision" }
        items:
          type: array
          items: { $ref: "#/components/schemas/TeamLimitOverride" }
    TeamLimitOverrideChange:
      type: object
      required: [key, value]
      properties:
        key: { $ref: "#/components/schemas/LimitKey" }
        value:
          description: A number (0 blocks), or null to inherit the platform default
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
    TeamLimitOverridesUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TeamLimitOverrideChange" }
    TeamLimit:
      type: object
      required: [key, group, unit, period, label, description, max, used, overridden]
      properties:
        key: { $ref: "#/components/schemas/LimitKey" }
        group: { $ref: "#/components/schemas/LimitGroup" }
        unit: { $ref: "#/components/schemas/LimitUnit" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        label: { type: string }
        description: { type: string }
        max:
          description: The effective limit (0 = blocked); null = unlimited
          allOf: [{ $ref: "#/components/schemas/LimitValue" }]
        used:
          type: integer
          format: int64
          nullable: true
          description: "Current usage: totals, today's (UTC) count, running now, or this minute for the per-minute query rates (the team's; for each API key and each person, the busiest one's); null when not measured (the public per-address and per-visitor rates)"
        overridden: { type: boolean, description: The team has its own value (set by a platform admin) }
    TeamLimits:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TeamLimit" }
    DomainRequestStatus:
      type: string
      enum: [pending, approved, denied, revoked]
    DomainRequest:
      type: object
      required: [id, teamId, teamSlug, teamName, pattern, reason, status, requestedBy, reviewedBy, requester, reviewer, reviewNote, reviewedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamSlug: { type: string }
        teamName: { type: string }
        pattern: { type: string, description: '"example.org" (that host) or "*.example.org" (the domain and every subdomain)' }
        reason: { type: string }
        status: { $ref: "#/components/schemas/DomainRequestStatus" }
        requestedBy: { type: string, format: uuid, nullable: true }
        reviewedBy: { type: string, format: uuid, nullable: true }
        requester:
          description: Who asked (null when the user no longer exists)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        reviewer:
          description: Who reviewed it last (null until reviewed)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        reviewNote: { type: string }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    DomainRequestCreate:
      type: object
      required: [pattern, reason]
      properties:
        pattern: { type: string, example: "*.example.org" }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    DomainReview:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny, revoke] }
        note: { type: string, maxLength: 1000 }
    AllowlistEntry:
      type: object
      required: [id, pattern, note, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        pattern: { type: string }
        note: { type: string }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AllowlistCreate:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, example: "*.example.edu", description: '"*" (every public host), "*.example.edu" or "example.edu"' }
        note: { type: string, maxLength: 500 }
    MetadataFilter:
      type: object
      description: >-
        Restricts retrieval by document metadata. Empty lists do not filter.
        sourceIds is intersected with the knowledge base's sources.
      properties:
        sourceIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        kinds:
          type: array
          maxItems: 50
          description: "Document kinds: pdf, docx, pptx, html, md (markdown) or txt (text)"
          items: { type: string, enum: [pdf, docx, pptx, html, md, txt, markdown, text] }
        tags:
          type: array
          maxItems: 50
          description: Documents with any of these tags (case-insensitive)
          items: { type: string, maxLength: 64 }
        urlPrefixes:
          type: array
          maxItems: 50
          description: Web pages whose URL starts with one of these http(s) URLs
          items: { type: string }
        updatedAfter: { type: string, format: date-time, description: Documents last updated at or after this time }
        updatedBefore: { type: string, format: date-time, description: Documents last updated before this time }
    DocumentUpdate:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 20
          description: Replaces the document's tags (lower-cased, 1-64 characters, no commas)
          items: { type: string, maxLength: 64 }
    AgentStatus:
      type: string
      enum: [active, disabled_by_team, disabled_by_platform]
    RetrievalMode:
      type: string
      enum: [always, tool]
    CitationMode:
      type: string
      description: "none: no citations; snippet: title and snippet; snippet_link: also the URL of web pages"
      enum: [none, snippet, snippet_link]
    ReasoningEffort:
      type: string
      enum: [low, medium, high]
    AgentKB:
      type: object
      required: [kbId]
      properties:
        kbId: { type: string, format: uuid }
        topK:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: >-
            Results per search from this knowledge base. Absent or null
            inherits the knowledge base's own top-k (and follows it when it
            changes); a number overrides it for this agent.
    AgentConfig:
      type: object
      description: An agent's configuration (the draft, or a published version), with defaults applied.
      required: [instructions, chatModelId, kbs, retrievalMode, maxTurns, contextTokenBudget, minSimilarity, strictlyGrounded, refusalMessage, citationMode, queryRewrite, moderation, audience]
      properties:
        instructions: { type: string, maxLength: 20000 }
        chatModelId: { type: string, format: uuid, nullable: true }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }
        maxOutputTokens: { type: integer, minimum: 1 }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        kbs:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/AgentKB" }
        retrievalMode: { $ref: "#/components/schemas/RetrievalMode" }
        maxTurns: { type: integer, minimum: 1, maximum: 8, description: "Tool mode: turns that may search" }
        contextTokenBudget: { type: integer, minimum: 500, maximum: 32000, description: Sources are trimmed to this many estimated tokens (characters / 4) }
        filters: { $ref: "#/components/schemas/MetadataFilter" }
        minSimilarity: { type: number, format: double, minimum: 0, maximum: 1, description: "Hits whose vector similarity (1 - cosine distance) is lower are dropped; 0 = off" }
        strictlyGrounded: { type: boolean }
        refusalMessage: { type: string, maxLength: 500 }
        citationMode: { $ref: "#/components/schemas/CitationMode" }
        queryRewrite: { type: boolean, description: "With history, rewrite the question as a query that stands on its own before retrieval" }
        moderation: { $ref: "#/components/schemas/AgentModeration" }
        audience:
          description: Who may chat once published (a draft setting, versioned with publish)
          allOf: [{ $ref: "#/components/schemas/Audience" }]
        systemOne: { $ref: "#/components/schemas/AgentSystemOne" }
    AgentConfigInput:
      type: object
      description: >-
        A draft configuration. Every field is optional (defaults apply); types
        and ranges are checked (400 invalid_config with details.problems) but an
        incomplete draft (no model, no knowledge bases) can be saved. Unknown
        fields are rejected.
      properties:
        instructions: { type: string, maxLength: 20000 }
        chatModelId: { type: string, format: uuid, nullable: true }
        temperature: { type: number, format: double, minimum: 0, maximum: 2, nullable: true }
        maxOutputTokens: { type: integer, minimum: 1, nullable: true }
        reasoningEffort: { type: string, enum: [low, medium, high, ""] }
        kbs:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/AgentKB" }
        retrievalMode: { $ref: "#/components/schemas/RetrievalMode" }
        maxTurns: { type: integer, minimum: 1, maximum: 8, default: 4 }
        contextTokenBudget: { type: integer, minimum: 500, maximum: 32000, default: 6000 }
        filters: { $ref: "#/components/schemas/MetadataFilter" }
        minSimilarity: { type: number, format: double, minimum: 0, maximum: 1, default: 0 }
        strictlyGrounded: { type: boolean, default: true }
        refusalMessage: { type: string, maxLength: 500, default: "I couldn't find an answer to that in the sources I have." }
        citationMode: { $ref: "#/components/schemas/CitationMode" }
        queryRewrite: { type: boolean, default: true }
        moderation: { $ref: "#/components/schemas/AgentModeration" }
        audience:
          description: >-
            Default team. Editors publish to team; team admins and owners to
            any audience the classification allows. Public also needs public
            access on and a working public moderation policy.
          allOf: [{ $ref: "#/components/schemas/Audience" }]
        systemOne: { $ref: "#/components/schemas/AgentSystemOne" }
    AgentSystemOne:
      type: object
      description: >-
        The agent's "SystemOne checks" (Configure, Advanced). Absent or empty
        follows the platform. Only takes effect when a SystemOne model is
        configured; thresholds are platform-only.
      properties:
        judging: { type: string, enum: ["", "on", "off"], description: '"" follows the platform default' }
        candidates: { type: integer, minimum: 1, maximum: 50, description: Fused hits judged per search (default the platform's) }
        citations: { type: string, enum: ["", "on", "off"], description: 'Citation checks; "" follows the platform default' }
        citationMode: { type: string, enum: ["", annotate, enforce], description: '"" uses the platform''s mode' }
        scope: { type: string, enum: ["", "on", "off"], description: 'The scope check; "" follows the platform default' }
    SystemOneThresholds:
      type: object
      description: "The routing table, first match wins: injection >= injection drops; relevant < relevant drops; contradicts >= contradicts is conflicting evidence; evidence >= evidence is evidence; otherwise dropped"
      required: [injection, relevant, contradicts, evidence]
      properties:
        injection: { type: number, format: double, minimum: 0, maximum: 1 }
        relevant: { type: number, format: double, minimum: 0, maximum: 1 }
        contradicts: { type: number, format: double, minimum: 0, maximum: 1 }
        evidence: { type: number, format: double, minimum: 0, maximum: 1 }
    SystemOneJudging:
      type: object
      required: [enabled, candidates, mode, timeoutMs, thresholds]
      properties:
        enabled: { type: boolean, description: The default for agents without an override }
        candidates: { type: integer, minimum: 1, maximum: 50 }
        mode: { type: string, enum: [per_passage, batched], description: "per_passage: one request per candidate; batched: one request for all (faster, less discriminating)" }
        timeoutMs: { type: integer, minimum: 500, maximum: 60000, description: Per request; a request that times out keeps its passage (fail-open) }
        thresholds: { $ref: "#/components/schemas/SystemOneThresholds" }
    SystemOneCitations:
      type: object
      description: >-
        Citation checks: after the answer, each claim and the source it cites
        get one question (supports, contradicts or says nothing).
      required: [enabled, mode, autoAccept, timeoutMs]
      properties:
        enabled: { type: boolean, description: The default for agents without an override }
        mode:
          type: string
          enum: [annotate, enforce]
          description: >-
            annotate: citations are marked verified, unsupported or
            contradicted. enforce: also removes the markers of confidently
            unsupported or contradicted claims; a strictly grounded agent none
            of whose claims is supported refuses.
        autoAccept: { type: number, format: double, minimum: 0, maximum: 1, description: "Confidence at or above which a verdict stands on its own: enforce acts only on these; lower ones are counted for review" }
        timeoutMs: { type: integer, minimum: 500, maximum: 60000, description: Bounds the whole check of one answer; claims not checked by then stay unchecked }
    SystemOneScope:
      type: object
      description: >-
        The scope check: before retrieval, is the message small talk, and is it
        within the agent's subject? Small talk is answered without retrieval;
        a strictly grounded agent refuses an out-of-scope question without
        retrieval or a chat-model call.
      required: [enabled, smallTalk, inScope, timeoutMs]
      properties:
        enabled: { type: boolean, description: The default for agents without an override }
        smallTalk: { type: number, format: double, minimum: 0, maximum: 1, description: "At or above: small talk" }
        inScope: { type: number, format: double, minimum: 0, maximum: 1, description: "Below (and not small talk): out of scope" }
        timeoutMs: { type: integer, minimum: 500, maximum: 60000, description: On timeout the message is answered normally }
    SystemOneSettings:
      type: object
      required: [modelId, judging, citations, scope, revision, updatedAt]
      properties:
        modelId: { type: string, format: uuid, nullable: true, description: The SystemOne model the features use }
        judging: { $ref: "#/components/schemas/SystemOneJudging" }
        citations: { $ref: "#/components/schemas/SystemOneCitations" }
        scope: { $ref: "#/components/schemas/SystemOneScope" }
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { type: string, format: date-time, nullable: true }
    SystemOneSettingsInput:
      type: object
      required: [modelId, judging]
      properties:
        modelId: { type: string, format: uuid, nullable: true }
        judging: { $ref: "#/components/schemas/SystemOneJudging" }
        citations: { $ref: "#/components/schemas/SystemOneCitations" }
        scope: { $ref: "#/components/schemas/SystemOneScope" }
    SystemOneStatus:
      type: object
      required: [available, judging, citations, scope]
      properties:
        available: { type: boolean, description: A usable SystemOne model is configured }
        judging:
          type: object
          required: [enabled, candidates]
          properties:
            enabled: { type: boolean, description: The platform default }
            candidates: { type: integer }
        citations:
          type: object
          required: [enabled, mode]
          properties:
            enabled: { type: boolean, description: The platform default }
            mode: { type: string, enum: [annotate, enforce] }
        scope:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: The platform default }
    AgentProblem:
      type: object
      required: [field, problem]
      properties:
        field: { type: string, example: "kbs", description: "The config field (for example kbs[0].kbId, chatModelId), or draft.* / published in warnings" }
        problem: { type: string }
    AgentConfigErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "invalid_config, or another 400 code such as invalid_name or insufficient_contrast" }
            message: { type: string }
            details:
              type: object
              properties:
                problems:
                  type: array
                  items: { $ref: "#/components/schemas/AgentProblem" }
                contrast: { type: number, format: double }
                minimum: { type: number, format: double }
    AgentInvalidResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [agent_invalid] }
            message: { type: string }
            details:
              type: object
              required: [problems]
              properties:
                problems:
                  type: array
                  items: { $ref: "#/components/schemas/AgentProblem" }
    AgentVersionKB:
      type: object
      required: [id, name, topK, inherited]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: '"" when the knowledge base no longer exists' }
        topK: { type: integer, description: Results per search in effect (the knowledge base's current top-k when inherited) }
        inherited: { type: boolean, description: The version doesn't set results per search for this knowledge base; it uses the knowledge base's }
    AgentVersion:
      type: object
      required: [id, version, publishedAt, publishedBy, publishedByName, note, chatModelId, chatModelName, effectiveRank, classification, knowledgeBases, config]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string, format: uuid, nullable: true }
        publishedByName: { type: string }
        note: { type: string }
        chatModelId: { type: string, format: uuid }
        chatModelName: { type: string }
        effectiveRank: { type: integer, format: int32, description: Classification rank when published (rechecked on every query) }
        classification: { type: string, description: The classification level at that rank }
        knowledgeBases:
          type: array
          items: { $ref: "#/components/schemas/AgentVersionKB" }
        config: { $ref: "#/components/schemas/AgentConfig" }
    Agent:
      type: object
      required: [id, teamId, teamSlug, slug, name, description, accentColor, welcomeMessage, starterQuestions, status, disabledReason, disabledAt, audience, draft, draftRevision, published, hasUnpublishedChanges, warnings, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamSlug: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        accentColor: { type: string, description: '#rrggbb, or "" for the platform default' }
        welcomeMessage: { type: string }
        starterQuestions:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus" }
        disabledReason: { type: string }
        disabledAt: { type: string, format: date-time, nullable: true }
        audience:
          description: The published audience (the draft's is draft.audience)
          allOf: [{ $ref: "#/components/schemas/Audience" }]
        draft: { $ref: "#/components/schemas/AgentConfig" }
        draftRevision: { type: integer, format: int64, description: Increases whenever the draft config changes }
        published:
          nullable: true
          description: The version users talk to
          allOf: [{ $ref: "#/components/schemas/AgentVersion" }]
        hasUnpublishedChanges: { type: boolean }
        warnings:
          type: array
          description: Publish problems of the draft (field draft.*) and policy problems of the published version (field published)
          items: { $ref: "#/components/schemas/AgentProblem" }
        revision: { $ref: "#/components/schemas/Revision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, description: Defaults to one derived from the name; same rules as team slugs }
        description: { type: string, maxLength: 500 }
        accentColor: { type: string, description: "#rrggbb with at least 4.5:1 contrast against white (400 insufficient_contrast)" }
        welcomeMessage: { type: string, maxLength: 1000 }
        starterQuestions:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 200 }
        config: { $ref: "#/components/schemas/AgentConfigInput" }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string }
        description: { type: string, maxLength: 500 }
        accentColor: { type: string }
        welcomeMessage: { type: string, maxLength: 1000 }
        starterQuestions:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 200 }
        config: { $ref: "#/components/schemas/AgentConfigInput" }
    AgentPublish:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    AgentRevert:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int32, minimum: 1 }
    AgentStatusChange:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled_by_team] }
        reason: { type: string, maxLength: 500 }
    SearchResult:
      type: object
      description: >-
        One match of GET /v1/search, with what the app needs to link to it:
        teams open /admin/teams/{teamSlug}; users /admin/users/{id}; models,
        connections and embedding profiles their admin list with ?record={id};
        shared sources /admin/shared-sources/{id}; agents the team's agent
        page (canOpen) or the chat (canChat, /a/{teamSlug}/{agentSlug});
        knowledge bases and data sources their team page; conversations the
        chat with ?c={id}.
      required: [type, id, label, secondary]
      properties:
        type:
          type: string
          enum: [team, user, model, connection, embedding_profile, shared_source, agent, knowledge_base, data_source, conversation]
        id: { type: string, format: uuid }
        label:
          type: string
          description: The name (a user's display name, or their email without one; a conversation's title)
        secondary:
          type: string
          description: >-
            A second line: the team's name (agents, knowledge bases, data
            sources), the agent's name (conversations), the email (users), the
            slug (teams), the key (models, embedding profiles) or the base URL
            (connections). May be empty.
        kind:
          type: string
          description: A model's kind (chat, embedding, moderation…) or a data source's type (upload, web)
        status:
          type: string
          description: >-
            The object's state when it isn't the normal one: archived (teams),
            suspended (users), disabled (models, connections), retired
            (embedding profiles), paused (sources), agent_deleted
            (conversations of a deleted agent)
        teamSlug:
          type: string
          description: The team (teams, agents, knowledge bases, data sources, conversations)
        agentSlug:
          type: string
          description: The agent (agents, conversations)
        canOpen:
          type: boolean
          description: Agents only. The caller is a member of the agent's team and may open its page.
        canChat:
          type: boolean
          description: Agents only. The agent is published and active and the caller may chat with it.
    AgentCard:
      type: object
      description: A published agent's public profile
      required: [id, teamSlug, teamName, slug, name, description, accentColor, welcomeMessage, starterQuestions, citationMode, status, audience, shortName]
      properties:
        id: { type: string, format: uuid }
        teamSlug: { type: string }
        teamName: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        accentColor: { type: string }
        welcomeMessage: { type: string }
        starterQuestions:
          type: array
          items: { type: string }
        citationMode: { $ref: "#/components/schemas/CitationMode" }
        status: { $ref: "#/components/schemas/AgentStatus" }
        audience: { $ref: "#/components/schemas/Audience" }
        group:
          type: string
          enum: [team, organisation, public]
          description: "Directory only: team (one of your teams), organisation (all signed-in users) or public"
        shortName: { type: string, nullable: true, description: "The /a/{short} address, if a platform admin assigned one" }
    PublicAgent:
      type: object
      description: A public agent's profile for anonymous visitors
      required: [id, name, teamName, description, accentColor, welcomeMessage, starterQuestions, citationMode, status, shortName, captcha, maxMessageChars]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        teamName: { type: string }
        description: { type: string }
        accentColor: { type: string }
        welcomeMessage: { type: string }
        starterQuestions:
          type: array
          items: { type: string }
        citationMode: { $ref: "#/components/schemas/CitationMode" }
        status: { $ref: "#/components/schemas/AgentStatus" }
        shortName: { type: string, nullable: true }
        captcha: { $ref: "#/components/schemas/CaptchaInfo" }
        maxMessageChars: { type: integer, description: The longest question a visitor may send }
    CaptchaInfo:
      type: object
      required: [provider, siteKey]
      properties:
        provider: { type: string, enum: [none, turnstile] }
        siteKey: { type: string, description: 'The public site key for the browser widget ("" for none)' }
    PublicSessionCreate:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string, format: uuid }
        captchaToken: { type: string, maxLength: 2048 }
        key: { type: string, description: The widget's publishable key (pk_...); omit on the public page }
        embedOrigin: { type: string, description: "The embedding page's origin, as the embed page saw it (widget)" }
    PublicSession:
      type: object
      required: [agentId, channel, expiresAt]
      properties:
        agentId: { type: string, format: uuid }
        channel: { type: string, enum: [public, widget] }
        expiresAt: { type: string, format: date-time }
    PublicSessionState:
      type: object
      required: [session, conversation]
      properties:
        session: { $ref: "#/components/schemas/PublicSession" }
        conversation:
          nullable: true
          description: The session's current conversation (null before the first question)
          allOf: [{ $ref: "#/components/schemas/ConversationDetail" }]
    PublicChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        newConversation: { type: boolean, default: false, description: Start a new conversation within the session }
        stream: { type: boolean, default: true }
    AudienceOption:
      type: object
      required: [audience, allowed, reasons]
      properties:
        audience: { $ref: "#/components/schemas/Audience" }
        allowed: { type: boolean, description: Whether the caller could publish the draft to it now }
        reasons:
          type: array
          description: Why not (role, classification, public access, moderation)
          items: { type: string }
    AgentSharing:
      type: object
      required: [agentId, audience, draftAudience, shortName, publicAgentsEnabled, classification, maxAudience, options, links, widget]
      properties:
        agentId: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/Audience" }
        draftAudience: { $ref: "#/components/schemas/Audience" }
        shortName: { type: string, nullable: true }
        publicAgentsEnabled: { type: boolean }
        classification: { type: string, description: "The draft's knowledge bases' classification" }
        maxAudience: { $ref: "#/components/schemas/Audience" }
        options:
          type: array
          items: { $ref: "#/components/schemas/AudienceOption" }
        links:
          type: object
          required: [team, id, short]
          properties:
            team: { type: string, description: "/a/{team}/{agent}" }
            id: { type: string, description: "/a/id/{uuid}, stable across renames" }
            short: { type: string, nullable: true, description: "/a/{short}" }
        widget:
          type: object
          required: [scriptUrl, integrity, maxMessageChars]
          properties:
            scriptUrl: { type: string, example: "https://rag.example.edu/widget.js" }
            integrity: { type: string, description: 'Subresource Integrity hash of widget.js ("" when the UI is not built)' }
            maxMessageChars: { type: integer, description: "The longest message widget and public-page visitors may send (the team's public limit), for the editor's widget preview" }
    PublishableKeyLimits:
      type: object
      description: Overrides of the per-minute public limits for this key (null inherits; within the platform ceilings)
      properties:
        perIpPerMinute: { type: integer, format: int64, minimum: 0, nullable: true }
        perSessionPerMinute: { type: integer, format: int64, minimum: 0, nullable: true }
    PublishableKey:
      type: object
      required: [id, agentId, name, keyPreview, allowedOrigins, rateLimits, enabled, revision, lastUsedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        name: { type: string }
        keyPreview: { type: string, example: "pk_7Kq2Xw9pLm3a_…" }
        allowedOrigins:
          type: array
          items: { type: string, example: "https://*.example.edu" }
        rateLimits: { $ref: "#/components/schemas/PublishableKeyLimits" }
        enabled: { type: boolean }
        revision: { $ref: "#/components/schemas/Revision" }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublishableKeyCreated:
      allOf:
        - $ref: "#/components/schemas/PublishableKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "The full key (pk_<id>_<secret>). Shown once; put it in the embed snippet." }
    WidgetCheck:
      type: object
      required: [allowed, code, message]
      properties:
        allowed: { type: boolean }
        code: { type: string, nullable: true, description: "Why not: origin_not_allowed, invalid_publishable_key, agent_disabled, public_disabled, agent_not_found" }
        message: { type: string, nullable: true }
        name: { type: string, nullable: true, description: "The agent's name, when it is public" }
        accentColor: { type: string, nullable: true }
    WidgetOriginCheck:
      type: object
      required: [input, origin, problem]
      properties:
        input: { type: string }
        origin: { type: string, nullable: true, description: How it is saved; null when invalid }
        problem: { type: string, nullable: true, description: "What is wrong, e.g. \"an origin has no path: remove everything after the host and port\"" }
    PublishableKeyInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowedOrigins:
          type: array
          maxItems: 20
          description: "Exact origins (https://www.example.edu, http://127.0.0.1:8095) or https://*.example.edu wildcards (subdomains only)"
          items: { type: string }
        enabled: { type: boolean }
        rateLimits: { $ref: "#/components/schemas/PublishableKeyLimits" }
    PublicAccessSettings:
      type: object
      required: [publicAgentsEnabled, revision, updatedAt, captcha, anonSessionTtlSeconds]
      properties:
        publicAgentsEnabled: { type: boolean }
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { type: string, format: date-time }
        captcha:
          allOf: [{ $ref: "#/components/schemas/CaptchaInfo" }]
          description: CAPTCHA_PROVIDER and TURNSTILE_SITE_KEY (configuration, not editable here)
        anonSessionTtlSeconds: { type: integer, description: ANON_SESSION_TTL }
    PublicAccessUpdate:
      type: object
      required: [publicAgentsEnabled]
      properties:
        publicAgentsEnabled: { type: boolean }
    MaintenanceStatus:
      type: object
      required: [enabled, reason, plannedEndAt, startedAt]
      properties:
        enabled: { type: boolean, description: "On: new ingestion is paused; chat and retrieval keep working" }
        reason: { type: string, description: Shown to users while on; empty while off }
        plannedEndAt: { type: string, format: date-time, nullable: true, description: When the admin expects to end it (informational) }
        startedAt: { type: string, format: date-time, nullable: true }
    MaintenanceSettings:
      allOf:
        - $ref: "#/components/schemas/MaintenanceStatus"
        - type: object
          required: [startedBy, updatedBy, updatedAt, revision]
          properties:
            startedBy:
              description: Who turned it on (null while off, or when the user no longer exists)
              nullable: true
              allOf: [{ $ref: "#/components/schemas/PersonRef" }]
            updatedBy:
              description: Who changed it last (null before the first change)
              nullable: true
              allOf: [{ $ref: "#/components/schemas/PersonRef" }]
            updatedAt: { type: string, format: date-time }
            revision: { $ref: "#/components/schemas/Revision" }
    MaintenanceUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500, description: Required when enabled; shown to users }
        plannedEndAt: { type: string, format: date-time, nullable: true, description: Optional; must be in the future }
    MaintenanceErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [maintenance_mode] }
            message: { type: string }
            details:
              type: object
              required: [reason, plannedEndAt]
              properties:
                reason: { type: string }
                plannedEndAt: { type: string, format: date-time, nullable: true }
    BreakGlassScope:
      type: string
      description: "What a break-glass session may read: conversations (the team's conversation list and transcripts) or documents (its data sources, documents and passages)"
      enum: [conversations, documents]
    BreakGlassStatus:
      type: string
      description: "pending: waiting for a second admin; active: reads allowed until expiresAt; ended: ended early (endedBy); expired: its time ran out; denied; cancelled: withdrawn before approval; request_expired: nobody approved it in time"
      enum: [pending, active, ended, expired, denied, cancelled, request_expired]
    BreakGlassReadKind:
      type: string
      enum: [conversation_list, conversation, source_list, source, document_list, document, passages, tags, crawls, boilerplate]
    BreakGlassSession:
      type: object
      required: [id, team, requestedBy, reason, scopes, durationMinutes, status, requestedAt, approvalDeadline, decidedBy, decidedAt, decisionNote, startedAt, expiresAt, endedAt, endedBy]
      properties:
        id: { type: string, format: uuid }
        team: { $ref: "#/components/schemas/TeamRef" }
        requestedBy: { $ref: "#/components/schemas/PersonRef" }
        reason: { type: string, description: Why the admin needs access (shown to the team's owners) }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/BreakGlassScope" }
        durationMinutes: { type: integer }
        status: { $ref: "#/components/schemas/BreakGlassStatus" }
        requestedAt: { type: string, format: date-time }
        approvalDeadline: { type: string, format: date-time, nullable: true, description: When a pending request lapses }
        decidedBy:
          description: The second admin who approved or denied it
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionNote: { type: string, description: The reason for a denial ("" otherwise) }
        startedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        endedBy:
          description: Who ended it early (null when it expired)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
    TeamRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    BreakGlassReadCount:
      type: object
      required: [kind, reads, targets]
      properties:
        kind: { $ref: "#/components/schemas/BreakGlassReadKind" }
        reads: { type: integer, description: Every read of this kind }
        targets: { type: integer, description: "Distinct things read: conversations, documents or sources" }
    BreakGlassSessionDetail:
      allOf:
        - $ref: "#/components/schemas/BreakGlassSession"
        - type: object
          required: [reads]
          properties:
            reads:
              type: array
              items: { $ref: "#/components/schemas/BreakGlassReadCount" }
    BreakGlassSessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BreakGlassSession" }
        nextCursor: { type: string, nullable: true }
    BreakGlassStart:
      type: object
      required: [team, reason, scopes]
      properties:
        team: { type: string, description: Team slug or ID }
        reason: { type: string, minLength: 20, maxLength: 1000, description: Why you need access; the team's owners see it }
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/BreakGlassScope" }
        durationMinutes: { type: integer, minimum: 5, maximum: 1440, description: "Default 60 (capped at the maximum setting)" }
    BreakGlassDeny:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000, description: Shown to the admin who asked }
    BreakGlassRead:
      type: object
      required: [id, occurredAt, kind, targetType, targetId, targetLabel]
      properties:
        id: { type: integer, format: int64, description: The audit log entry }
        occurredAt: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/BreakGlassReadKind" }
        targetType: { type: string, enum: [team, data_source, document, conversation] }
        targetId: { type: string }
        targetLabel: { type: string, description: 'The source or document name ("" for conversations, which are never named, and for targets that no longer exist)' }
    BreakGlassReadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BreakGlassRead" }
        nextCursor: { type: string, nullable: true }
    BreakGlassSettings:
      type: object
      required: [approvalRequired, maxDurationMinutes, approvalTimeoutMinutes, defaultDurationMinutes, minReasonLength, updatedAt, updatedBy, revision]
      properties:
        approvalRequired: { type: boolean, description: "A second platform admin must approve a session before it starts (default off: one admin with a written reason)" }
        maxDurationMinutes: { type: integer, description: The longest session (default 480) }
        approvalTimeoutMinutes: { type: integer, description: A pending request lapses after this long (default 60) }
        defaultDurationMinutes: { type: integer, description: "A session's length unless the admin asks for another: 60, or the maximum when shorter" }
        minReasonLength: { type: integer, description: The shortest reason accepted }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        revision: { $ref: "#/components/schemas/Revision" }
    BreakGlassSettingsUpdate:
      type: object
      required: [approvalRequired, maxDurationMinutes, approvalTimeoutMinutes]
      properties:
        approvalRequired: { type: boolean }
        maxDurationMinutes: { type: integer, minimum: 15, maximum: 1440 }
        approvalTimeoutMinutes: { type: integer, minimum: 5, maximum: 10080 }
    TeamConversation:
      type: object
      required: [id, agentId, agentName, agentSlug, teamSlug, agentDeleted, title, anonymous, questions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        agentSlug: { type: string }
        teamSlug: { type: string }
        agentDeleted: { type: boolean }
        title: { type: string }
        anonymous: { type: boolean, description: A public visitor's conversation (no account) }
        questions: { type: integer, description: How many questions the user asked }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeamConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TeamConversation" }
        nextCursor: { type: string, nullable: true }
    ShortNameUpdate:
      type: object
      required: [shortName]
      properties:
        shortName: { type: string, nullable: true, description: The new short name; null or "" removes it }
    ChatHistoryMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        conversationId: { type: string, format: uuid, description: Continue a conversation (sessions and personal keys) }
        history:
          type: array
          maxItems: 50
          description: Prior turns, for stateless callers (service keys)
          items: { $ref: "#/components/schemas/ChatHistoryMessage" }
        stream: { type: boolean, default: true }
    TestChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        history:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ChatHistoryMessage" }
        stream: { type: boolean, default: true }
    Citation:
      type: object
      description: A source referenced by [n] in the answer. Uploaded files are cited by title only; url is set only for web pages in snippet_link mode.
      required: [n, documentId, sourceId, title, snippet, headingPath]
      properties:
        n: { type: integer }
        documentId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        title: { type: string }
        snippet: { type: string, maxLength: 301 }
        headingPath:
          type: array
          items: { type: string }
        pageStart: { type: integer, format: int32 }
        pageEnd: { type: integer, format: int32 }
        url: { type: string }
        verification:
          type: string
          enum: [verified, unsupported, contradicted, unchecked]
          description: >-
            Set by SystemOne citation checks: whether the source supports the
            claims citing it (the worst verdict of those claims wins);
            unchecked when the check failed or timed out.
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: The model's confidence in the verification }
    ChatUsage:
      type: object
      required: [input, output, reasoning, cacheRead, cacheWrite, total]
      properties:
        input: { type: integer }
        output: { type: integer }
        reasoning: { type: integer, description: Part of output }
        cacheRead: { type: integer }
        cacheWrite: { type: integer }
        total: { type: integer }
    RetrievalHit:
      type: object
      required: [n, title, snippet]
      properties:
        n: { type: integer }
        title: { type: string }
        url: { type: string }
        snippet: { type: string }
        conflicting: { type: boolean, description: "SystemOne judging found it contradicts the question's premise; it was given to the model as conflicting evidence" }
    StopReason:
      type: string
      enum: [stop, length, toolUse, error, aborted]
    ChatAnswer:
      type: object
      description: The reply to a chat with stream false
      required: [conversationId, userMessageId, messageId, persisted, agentVersion, text, thinking, citations, sources, usage, stopReason, refused, noContext, latencyMs]
      properties:
        conversationId: { type: string, format: uuid, nullable: true }
        userMessageId: { type: string, format: uuid, nullable: true }
        messageId: { type: string, format: uuid }
        persisted: { type: boolean, description: False for stateless callers and test chats }
        agentVersion: { type: integer, format: int32, nullable: true }
        text: { type: string }
        thinking: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        sources:
          type: array
          description: Every source given to the model
          items: { $ref: "#/components/schemas/RetrievalHit" }
        usage: { $ref: "#/components/schemas/ChatUsage" }
        stopReason: { $ref: "#/components/schemas/StopReason" }
        errorCode: { type: string, description: "model_unavailable, model_busy (gateway rate limit or overload) or incomplete_answer when the answer failed" }
        errorMessage: { type: string }
        refused: { type: boolean }
        noContext: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        moderation: { $ref: "#/components/schemas/ChatEventModeration" }
    ChatEventConversation:
      type: object
      description: "SSE event conversation"
      required: [conversationId, userMessageId, agentVersion]
      properties:
        conversationId: { type: string, format: uuid, nullable: true }
        userMessageId: { type: string, format: uuid, nullable: true }
        agentVersion: { type: integer, format: int32, nullable: true }
    ChatEventRetrieval:
      type: object
      description: "SSE event retrieval: sent after retrieval (always mode) and after each search (tool mode)"
      required: [query, hits]
      properties:
        query: { type: string }
        hits:
          type: array
          items: { $ref: "#/components/schemas/RetrievalHit" }
        judging:
          type: object
          description: 'SystemOne passage judging of this search, when on: candidates judged, passages given to the model ("20 passages checked, 5 used") and passages dropped'
          required: [judged, kept, dropped]
          properties:
            judged: { type: integer }
            kept: { type: integer }
            dropped: { type: integer }
    ChatEventMessageStart:
      type: object
      description: "SSE event message_start"
      required: [messageId]
      properties:
        messageId: { type: string, format: uuid }
        buffered: { type: boolean, description: "Output moderation buffers the answer: no text or thinking deltas; the text arrives in one text_delta after it passes (show a waiting state)" }
    ChatEventModeration:
      type: object
      description: >-
        SSE event moderation: moderation replaced a message with the notice.
        blocked - the question was blocked (nothing was retrieved or generated);
        retracted - the streamed answer failed the output check (discard it);
        withheld - the buffered answer failed and was never sent; unavailable -
        the safety check could not run (the provider failed or timed out,
        after one retry) and the policy fails closed: the notice asks the
        user to try again, and the OpenAI-compatible endpoint answers 503
        (or a stream error) with code moderation_unavailable.
        message_end.text is the notice.
      required: [stage, action, notice]
      properties:
        stage: { type: string, enum: [input, output] }
        action: { type: string, enum: [blocked, retracted, withheld, unavailable, support], description: "support: a support action replaced the question's answer or the answer with the support message (notice)" }
        category: { $ref: "#/components/schemas/ModerationCategory" }
        notice: { type: string }
    ChatEventDelta:
      type: object
      description: "SSE events thinking_delta and text_delta"
      required: [delta]
      properties:
        delta: { type: string }
    ChatEventToolCall:
      type: object
      description: "SSE event tool_call"
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { description: The model's JSON arguments }
    ChatEventToolResult:
      type: object
      description: "SSE event tool_result"
      required: [id, isError, hitCount]
      properties:
        id: { type: string }
        isError: { type: boolean }
        hitCount: { type: integer }
    ChatEventMessageEnd:
      type: object
      description: "SSE event message_end. text is the final answer text; it replaces the streamed deltas."
      required: [messageId, stopReason, text, citations, usage, refused, noContext]
      properties:
        messageId: { type: string, format: uuid }
        stopReason: { $ref: "#/components/schemas/StopReason" }
        text: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        usage: { $ref: "#/components/schemas/ChatUsage" }
        refused: { type: boolean }
        noContext: { type: boolean }
        noContextReason:
          type: string
          enum: [judged_out, small_talk, out_of_scope]
          description: >-
            judged_out: SystemOne judging dropped every candidate, so a strictly
            grounded agent refused without calling the chat model. small_talk:
            the scope check found small talk, answered without retrieval.
            out_of_scope: the scope check found the question outside the
            agent's subject, and a strictly grounded agent refused without
            retrieval or a chat-model call.
    ChatEventCitationsChecked:
      type: object
      description: >-
        SSE event citations_checked (SystemOne citation checks, streaming
        modes): follows message_end. citations replace the answer's; text is
        the final text (changed in enforce mode, where unsupported markers are
        removed or, with refused, the answer is replaced by the refusal).
      required: [messageId, text, citations, refused, verified, unsupported, unchecked]
      properties:
        messageId: { type: string, format: uuid }
        text: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        refused: { type: boolean }
        verified: { type: integer, description: Claim–source pairs verified }
        unsupported: { type: integer, description: Pairs unsupported or contradicted }
        unchecked: { type: integer, description: Pairs not checked (error or timeout) }
    ChatEventError:
      type: object
      description: "SSE event error (for example model_unavailable, model_busy or incomplete_answer)"
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Conversation:
      type: object
      required: [id, agentId, agentName, agentSlug, teamSlug, agentDeleted, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        agentSlug: { type: string }
        teamSlug: { type: string }
        agentDeleted: { type: boolean, description: The agent was deleted; the conversation is read-only }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: string, nullable: true }
    ConversationToolCall:
      type: object
      required: [id, name, arguments, isError, hitCount]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { description: The model's JSON arguments }
        isError: { type: boolean }
        hitCount: { type: integer }
        query: { type: string }
    FeedbackRating:
      type: string
      enum: [up, down]
    FeedbackReason:
      type: string
      enum: [incorrect, not_helpful, missing_sources, wrong_sources, outdated, harmful_or_unsafe, other]
    ConversationMessage:
      type: object
      required: [id, seq, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int32 }
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
        thinking: { type: string }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/ConversationToolCall" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        stopReason: { $ref: "#/components/schemas/StopReason" }
        errorCode: { type: string, description: "moderation_blocked, moderation_withheld, moderation_support or moderation_unavailable (the safety check could not run; try again) when text is a moderation notice" }
        usage: { $ref: "#/components/schemas/ChatUsage" }
        latencyMs: { type: integer, format: int32 }
        feedback: { $ref: "#/components/schemas/FeedbackRating" }
        feedbackReason: { $ref: "#/components/schemas/FeedbackReason" }
        createdAt: { type: string, format: date-time }
    ConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: "#/components/schemas/Conversation" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
    ConversationUpdate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    Feedback:
      type: object
      required: [rating]
      properties:
        rating: { $ref: "#/components/schemas/FeedbackRating" }
        reason: { $ref: "#/components/schemas/FeedbackReason" }
    FeedbackResult:
      type: object
      required: [messageId, rating]
      properties:
        messageId: { type: string, format: uuid }
        rating: { $ref: "#/components/schemas/FeedbackRating" }
        reason: { $ref: "#/components/schemas/FeedbackReason" }
    AgentAnalyticsTotals:
      type: object
      required: [conversations, answers, uniqueUsers, up, down, satisfaction, noContextRate, refusalRate, errorRate, latencyP50Ms, latencyP95Ms, firstTokenP50Ms, moderation, judging, citations, scope]
      properties:
        conversations: { type: integer, format: int64, description: Stored conversations started }
        answers: { type: integer, format: int64 }
        uniqueUsers: { type: integer, format: int64, description: Distinct pseudonymous users (service keys are not counted) }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
        satisfaction: { type: number, format: double, nullable: true, description: up / (up + down) }
        noContextRate: { type: number, format: double, nullable: true }
        refusalRate: { type: number, format: double, nullable: true }
        errorRate: { type: number, format: double, nullable: true }
        latencyP50Ms: { type: number, format: double, nullable: true }
        latencyP95Ms: { type: number, format: double, nullable: true }
        firstTokenP50Ms: { type: number, format: double, nullable: true }
        moderation: { $ref: "#/components/schemas/ModerationTotals" }
        judging: { $ref: "#/components/schemas/JudgingTotals" }
        citations: { $ref: "#/components/schemas/CitationTotals" }
        scope: { $ref: "#/components/schemas/ScopeTotals" }
    AgentAnalyticsDay:
      type: object
      required: [date, conversations, answers]
      properties:
        date: { type: string, format: date }
        conversations: { type: integer, format: int64 }
        answers: { type: integer, format: int64 }
    AgentAnalyticsModel:
      type: object
      required: [modelId, modelName, answers, inputTokens, outputTokens, reasoningTokens]
      properties:
        modelId: { type: string, format: uuid }
        modelName: { type: string }
        answers: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        reasoningTokens: { type: integer, format: int64 }
    AgentAnalyticsDocument:
      type: object
      required: [documentId, title, citations]
      properties:
        documentId: { type: string, format: uuid }
        title: { type: string, description: '"" when the document was deleted' }
        citations: { type: integer, format: int64 }
    AgentAnalytics:
      type: object
      required: [from, to, totals, daily, models, topDocuments, feedbackReasons, channels, audiences, moderation]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/AgentAnalyticsTotals" }
        daily:
          type: array
          items: { $ref: "#/components/schemas/AgentAnalyticsDay" }
        models:
          type: array
          items: { $ref: "#/components/schemas/AgentAnalyticsModel" }
        topDocuments:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AgentAnalyticsDocument" }
        feedbackReasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { $ref: "#/components/schemas/FeedbackReason" }
              count: { type: integer, format: int64 }
        channels:
          type: array
          description: Answers by channel, including test chats
          items:
            type: object
            required: [channel, answers]
            properties:
              channel: { $ref: "#/components/schemas/AnalyticsChannel" }
              answers: { type: integer, format: int64 }
        audiences:
          type: array
          description: Answers by the audience the agent had when it answered, largest first (test chats excluded)
          items:
            type: object
            required: [audience, answers]
            properties:
              audience: { $ref: "#/components/schemas/Audience" }
              answers: { type: integer, format: int64 }
        moderation:
          type: array
          items: { $ref: "#/components/schemas/ModerationCount" }
    AnalyticsChannel:
      type: string
      description: How an answer was requested (ui is the chat page, public the public chat page, widget the embed)
      enum: [ui, api, openai, test, public, widget]
    ModerationCount:
      type: object
      description: Blocked and flagged questions (stage input) and answers (stage output) by top category; error is a provider failure, which blocks when the policy fails closed
      required: [stage, decision, category, count]
      properties:
        stage: { type: string, enum: [input, output] }
        decision: { type: string, enum: [block, flag, support, error] }
        category: { type: string, description: 'The top category ('''' for provider errors)' }
        count: { type: integer, format: int64 }
    ModerationTotals:
      type: object
      description: Moderation outcomes counted by answer
      required: [questionsBlocked, answersWithheld, flagged, supported]
      properties:
        questionsBlocked: { type: integer, format: int64, description: Questions blocked by input moderation }
        answersWithheld: { type: integer, format: int64, description: Answers blocked by output moderation (withheld or retracted) }
        flagged: { type: integer, format: int64, description: Answers with a flag on the question or the answer }
        supported: { type: integer, format: int64, description: Answers replaced by the support message }
    JudgingTotals:
      type: object
      description: SystemOne passage judging over the range, from the content-free judging records (all zero when nothing was judged)
      required: [answers, candidates, evidence, conflicting, kept, dropped, skipped, judgedOut, requests, latencyP50Ms, latencyP95Ms]
      properties:
        answers: { type: integer, format: int64, description: Answers whose passages were judged }
        candidates: { type: integer, format: int64, description: Passages judged }
        evidence: { type: integer, format: int64 }
        conflicting: { type: integer, format: int64 }
        kept: { type: integer, format: int64, description: Passages given to the model }
        dropped:
          type: object
          required: [injection, irrelevant, notUsable]
          properties:
            injection: { type: integer, format: int64 }
            irrelevant: { type: integer, format: int64 }
            notUsable: { type: integer, format: int64 }
        skipped: { type: integer, format: int64, description: Requests that failed or timed out (the passage kept its rank) }
        judgedOut: { type: integer, format: int64, description: Strict refusals without a chat-model call because every candidate was dropped }
        requests: { type: integer, format: int64 }
        latencyP50Ms: { type: number, format: double, nullable: true, description: Latency judging added to an answer }
        latencyP95Ms: { type: number, format: double, nullable: true }
    CitationTotals:
      type: object
      description: SystemOne citation checks over the range, from the content-free records; counts are claim–source pairs (all zero when nothing was checked)
      required: [answers, pairs, verified, unsupported, contradicted, unchecked, lowConfidence, removed, refused, supportRate, latencyP50Ms, latencyP95Ms]
      properties:
        answers: { type: integer, format: int64, description: Answers whose citations were checked }
        pairs: { type: integer, format: int64, description: Claim–source pairs asked }
        verified: { type: integer, format: int64 }
        unsupported: { type: integer, format: int64 }
        contradicted: { type: integer, format: int64 }
        unchecked: { type: integer, format: int64, description: Pairs whose request failed or timed out }
        lowConfidence: { type: integer, format: int64, description: Verdicts below the auto-accept confidence (for review) }
        removed: { type: integer, format: int64, description: Markers removed in enforce mode }
        refused: { type: integer, format: int64, description: Answers replaced by the refusal in enforce mode }
        supportRate: { type: number, format: double, nullable: true, description: "verified / (verified + unsupported + contradicted)" }
        latencyP50Ms: { type: number, format: double, nullable: true, description: Time the check took per answer }
        latencyP95Ms: { type: number, format: double, nullable: true }
    ScopeTotals:
      type: object
      description: SystemOne scope checks over the range, from the content-free records (all zero when nothing was checked)
      required: [checked, smallTalk, outOfScope, refused, skipped, latencyP50Ms]
      properties:
        checked: { type: integer, format: int64, description: Messages checked }
        smallTalk: { type: integer, format: int64, description: Answered as small talk without retrieval }
        outOfScope: { type: integer, format: int64 }
        refused: { type: integer, format: int64, description: Out-of-scope questions refused without retrieval or a chat-model call }
        skipped: { type: integer, format: int64, description: Checks that failed or timed out (answered normally) }
        latencyP50Ms: { type: number, format: double, nullable: true }
    PlatformAnalyticsTotals:
      type: object
      required: [answers, conversations, uniqueUsers, up, down, satisfaction, noContextRate, refusalRate, errorRate, latencyP50Ms, latencyP95Ms, firstTokenP50Ms, moderation, judging, citations, scope]
      properties:
        answers: { type: integer, format: int64 }
        conversations: { type: integer, format: int64, description: Stored conversations started }
        uniqueUsers:
          type: integer
          format: int64
          description: Distinct pseudonymous IDs. They are per team (per agent for anonymous sessions), so a person using two teams' agents counts twice; service keys are not counted.
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
        satisfaction: { type: number, format: double, nullable: true, description: up / (up + down) }
        noContextRate: { type: number, format: double, nullable: true }
        refusalRate: { type: number, format: double, nullable: true }
        errorRate: { type: number, format: double, nullable: true }
        latencyP50Ms: { type: number, format: double, nullable: true }
        latencyP95Ms: { type: number, format: double, nullable: true }
        firstTokenP50Ms: { type: number, format: double, nullable: true }
        moderation: { $ref: "#/components/schemas/ModerationTotals" }
        judging: { $ref: "#/components/schemas/JudgingTotals" }
        citations: { $ref: "#/components/schemas/CitationTotals" }
        scope: { $ref: "#/components/schemas/ScopeTotals" }
    PlatformAnalyticsDay:
      type: object
      required: [date, answers, conversations, noContext, refused, moderationBlocked, moderationFlagged]
      properties:
        date: { type: string, format: date }
        answers: { type: integer, format: int64 }
        conversations: { type: integer, format: int64 }
        noContext: { type: integer, format: int64 }
        refused: { type: integer, format: int64 }
        moderationBlocked: { type: integer, format: int64, description: Answers whose question or answer was blocked }
        moderationFlagged: { type: integer, format: int64 }
    PlatformAnalyticsModel:
      type: object
      description: One model's tokens in the usage ledger (all usage, including draft tests, and ingestion for embedding models)
      required: [modelId, modelName, kind, chatInputTokens, chatOutputTokens, embeddingTokens]
      properties:
        modelId: { type: string, format: uuid }
        modelName: { type: string, description: '"" when the model was deleted' }
        kind: { type: string, description: 'The model kind (chat, embedding, …; "" when deleted)' }
        chatInputTokens: { type: integer, format: int64 }
        chatOutputTokens: { type: integer, format: int64 }
        embeddingTokens: { type: integer, format: int64 }
    PlatformAnalyticsAgent:
      type: object
      required: [agentId, agentSlug, agentName, teamId, teamSlug, teamName, deleted, answers, noContextRate, satisfaction, citationSupportRate]
      properties:
        agentId: { type: string, format: uuid }
        agentSlug: { type: string, description: '"" when the agent no longer exists' }
        agentName: { type: string }
        teamId: { type: string, format: uuid }
        teamSlug: { type: string, description: '"" when the team no longer exists' }
        teamName: { type: string }
        deleted: { type: boolean, description: The agent was deleted since }
        answers: { type: integer, format: int64 }
        noContextRate: { type: number, format: double }
        satisfaction: { type: number, format: double, nullable: true }
        citationSupportRate: { type: number, format: double, nullable: true, description: "SystemOne citation checks: verified / checked claim–source pairs; null when nothing was checked" }
    PlatformAnalyticsTeam:
      type: object
      required: [teamId, teamSlug, teamName, answers, agents]
      properties:
        teamId: { type: string, format: uuid }
        teamSlug: { type: string, description: '"" when the team no longer exists' }
        teamName: { type: string }
        answers: { type: integer, format: int64 }
        agents: { type: integer, format: int64, description: Agents with answers in the range }
    PlatformAnalytics:
      type: object
      required: [from, to, totals, audiences, channels, moderation, models, topAgents, topTeams, daily]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/PlatformAnalyticsTotals" }
        audiences:
          type: array
          description: Answers by audience and their share of all answers, largest first
          items:
            type: object
            required: [audience, answers, share]
            properties:
              audience: { $ref: "#/components/schemas/Audience" }
              answers: { type: integer, format: int64 }
              share: { type: number, format: double }
        channels:
          type: array
          description: Answers by channel and their share of all answers, largest first
          items:
            type: object
            required: [channel, answers, share]
            properties:
              channel: { $ref: "#/components/schemas/AnalyticsChannel" }
              answers: { type: integer, format: int64 }
              share: { type: number, format: double }
        moderation:
          type: array
          items: { $ref: "#/components/schemas/ModerationCount" }
        models:
          type: array
          items: { $ref: "#/components/schemas/PlatformAnalyticsModel" }
        topAgents:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/PlatformAnalyticsAgent" }
        topTeams:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/PlatformAnalyticsTeam" }
        daily:
